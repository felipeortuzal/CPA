name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run validate:curriculum
      - run: npm run validate:lessons
      - run: npm run validate:questions
      - run: npm run validate:sources
      - run: npm run validate:experience
      - run: npm run audit:v13
      - run: npm run validate:v21
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        with:
          name: CPA-Study-offline
          path: dist/CPA_Study.html
