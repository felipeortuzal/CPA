name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run validate:curriculum
      - run: npm run validate:questions
      - run: npm run validate:sources
      - run: npm run validate:experience
      - run: npm run audit:v13
      - run: npm test
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
