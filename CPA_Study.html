ibutável dentro do limite aplicável; no resgate ou benefício, a tributação incide sobre o valor recebido segundo o regime escolhido.","2.2.1.2":"VGBL é seguro de pessoas com cobertura por sobrevivência usado para acumulação de longo prazo; não gera a mesma dedução fiscal do PGBL e, em regra, o IR incide apenas sobre os rendimentos no resgate ou benefício.","2.2.2.1":"No regime progressivo de previdência, a tributação segue a lógica da tabela progressiva do IR, com antecipação na fonte e ajuste conforme a situação fiscal da pessoa, sendo mais aderente quando renda tributável futura tende a ser menor.","2.2.2.2":"No regime regressivo de previdência, a alíquota diminui conforme o prazo de cada contribuição, favorecendo horizontes longos e sendo definitiva na fonte conforme as regras vigentes.","2.2.3.1":"Planos de previdência possuem fase de acumulação, em que contribuições formam a reserva, e fase de benefícios, em que o patrimônio é convertido em renda ou pagamento conforme a modalidade contratada.","2.2.3.2":"Taxas em previdência podem remunerar administração do fundo ou cobrir carregamento/saída quando previstas; elas reduzem o resultado líquido e devem ser comparadas com a política e o serviço oferecido.","2.2.3.3":"Portabilidade permite transferir recursos entre planos compatíveis sem caracterizar resgate, preservando a finalidade previdenciária e seguindo regras de carência, regime tributário e titularidade aplicáveis.","2.2.3.4.1":"Renda Mensal Vitalícia paga benefício enquanto a pessoa assistida viver, cessando conforme as condições do contrato e sem prazo certo de duração.","2.2.3.4.2":"Renda Mensal Vitalícia com prazo mínimo garantido paga enquanto a pessoa vive e mantém pagamentos aos beneficiários pelo período mínimo contratado se ocorrer falecimento antes do prazo.","2.2.3.4.3":"Renda Mensal Vitalícia com reversão a beneficiário indicado mantém renda à pessoa assistida e, após seu falecimento, reverte percentual ou valor ao beneficiário conforme o plano.","2.2.3.4.4":"Renda Mensal Vitalícia reversível ao cônjuge com continuidade aos menores combina proteção vitalícia com reversão sucessiva, conforme percentuais e condições definidos no contrato.","2.2.3.4.5":"Renda mensal temporária paga benefício por período determinado enquanto a pessoa estiver viva, cessando no fim do prazo ou no falecimento conforme as condições previstas.","2.2.3.4.6":"Renda mensal por prazo certo paga durante número fixo de meses, independentemente da sobrevivência da pessoa assistida, observada a indicação de beneficiários e regras do plano.","2.2.3.4.7":"Pagamento único liquida a reserva previdenciária de uma vez, substituindo a conversão em renda periódica e concentrando o impacto financeiro e tributário no evento.","2.3.1.1":"Rating de crédito, score e comprovação de renda são instrumentos para avaliar capacidade e probabilidade de pagamento; nenhum deles, isoladamente, substitui análise completa de crédito.","2.3.1.2":"Empréstimo disponibiliza recursos sem vinculação obrigatória a um bem específico; financiamento costuma ter destinação definida e pode usar o bem financiado como garantia; leasing envolve arrendamento com regras próprias.","2.3.1.3":"O SCR reúne informações de operações de crédito reportadas ao Banco Central e auxilia instituições e clientes na avaliação de endividamento e histórico, respeitando regras de acesso e atualização.","2.3.2.1":"Cartão de crédito oferece limite para compras e pode gerar juros elevados quando a fatura não é paga integralmente; pagamento parcial leva saldo a modalidades de financiamento segundo regras vigentes.","2.3.2.2":"A taxa efetiva do refinanciamento de fatura depende do saldo financiado, prazo e encargos; comparar CET e valor total a pagar é mais útil do que olhar apenas a taxa nominal.","2.3.3.1":"Cheque especial é crédito rotativo vinculado à conta corrente; juros e IOF incidem sobre o valor e período efetivamente utilizados, tornando uso prolongado normalmente caro.","2.3.4.1":"No crédito consignado, parcelas são descontadas diretamente de renda ou benefício e a margem consignável limita o comprometimento permitido conforme a legislação aplicável.","2.3.4.2":"O consignado costuma ter juros menores e prazos mais longos que crédito pessoal sem garantia porque a forma de pagamento reduz o risco de inadimplência para o credor.","2.3.5.1":"No CDC, um bem pode servir como garantia ou estar vinculado à operação, reduzindo risco do credor e influenciando taxa, prazo e condições de retomada em caso de inadimplência.","2.3.5.2":"CDC financia consumo com prazo e destinação definidos; avaliar valor financiado, entrada, CET, prazo e valor total é essencial antes de comparar propostas.","2.3.6":"Crédito imobiliário financia aquisição, construção ou reforma de imóveis com prazos longos e garantias específicas, exigindo análise de renda, entrada, sistema de amortização, juros e custos acessórios.","2.3.7":"Capital de giro financia necessidades operacionais de empresas, como estoques, fornecedores e ciclo financeiro; prazo e estrutura devem ser compatíveis com a geração de caixa do negócio.","2.3.8":"Consórcio é autofinanciamento coletivo administrado por empresa autorizada, sem promessa de contemplação imediata; o participante paga parcelas e concorre a crédito por sorteio ou lance conforme as regras do grupo."},Vp={area:e=>e.startsWith("2.2")?"previdência complementar aberta":"crédito e financiamento",beginner:(e,r,s)=>e.startsWith("2.2")?`Previdência combina objetivo de longo prazo, benefício fiscal possível e escolha de renda futura. ${s} Em ${r}, conecte sempre prazo, regime tributário, beneficiários e necessidade de liquidez.`:`Crédito resolve uma necessidade hoje usando renda futura. ${s} Em ${r}, compare finalidade, garantia, prazo, CET, capacidade de pagamento e risco de superendividamento.`,complete:(e,r,s)=>[`${s} Este item faz parte de ${e.startsWith("2.2")?"previdência complementar":"produtos de financiamento"} no Programa Detalhado CPA 1.2.`,e.startsWith("2.2")?"A análise deve considerar PGBL ou VGBL, horizonte, fase de acumulação, regime progressivo ou regressivo, portabilidade, taxas, forma de recebimento e situação fiscal do cliente.":"A concessão responsável de crédito exige adequação à necessidade, capacidade de pagamento, renda disponível, garantias, histórico, CET, prazo e consequências de atraso.",`Na CPA, ${r} tende a aparecer em situação de atendimento: o objetivo é escolher ou explicar a alternativa compatível com a necessidade do cliente, e não apenas repetir uma definição.`],essentials:(e,r,s)=>[s.split(/[.;]/)[0],`PD ${e} · ${r}`,e.startsWith("2.2")?"Prazo + tributação + portabilidade + renda futura":"Necessidade + capacidade de pagamento + garantia + CET + prazo",e.startsWith("2.2")?"Benefício fiscal não substitui adequação do produto":"Crédito mais barato nem sempre é crédito adequado se a parcela não couber no orçamento"],focus:(e,r)=>e.startsWith("2.2")?[`Escolher ou explicar ${r} em um caso de planejamento de longo prazo.`,"Distinguir PGBL, VGBL, regime progressivo, regressivo, portabilidade e formas de renda.","Avaliar impacto tributário e necessidade de liquidez sem prometer benefício automático."]:[`Escolher ou explicar ${r} a partir da necessidade e capacidade de pagamento do cliente.`,"Comparar CET, prazo, garantia, parcela e valor total a pagar.","Reconhecer sinais de endividamento excessivo e evitar oferecer crédito apenas pelo limite disponível."],practical:(e,r)=>e.startsWith("2.2")?`Uma cliente de 38 anos quer aposentadoria aos 60, faz declaração completa e não pretende usar o dinheiro no curto prazo. Ao discutir ${r}, você avalia PGBL/VGBL, regime de tributação, portabilidade, taxas e modalidade de renda, sem tratar benefício fiscal como retorno garantido.`:`Um cliente precisa financiar uma despesa e recebe duas propostas. Ao discutir ${r}, você compara CET, parcela, prazo, garantia e impacto no orçamento mensal antes de recomendar qualquer contratação.`,comparisons:e=>e==="2.2.1.1"||e==="2.2.1.2"?[{left:"PGBL",right:"VGBL",explanation:"PGBL e VGBL podem usar fundos semelhantes, mas têm tratamento fiscal diferente: no PGBL elegível há dedução limitada e tributação sobre o valor recebido; no VGBL não há a mesma dedução e o IR recai sobre rendimentos."}]:e.startsWith("2.2.2")?[{left:"Progressivo",right:"Regressivo",explanation:"O progressivo se relaciona à renda tributável e ajuste anual; o regressivo reduz alíquota conforme o tempo de cada contribuição e é definitivo na fonte."}]:e.startsWith("2.2.3.4")?[{left:"Renda vitalícia",right:"Renda por prazo certo",explanation:"A vitalícia depende da sobrevivência e das regras de reversão; a renda por prazo certo tem duração contratual definida."}]:e==="2.3.1.2"?[{left:"Empréstimo",right:"Financiamento",explanation:"Empréstimo normalmente não exige destinação específica; financiamento costuma estar vinculado a um bem ou finalidade e pode contar com garantia associada."}]:e.startsWith("2.3.4")?[{left:"Consignado",right:"Crédito pessoal sem garantia",explanation:"O consignado usa desconto direto e tende a ter menor risco para o credor; crédito pessoal sem garantia depende mais da avaliação de renda e score."}]:[{left:"Taxa nominal",right:"CET",explanation:"Taxa nominal é apenas um componente; o Custo Efetivo Total incorpora juros, tarifas, tributos e demais despesas obrigatórias da operação."}],formulas:e=>e==="2.3.2.2"||e==="2.3.3.1"?[{name:"Juro proporcional simplificado",expression:"J = principal × taxa do período × número de períodos",explanation:"Serve para exercícios simples. Em operações reais, observe capitalização, CET, IOF e periodicidade informada."}]:e.startsWith("2.3.4.1")?[{name:"Margem consignável",expression:"parcela máxima = renda elegível × percentual de margem",explanation:"O percentual aplicável depende da categoria e da legislação vigente; a prova pode fornecer o limite."}]:[],traps:(e,r)=>e.startsWith("2.2")?[`Não trate ${r} como investimento de liquidez imediata ou como benefício fiscal automático para qualquer cliente.`,"PGBL e VGBL não diferem apenas pelo nome do produto; a base tributável é diferente.","Portabilidade não é resgate e não deve ser tratada como entrada de dinheiro na conta do cliente."]:[`Não trate limite de crédito disponível como prova de que ${r} cabe no orçamento do cliente.`,"Compare CET e valor total, não apenas a menor taxa anunciada.","Garantia reduz risco do credor, mas não elimina o risco de endividamento do cliente."],summary:(e,r,s)=>[`${e} · ${r}.`,s,e.startsWith("2.2")?"Pergunte: qual objetivo, qual prazo, qual regime tributário e como o benefício será recebido?":"Pergunte: para que serve, quanto custa no total, qual parcela cabe e qual garantia está envolvida?"],sourceIds:e=>e.startsWith("2.2")?["ANBIMA_PD","SUSEP_PREVIDENCIA","SUSEP"]:e.startsWith("2.3.1.3")?["ANBIMA_PD","BCB_SCR","BCB_SFN"]:["ANBIMA_PD","BCB_SFN"]},_i=zr(dr,"2.2.",Lp,Vp).concat(zr(dr,"2.3.",Lp,Vp)).sort((e,r)=>e.pdCode.localeCompare(r.pdCode,void 0,{numeric:!0,sensitivity:"base"}));if(_i.length!==27)throw new Error(`Temas 2.2 e 2.3 deveriam possuir 27 aulas; foram geradas ${_i.length}.`);new Map(_i.map(e=>[e.pdCode,e]));const Fp={"2.4.1.1":"Conta corrente pode receber salários e outros créditos, mas conta-salário é produto específico voltado ao pagamento de remuneração e possui regras próprias de movimentação e portabilidade.","2.4.1.2.1":"Depósitos à vista elegíveis podem contar com cobertura do FGC dentro dos limites e condições vigentes, mas saldo acima do limite continua exposto ao risco da instituição.","2.4.1.2.2":"Depósito compulsório é parcela de determinados recursos captados que instituições devem recolher ao Banco Central, funcionando como instrumento prudencial e de política monetária.","2.4.1.3":"Boleto bancário é instrumento de cobrança com dados padronizados que permite pagamento e liquidação por instituições participantes, devendo o cliente conferir emissor, valor e vencimento.","2.4.1.4":"Serviços digitais bancários permitem contratação, movimentação, atendimento e pagamentos por canais eletrônicos, ampliando conveniência e exigindo cuidados adicionais de segurança e autenticação.","2.4.1.5.1":"Pix é o arranjo de pagamentos instantâneos brasileiro, criado para transferências e pagamentos em poucos segundos, disponível continuamente e liquidado em infraestrutura operada pelo Banco Central.","2.4.1.5.2":"No Pix, chaves facilitam a iniciação do pagamento, participantes encaminham a ordem e a liquidação ocorre no SPI; tarifas e limites dependem do tipo de cliente e regras aplicáveis.","2.4.1.5.3":"Pix pode ser usado para transferências e pagamentos de pessoas e empresas, incluindo QR Code e outras formas de iniciação previstas no arranjo.","2.4.1.5.4":"Para pessoas jurídicas, Pix facilita pagamentos e recebimentos com integração a sistemas, QR Codes e conciliação, sujeito às condições comerciais e regras do participante.","2.4.1.6.1":"Tarifas bancárias só podem ser cobradas quando autorizadas pelas regras aplicáveis e informadas ao cliente; determinados serviços essenciais possuem gratuidade mínima.","2.4.1.7.1":"Atendimento bancário combina canais presenciais e digitais e deve observar regras de funcionamento, disponibilidade e tratamento adequado ao consumidor conforme a localidade e o serviço.","2.4.2.1":"Conta internacional facilita manter saldo, pagar, receber e converter moedas, mas envolve risco cambial, custos, tributação e regras de disponibilidade diferentes de uma conta doméstica.","2.4.2.2":"Operações internacionais podem sofrer IOF com alíquotas diferentes conforme natureza da operação, por isso o cliente deve identificar finalidade antes de estimar o custo.","2.4.2.3":"Investimentos mantidos no exterior podem gerar obrigações de declaração e tributação no Brasil; o investidor residente deve considerar regras fiscais brasileiras além da tributação no país do ativo.","2.4.3.1":"Correspondentes cambiais podem atuar em operações autorizadas em nome de instituições, dentro de limites, procedimentos de identificação e controles definidos pela regulação.","2.4.3.2":"Compra e venda de moeda estrangeira em instituições autorizadas exige identificação, registro e observância das regras cambiais aplicáveis à finalidade e ao valor da operação.","2.4.3.3":"Recompra de moeda estrangeira ocorre quando a instituição readquire moeda anteriormente vendida ou remanescente de viagem, segundo regras, documentação e condições comerciais vigentes.","2.5.1.1":"Seguro de vida inteira busca proteção por prazo indeterminado enquanto o contrato estiver vigente e pode combinar características de proteção e formação de reserva conforme o produto.","2.5.1.2":"Seguro de vida temporário cobre o risco por período definido e tende a concentrar o prêmio na proteção durante aquele prazo, cessando a cobertura ao fim se não houver renovação.","2.5.1.3":"Seguro de vida tradicional transfere determinados riscos pessoais à seguradora mediante pagamento de prêmio, com capital segurado, beneficiários, coberturas e exclusões definidos em contrato.","2.5.2.1":"Seguro automóvel protege contra eventos cobertos ligados ao veículo e responsabilidade civil conforme apólice, franquia, limites e exclusões contratadas.","2.5.2.2":"Seguro residencial cobre riscos previstos para imóvel e conteúdo, podendo incluir assistências e responsabilidade civil; a extensão depende das coberturas efetivamente contratadas.","2.5.2.3":"Seguro prestamista quita ou amortiza obrigação financeira em eventos cobertos do devedor, protegendo simultaneamente o contratante e o credor dentro dos limites da apólice."},$p={area:e=>e.startsWith("2.4")?"serviços bancários e câmbio":"seguros de vida e patrimoniais",beginner:(e,r,s)=>e.startsWith("2.4")?`Serviços bancários são a infraestrutura do dia a dia financeiro. ${s} Ao estudar ${r}, foque em funcionamento, custo, segurança, liquidação, direitos do cliente e quando cada serviço é adequado.`:`Seguro transfere um risco específico para a seguradora mediante pagamento de prêmio. ${s} Em ${r}, identifique o evento coberto, o capital segurado, franquias, exclusões, beneficiários e prazo de proteção.`,complete:(e,r,s)=>[`${s} Este item integra o bloco de ${e.startsWith("2.4")?"serviços bancários":"seguros"} do Programa Detalhado CPA 1.2.`,e.startsWith("2.4")?"A prova pode combinar tarifa, canal, liquidação, segurança, câmbio, IOF e atendimento. O raciocínio correto começa pela finalidade concreta do serviço e pelo risco operacional ou financeiro envolvido.":"Seguro não é investimento por definição. A análise adequada separa risco coberto, prêmio, capital segurado, franquia, carência, exclusões, prazo e necessidade real de proteção.",`Em atendimento, ${r} deve ser explicado em linguagem simples, sem prometer gratuidade, cobertura, liquidez ou proteção além do que as regras e o contrato realmente oferecem.`],essentials:(e,r,s)=>[s.split(/[.;]/)[0],`PD ${e} · ${r}`,e.startsWith("2.4")?"Finalidade + custo + canal + liquidação + segurança":"Risco coberto + prêmio + capital segurado + exclusões + prazo",e.startsWith("2.4")?"Serviço conveniente também precisa ser seguro e transparente":"Cobertura só existe para eventos e condições previstos na apólice"],focus:(e,r)=>e.startsWith("2.4")?[`Explicar ou escolher ${r} em uma situação real de movimentação, pagamento, câmbio ou atendimento.`,"Identificar custos, tarifas, IOF, liquidação e riscos operacionais.","Distinguir conta, pagamento, Pix, câmbio e serviço digital sem confundir suas regras."]:[`Escolher ou explicar ${r} a partir do risco que o cliente quer proteger.`,"Distinguir cobertura, exclusão, franquia, capital segurado e beneficiário.","Evitar tratar seguro como promessa de indenização para qualquer evento."],practical:(e,r)=>e.startsWith("2.4")?`Um cliente precisa realizar uma operação envolvendo ${r}. Antes de responder, você verifica finalidade, valor, urgência, tarifa, segurança, risco de fraude, eventual câmbio/IOF e o canal mais adequado.`:`Uma família quer proteger seu patrimônio Ativos de uso atendem necessidades pessoais, como moradia e veículo; ativos de não uso têm função predominantemente patrimonial ou de investimento e devem ser avaliados separadamente no balanço pessoal.":s.includes("patrimônio líquido pessoal")?"Patrimônio líquido pessoal é a diferença entre ativos e passivos de uma pessoa ou família e mostra, em uma fotografia, a riqueza líquida acumulada.":s.includes("etapas do processo")?"Planejamento financeiro é processo contínuo: entender objetivos, diagnosticar situação atual, construir plano, implementar ações e revisar periodicamente diante de mudanças de vida e mercado.":s.includes("momento de vida")?"Momento de vida e situação financeira alteram prioridades de liquidez, proteção, risco e horizonte; orientação adequada deve refletir a fase concreta do cliente.":s.includes("metas financeiras")?"Meta financeira eficaz combina objetivo, valor, prazo, prioridade e estratégia de financiamento, permitindo acompanhar progresso e ajustar o plano.":s.includes("planejamento de investimentos")?"Planejamento de investimentos conecta objetivos e prazos a uma carteira diversificada compatível com liquidez, risco, tributação e capacidade de perda.":s.includes("fundo educacional")?"Planejamento educacional estima valor futuro dos estudos, prazo até o desembolso e contribuições necessárias, reduzindo risco conforme a data de uso se aproxima.":s.includes("aposentadoria")?"Planejamento de aposentadoria estima patrimônio necessário para sustentar renda desejada, considerando tempo de acumulação, inflação, longevidade, retorno e taxa de retirada.":s.includes("declaração de imposto")?"A declaração de IRPF reúne bens, direitos, dívidas e rendimentos conforme regras da Receita; investimentos podem gerar informações e eventos tributáveis distintos.":s.includes("classificação de rendimentos")?"Classificar corretamente rendimentos como tributáveis, isentos ou sujeitos à tributação exclusiva é essencial para compreender sua apresentação na declaração e seu impacto fiscal.":s.includes("modelo completo")?"A comparação entre deduções legais e desconto simplificado depende da situação do contribuinte; o melhor modelo é o que resulta em menor imposto dentro das regras aplicáveis.":e.startsWith("3.2")?`${r} integra a organização financeira do cliente: a decisão adequada deve equilibrar objetivo, horizonte, risco, liquidez, dívida, proteção e capacidade de manter o plano ao longo do tempo.`:s.includes("perfis da pessoa investidora")?"Perfil do investidor sintetiza objetivos, situação financeira, conhecimento, experiência e tolerância/capacidade de risco para orientar a adequação de produtos e serviços.":s.includes("adequação de produtos financeiros")?"Adequação exige compatibilidade entre características e riscos do produto e o perfil, objetivos, horizonte, situação financeira e conhecimento do cliente.":s.includes("avaliação de risco e retorno")?"Risco e retorno devem ser avaliados em conjunto: maior retorno esperado costuma exigir aceitar maior incerteza, e a capacidade de suportar perdas limita a exposição adequada.":s.includes("diversificação")?"Diversificação distribui exposições entre ativos e fatores de risco para reduzir dependência de um único evento, sem eliminar risco de mercado ou garantir ganho.":s.includes("profissional e qualificada")?"Investidores profissionais e qualificados são categorias regulatórias definidas por critérios objetivos; experiência percebida ou renda isolada não substituem o enquadramento normativo.":s.includes("nove princípios éticos")?"Os princípios éticos orientam integridade, objetividade, competência, diligência, confidencialidade e prioridade ao interesse legítimo do cliente no exercício profissional.":s.includes("regras gerais de conduta")?"Regras de conduta exigem atuação íntegra, diligente, transparente e compatível com responsabilidades profissionais, evitando fraude, omissão e conflito não tratado.":s.includes("deveres profissionais")?"Deveres profissionais incluem competência, atualização, diligência, registro, confidencialidade e comunicação clara, sempre respeitando limites de atuação e normas aplicáveis.":e.startsWith("3.4.2")?`${r} faz parte do processo de suitability e relacionamento: a instituição precisa conhecer o cliente, documentar informações, avaliar adequação, comunicar riscos e revisar o enquadramento ao longo do tempo.`:s.includes("escuta ativa")?"Escuta ativa significa compreender a necessidade antes de responder, fazendo perguntas, confirmando entendimento e evitando oferecer solução padronizada sem contexto.":s.includes("personalização")?"Personalização do atendimento usa informações relevantes do cliente para adaptar linguagem, solução e sequência de atendimento sem violar regras de igualdade, privacidade ou suitability.":s.includes("solução proativa")?"Solução proativa antecipa riscos e próximos passos, busca resolver a causa do problema e mantém o cliente informado em vez de apenas reagir à reclamação.":s.includes("educação continuada")?"Conhecimento atualizado de produtos, normas e riscos é requisito para explicar alternativas com precisão e reconhecer quando uma demanda exige especialista ou informação adicional.":s.includes("gerenciamento de expectativas")?"Gerenciar expectativas significa comunicar cenários, riscos, prazos e limites reais do serviço, evitando promessas de resultado ou garantias que não existem.":s.includes("ética e responsabilidade")?"Atendimento ético coloca transparência, respeito, diligência e interesse legítimo do cliente acima de metas comerciais incompatíveis com sua necessidade.":e.startsWith("3.4.3.3")?`${r} é um potencial foco de conflito de interesses; deve ser identificado, prevenido ou mitigado com transparência, controles, segregação, monitoramento e prioridade ao cliente.`:e.startsWith("3.4.4")?`${r} pode gerar perdas financeiras, sanções ou dano reputacional; a gestão exige identificação, controles preventivos, monitoramento, registro de incidentes e correção tempestiva.`:e.sta ção relevante ainda não divulgada em razão de sua posição negocia ou usa essa informação em benefício próprio ou de terceiros.":s.includes("insider trading secundário")?"Insider trading secundário ocorre quando alguém que recebeu informação privilegiada de outra fonte negocia sabendo de seu caráter relevante e não público.":s.includes("repasse de informação privilegiada")?"Repassar informação relevante ainda não divulgada pode permitir negociação indevida e constitui conduta ilícita quando presentes os elementos previstos na legislação.":s.includes("exercício irregular")?"Exercício irregular ocorre quando alguém desempenha atividade, cargo ou função regulada sem atender requisitos legais ou autorização necessária.":s.includes("omissão imprópria")?"Omissão imprópria ocorre quando quem tinha dever jurídico de agir para evitar resultado relevante deixa de fazê-lo e pode responder como garantidor nas hipóteses legais.":s.includes("tipologia aberta")?"Tipologia aberta significa que práticas ilícitas podem assumir formas novas; profissionais devem reconhecer o efeito econômico e a intenção da conduta, e não apenas nomes conhecidos.":s.includes("money pass")?"Money pass é prática em que operações aparentemente legítimas são coordenadas para transferir recursos entre partes, podendo mascarar favorecimento ou manipulação.":s.includes("spoofing")?"Spoofing envolve inserir ofertas sem intenção real de execução para criar falsa percepção de oferta ou demanda e induzir outros participantes.":s.includes("layering")?"Layering usa múltiplas ofertas em níveis de preço para criar aparência artificial de profundidade e pressionar outros participantes, cancelando-as antes da execução pretendida.":s.includes("benchmark")?"Manipulação de benchmark busca influenciar artificialmente índice ou referência de mercado para beneficiar posições, contratos ou remunerações vinculadas.":s.includes("churning")?"Churning é giro excessivo de operações sem justificativa econômica adequada para o cliente, frequentemente associado a geração de comissões em conflito com seu interesse.":s.includes("front running")?"Front running ocorre quando alguém negocia antecipadamente sabendo de ordem relevante de cliente ou instituição que pode impactar o mercado, buscando obter vantagem indevida.":s==="conceito"&&e.startsWith("3.4.7.2.2.4")?"Uso indevido de informação relevante não pública cria vantagem informacional incompatível com a integridade do mercado e pode caracterizar insider trading ou front running conforme a origem e a conduta.":`${r} deve ser compreendido como parte do relacionamento responsável com o cliente, considerando objetivo, risco, transparência, documentação e regras aplicáveis antes de qualquer recomendação ou decisão.`}const V2=new Set(an.flatMap(e=>e.parentCode?[e.parentCode]:[])),F2=an.filter(e=>!V2.has(e.pdCode)),$2=Object.fromEntries(F2.map(e=>[e.pdCode,L2(e.pdCode,e.title.replace(/\.$/,""))])),Bi=zr(an,"3.",$2,{area:e=>e.startsWith("3.1")?"planejamento financeiro pessoal":e.startsWith("3.2")?"gestão financeira e de investimentos":e.startsWith("3.3")?"perfil e suitability":"ética, conduta, controles e integridade",beginner:(e,r,s)=>e.startsWith("3.4")?`Relacionamento profissional exige técnica e conduta. ${s} Ao estudar ${r}, pergunte qual risco para o cliente ou para o mercado a regra procura evitar e qual comportamento correto é esperado.`:`Planejamento começa pela vida real do cliente, não pelo produto. ${s} Em ${r}, organize objetivo, prazo, orçamento, liquidez, proteção e risco antes de escolher uma solução.`,complete:(e,r,s)=>[`${s} Este item integra ${e.startsWith("3.1")?"planejamento financeiro":e.startsWith("3.2")?"gestão financeira":e.startsWith("3.3")?"perfil e adequação":"ética e integridade"} no Programa Detalhado CPA 1.2.`,e.startsWith("3.4")?"A nova CPA privilegia situações de atendimento e julgamento profissional. A resposta correta costuma combinar transparência, diligência, documentação, proteção de dados, gestão de conflitos e cu ência Artificial envolve sistemas capazes de executar tarefas de previsão, classificação ou decisão a partir de dados e modelos; a aplicação financeira exige governança, explicabilidade proporcional e monitoramento de risco.`:e.startsWith("4.6.2")?`${r} em Machine Learning envolve modelos que aprendem padrões dos dados para prever ou classificar resultados; desempenho histórico não elimina risco de erro, viés ou mudança de comportamento futuro.`:s.includes("chatbots")?"Chatbots automatizam conversas para orientar, informar ou executar tarefas, devendo reconhecer limites, proteger dados e encaminhar casos que exigem intervenção humana.":s.includes("assistentes virtuais")?"Assistentes virtuais combinam linguagem, automação e dados para apoiar jornadas financeiras, mas precisam de controles para privacidade, precisão, autorização e responsabilidade.":s.includes("fintechs de hoje")?"Fintechs usam tecnologia para oferecer ou reorganizar serviços financeiros com experiência digital, dados e automação; fintech descreve modelo de negócio e não uma categoria regulatória única.":s.includes("sandbox regulatório")?"Sandbox regulatório permite testar modelos inovadores sob supervisão e condições controladas do regulador, sem equivaler a autorização irrestrita ou dispensa geral de normas.":s.includes("relação com o open finance")?"Fintechs podem usar Open Finance para acessar dados e iniciar serviços mediante consentimento, aumentando competição e personalização dentro das regras de participação e segurança.":s==="regulação"&&e.startsWith("4.7")?"Fintechs precisam se enquadrar nas licenças e normas correspondentes às atividades exercidas; inovação tecnológica não afasta regulação financeira, de pagamentos, valores mobiliários ou dados.":s.includes("desintermediação")?"Desintermediação reduz etapas ou intermediários tradicionais na conexão entre poupadores, tomadores e usuários, mas novas plataformas continuam assumindo funções e riscos que precisam ser compreendidos.":s==="concei ognitiveLevel:e.cognitiveLevel,questionType:e.questionType,context:e.context,prompt:e.prompt,options:r.options,correctAnswer:r.correctAnswer,explanation:e.explanation,whyOthersAreWrong:r.whyOthersAreWrong,officialSources:e.sourceIds.map(s=>pC[s]),verifiedAt:aa}}const Ca="Estrutura e dinâmica do Sistema Financeiro Nacional",vC=[oe({id:"CPA-Q001",pdCode:"1.1.1.1.1",macroTopic:Ca,topic:"Órgãos normativos",difficulty:"easy",cognitiveLevel:"comprehension",questionType:"multiple_choice",context:"Uma gerente explica a um cliente por que algumas decisões gerais do sistema financeiro são definidas em uma instância normativa, enquanto a execução e a supervisão cotidiana ficam com outros órgãos.",prompt:"Qual combinação descreve corretamente Conselho Monetário Nacional (CMN) e Banco Central do Brasil (BCB)?",options:["O CMN define diretrizes superiores e o BCB executa e supervisiona dentro de suas competências.","O BCB define todas as normas do sistema e o CMN apenas fiscaliza bancos.","O CMN supervisiona ofertas de ações e o BCB regula exclusivamente seguros.","O CMN administra contas bancárias e o BCB representa instituições privadas."],correctAnswer:0,explanation:"No Sistema Financeiro Nacional, o CMN exerce função normativa superior em matérias monetária, creditícia e cambial, enquanto o BCB executa políticas e supervisiona instituições sob sua competência.",whyOthersAreWrong:["","Inverte os papéis: o CMN é órgão normativo e o BCB não concentra sozinho toda a formulação normativa.","Mercado de valores mobiliários é foco da CVM, e seguros privados ficam sob CNSP/SUSEP.","Nenhum dos dois exerce essas funções operacionais ou de representação privada."],sourceIds:["ANBIMA_PD","BCB_SFN"]}),oe({id:"CPA-Q002",pdCode:"1.1.2.1.2",macroTopic:Ca,topic:"Supervisão",difficulty:"easy",cognitiveLevel:"comprehension",questionType:"multiple_choice",context:"Uma companhia aberta pretende realizar uma oferta de valores mobiliários e a equipe comercial quer identificar o supervisor diretamente relacionado a esse mercado.",prompt:"Qual órgão tem essa atribuição como foco?",options:["Comissão de Valores Mobiliários (CVM).","Superintendência de Seguros Privados (SUSEP).","Superintendência Nacional de Previdência Complementar (PREVIC).","Conselho Monetário Nacional (CMN)."],correctAnswer:0,explanation:"A CVM regula, desenvolve e fiscaliza o mercado de valores mobiliários, incluindo temas ligados a emissores, ofertas e intermediários sob sua competência.",whyOthersAreWrong:["","A SUSEP supervisiona seguros, capitalização e previdência complementar aberta.","A PREVIC supervisiona a previdência complementar fechada.","O CMN é órgão normativo superior e não o supervisor específico do mercado de valores mobiliários."],sourceIds:["ANBIMA_PD","CVM"]}),oe({id:"CPA-Q003",pdCode:"1.1.2.1.3",macroTopic:Ca,topic:"Supervisão",difficulty:"easy",cognitiveLevel:"comprehension",questionType:"multiple_choice",context:"Um cliente pergunta quem fiscaliza uma entidade aberta de previdência complementar da qual pretende contratar um plano.",prompt:"Qual supervisor deve ser associado a esse segmento?",options:["SUSEP.","PREVIC.","CVM.","B3."],correctAnswer:0,explanation:"A Superintendência de Seguros Privados (SUSEP) supervisiona, entre outros, a previdência complementar aberta. A PREVIC atua sobre entidades fechadas.",whyOthersAreWrong:["","A PREVIC é ligada à previdência complementar fechada.","A CVM supervisiona o mercado de valores mobiliários, não a previdência aberta.","A B3 é infraestrutura de mercado, não supervisora da previdência complementar aberta."],sourceIds:["ANBIMA_PD","SUSEP"]}),oe({id:"CPA-Q004",pdCode:"1.1.3.1.3",macroTopic:Ca,topic:"Operadores e participantes",difficulty:"easy",cognitiveLevel:"comprehension",questionType:"multiple_choice",context:"Uma fintech oferece conta de pagamento e transferências, mas não capta depósitos como um banco comercial. Um cliente conclui que qualquer instituição que movimenta dinheiro é necessariamente um banco.",prompt:"Qual orientação é mais adequada?",options:["Instituição de pagamento pode prestar serviços de pagamento sem ser, por isso, um banco.","Toda instituição de pagamento é automaticamente um banco múltiplo.","Instituições de pagamento só podem atuar como corretoras de valores.","A existência de uma conta de pagamento transforma a empresa em seguradora."],correctAnswer:0,explanation:"Instituições de pagamento integram o ecossistema financeiro e viabilizam serviços de pagamento, mas sua natureza e autorizações não se confundem automaticamente com as de instituições bancárias.",whyOthersAreWrong:["","A categoria regulatória e as autorizações são distintas; não há transformação automática em banco múltiplo.","Corretoras exercem outra atividade regulada.","Conta de pagamento não guarda relação com a atividade típica de seguradora."],sourceIds:["ANBIMA_PD","BCB_SFN"]}),oe({id:"CPA-Q005",pdCode:"1.1.4.3",macroTopic:Ca,topic:"Mecanismos de garantia",difficulty:"easy",cognitiveLevel:"comprehension",questionType:"multiple_choice",context:"Um investidor compara um Certificado de Depósito Bancário (CDB) elegível emitido por um banco participante com uma debênture emitida por uma companhia não financeira.",prompt:"Qual afirmação é correta sobre a proteção do Fundo Garantidor de Créditos (FGC)?",options:["O CDB pode estar coberto dentro das regras e limites do FGC; a debênture não recebe essa garantia.","CDB e debênture têm a mesma cobertura automática e ilimitada do FGC.","Somente debêntures são cobertas, porque representam dívida de empresas.","O FGC garante qualquer perda de preço de mercado de ambos os produtos."],correctAnswer:0,explanation:"A garantia do FGC alcança determinados créditos contra instituições participantes, como CDBs elegíveis, dentro de regras e limites. Debêntures não estão entre os produtos cobertos e o FGC não cobre oscilação de mercado.",whyOthersAreWrong:["","A cobertura não é automática e ilimitada para qualquer produto.","Debêntures não são cobertas pelo FGC.","A garantia é de créditos elegíveis em situações previstas, não de variações de preço de mercado."],sourceIds:["ANBIMA_PD","FGC"]}),oe({id:"CPA-Q006",pdCode:"1.1.5",macroTopic:Ca,topic:"Sistema de Pagamentos Brasileiro",difficulty:"easy",cognitiveLevel:"comprehension",questionType:"multiple_choice",context:"Durante um treinamento, um novo funcionário pergunta por que o sistema financeiro necessita de regras e infraestruturas específicas para transferir e liquidar obrigações entre participantes.",prompt:"Qual é a melhor descrição do Sistema de Pagamentos Brasileiro (SPB)?",options:["Conjunto de regras, procedimentos e infraestruturas que viabilizam transferências e liquidação de obrigações, contribuindo para reduzir riscos.","Sistema destinado exclusivamente à negociação de ações por investidores pessoas físicas.","Cadastro único de clientes para definir perfil de investimento.","Mecanismo de garantia que cobre qualquer aplicação financeira contra perdas."],correctAnswer:0,explanation:"O SPB reúne arranjos, sistemas, regras e procedimentos essenciais à transferência de fundos e à liquidação de obrigações, com relevância para segurança e estabilidade financeira.",whyOthersAreWrong:["","Negociação de ações é apenas uma atividade de mercado e não define o SPB.","Perfil de investimento é tema de suitability, não função do SPB.","SPB não é fundo garantidor nem elimina perdas de investimento."],sourceIds:["ANBIMA_PD","BCB_SPB"]}),oe({id:"CPA-Q007",pdCode:"1.2.4.1",macroTopic:Ca,topic:"Política monetária",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"A inflação corrente e esperada permanece acima do objetivo e a atividade segue resiliente. Em sua comunicação, o Banco Central sinaliza necessidade de condições monetárias mais restritivas.",prompt:"Qual movimento é compatível com uma política monetária contracionista?",options:["Elevação da taxa básica para encarecer crédito e moderar a demanda agregada.","Redução da taxa básica para estimular crédito e consumo.","Aumento de gasto público financiado por emissão de dívida como instrumento monetário.","Redução de tributos para elevar a renda disponível das famílias."],correctAnswer:0,explanation:"Política monetária contracionista busca tornar as condições financeiras mais restritivas, reduzindo estímulos à demanda e ajudando no processo de convergência da inflação.",whyOthersAreWrong:["","Reduzir juros é medida de afrouxamento, não de aperto monetário.","Gasto público é instrumento de política fiscal.","Tributação também pertence à política fiscal."],sourceIds:["ANBIMA_PD","BCB_MONETARY","BCB_SELIC"]}),oe({id:"CPA-Q008",pdCode:"1.2.4.2",macroTopic:Ca,topic:"Instrumentos de política monetária",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"O Banco Central pretende influenciar a liquidez de curtíssimo prazo do sistema por operações com títulos no mercado, ajustando a quantidade de reservas disponíveis.",prompt:"Qual instrumento está sendo utilizado?",options:["Operações de mercado aberto.","Política fiscal discricionária.","Emissão primária de ações.","Alteração do regime de previdência."],correctAnswer:0,explanation:"Operações de mercado aberto são instrumento de política monetária usado pelo Banco Central para administrar liquidez e manter as taxas de curto prazo próximas da orientação definida.",whyOthersAreWrong:["","Política fiscal envolve receitas e despesas públicas.","Emissão de ações é financiamento no mercado de capitais.","Previdência não é instrumento operacional de política monetária."],sourceIds:["ANBIMA_PD","BCB_MONETARY"]}),oe({id:"CPA-Q009",pdCode:"1.2.4.7",macroTopic:Ca,topic:"Selic e DI",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Um cliente afirma que meta Selic, Selic efetiva e taxa DI são exatamente a mesma taxa e sempre terão o mesmo valor.",prompt:"Como o profissional deve corrigir essa afirmação?",options:["São referências relacionadas, mas distintas: a meta é definida pelo Copom, a Selic efetiva decorre do mercado correspondente e a DI vem do mercado interfinanceiro.","São três nomes oficiais para a mesma série estatística, sem diferença econômica.","A taxa DI é definida diretamente pelo Copom e a meta Selic pela B3.","A Selic efetiva é uma taxa de câmbio, enquanto a DI mede inflação."],correctAnswer:0,explanation:"As três referências podem caminhar próximas, mas têm origem e função distintas. A meta Selic é decisão do Copom; a Selic efetiva e a DI decorrem de mercados específicos.",whyOthersAreWrong:["","Elas não são a mesma série nem têm exatamente a mesma formação.","Inverte os responsáveis e a natureza das taxas.","Selic e DI são taxas de juros, não câmbio ou índice de inflação."],sourceIds:["ANBIMA_PD","BCB_SELIC"]}),oe({id:"CPA-Q010",pdCode:"1.2.3.3",macroTopic:Ca,topic:"Política fiscal",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"O governo amplia persistentemente despesas sem aumento equivalente de receitas, elevando a necessidade de financiamento. Investidores passam a exigir maior prêmio para carregar títulos públicos.",prompt:"Qual relação econômica o caso ilustra melhor?",options:["Trajetória fiscal pode afetar dívida, percepção de risco e condições de juros exigidas pelo mercado.","Déficits fiscais eliminam automaticamente o risco de juros dos títulos públicos.","Política fiscal não tem qualquer relação com condições financeiras.","A maior necessidade de financiamento reduz, por definição, toda taxa de juros da economia."],correctAnswer:0,explanation:"Resultados fiscais, dívida e condições de financiamento interagem com expectativas, prêmio de risco e taxas de juros. A relação não é mecânica em todo momento, mas é economicamente relevante.",whyOthersAreWrong:["","Déficit não elimina risco de mercado ou de juros.","A política fiscal pode influenciar expectativas e condições financeiras.","Não existe relação definicional de redução de juros com maior necessidade de financiamento."],sourceIds:["ANBIMA_PD","PLANALTO_LRF"]}),oe({id:"CPA-Q011",pdCode:"1.3.1",macroTopic:Ca,topic:"Taxa nominal e real",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Uma aplicação rendeu 10% no ano e a inflação do mesmo período foi 5%. O cliente quer saber se seu poder de compra cresceu aproximadamente 5%.",prompt:"Qual análise é tecnicamente mais adequada?",options:["O ganho real é positivo, mas a relação exata usa (1+taxa nominal)/(1+inflação)-1, não simples subtração.","O ganho real é exatamente 15%, porque se somam rendimento e inflação.","O ganho real é necessariamente zero sempre que houver inflação.","Taxa real e nominal são sempre iguais para aplicações pós-fixadas."],correctAnswer:0,explanation:"A taxa real mede variação de poder de compra. A subtração é uma aproximação; a relação exata é multiplicativa pela fórmula de Fisher.",whyOthersAreWrong:["","Somar inflação ao retorno não mede ganho real.","Inflação positiva não implica ganho real zero; depende do retorno nominal.","Indexação não torna taxa real e nominal iguais."],sourceIds:["ANBIMA_PD","BCB_MONETARY"]}),oe({id:"CPA-Q012",pdCode:"1.3.2",macroTopic:Ca,topic:"Capitalização simples e composta",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Duas operações têm o mesmo principal, a mesma taxa por período e o mesmo prazo. A primeira usa juros simples e a segunda, juros compostos.",prompt:"Mantidas as demais condições, o que tende a ocorrer para prazo superior a um período e taxa positiva?",options:["A operação composta acumula juros sobre juros e tende a gerar montante maior.","A operação simples sempre gera montante maior porque a taxa não muda.","Os montantes serão necessariamente iguais em qualquer prazo.","A operação composta deixa de cobrar juros após o primeiro período."],correctAnswer:0,explanation:"Nos juros compostos, os juros acumulados passam a integrar a base dos períodos seguintes. Nos simples, a base permanece o principal inicial.",whyOthersAreWrong:["","Taxa constante não torna juros simples maiores.","Após mais de um período, os regimes produzem resultados diferentes sob taxa positiva.","Juros compostos continuam incidindo sobre o saldo acumulado."],sourceIds:["ANBIMA_PD"]}),oe({id:"CPA-Q013",pdCode:"1.3.3.2.3",macroTopic:Ca,topic:"Valor presente e valor futuro",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Uma empresa espera receber R$ 110 mil daqui a um ano e utiliza taxa de desconto de 10% ao ano para comparar o fluxo com dinheiro disponível hoje.",prompt:"Qual é aproximadamente o valor presente desse recebimento?",options:["R$ 100 mil.","R$ 110 mil.","R$ 121 mil.","R$ 99 mil sem necessidade de considerar a taxa."],correctAnswer:0,explanation:"VP = 110.000 / 1,10 = 100.000. Descontar um fluxo futuro significa trazê-lo para a data atual por uma taxa compatível com o período.",whyOthersAreWrong:["","R$ 110 mil é o valor futuro nominal do fluxo.","R$ 121 mil seria resultado de capitalizar R$ 110 mil por 10%, não descontá-lo.","O desconto depende da taxa; não se pode ignorá-la."],sourceIds:["ANBIMA_PD"]}),oe({id:"CPA-Q014",pdCode:"1.3.3.5.2",macroTopic:Ca,topic:"Taxa Interna de Retorno",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Ao comparar um projeto com fluxos convencionais, um analista calcula uma taxa que torna o Valor Presente Líquido (VPL) exatamente igual a zero.",prompt:"Qual indicador foi calculado?",options:["Taxa Interna de Retorno (TIR).","Taxa Referencial (TR).","Taxa DI.","Taxa de desemprego."],correctAnswer:0,explanation:"A Taxa Interna de Retorno (TIR) é definida como a taxa de desconto que zera o VPL de um conjunto de fluxos.",whyOthersAreWrong:["","TR é uma referência com usos legais e contratuais específicos.","DI é referência do mercado interfinanceiro.","Taxa de desemprego é indicador do mercado de trabalho."],sourceIds:["ANBIMA_PD"]}),oe({id:"CPA-Q015",pdCode:"1.3.7",macroTopic:Ca,topic:"Sistemas de amortização",difficulty:"hard",cognitiveLevel:"analysis",questionType:"case",context:"Uma família compara dois financiamentos com mesma taxa e prazo. No primeiro, a amortização do principal é constante e as prestações diminuem ao longo do tempo. No segundo, as prestações periódicas são constantes, mantidas as condições contratadas.",prompt:"Quais sistemas aparecem, respectivamente?",options:["SAC e Price.","Price e SAC.","Juros simples e desconto comercial.","VPL e TIR."],correctAnswer:0,explanation:"No Sistema de Amortização Constante (SAC), a amortização é constante e os juros caem com o saldo, reduzindo prestações. Na Tabela Price, a prestação é constante em condições fixas.",whyOthersAreWrong:["","A ordem está invertida.","São conceitos de matemática financeira, não sistemas de amortização descritos.","VPL e TIR são métricas de avaliação de fluxos, não sistemas de financiamento."],sourceIds:["ANBIMA_PD"]}),oe({id:"CPA-Q016",pdCode:"1.4.1.3",macroTopic:Ca,topic:"Infraestruturas de mercado",difficulty:"hard",cognitiveLevel:"analysis",questionType:"case",context:"Após uma negociação em mercado organizado, uma infraestrutura se interpõe entre comprador e vendedor, passando a administrar o risco de contraparte e assegurar o processo de compensação conforme suas regras.",prompt:"Qual função está sendo descrita?",options:["Contraparte central.","Depositário central.","Agência de classificação de risco.","Entidade de previdência aberta."],correctAnswer:0,explanation:"A contraparte central se interpõe nas operações elegíveis e administra risco de contraparte. Depositário central exerce função distinta, relacionada à guarda escritural e controle de posições.",whyOthersAreWrong:["","Depositário central não é definido pela interposição como comprador de cada vendedor e vendedor de cada comprador.","Rating avalia risco de crédito; não faz a compensação descrita.","Previdência aberta não é infraestrutura de pós-negociação."],sourceIds:["ANBIMA_PD","BCB_SPB","B3"]}),oe({id:"CPA-Q017",pdCode:"1.4.3.2",macroTopic:Ca,topic:"Estabilidade financeira e Basileia",difficulty:"hard",cognitiveLevel:"analysis",questionType:"case",context:"Um banco cresce rapidamente usando elevado nível de alavancagem e baixa capacidade de absorver perdas. A supervisão exige capital e controles compatíveis com os riscos assumidos, considerando padrões prudenciais.",prompt:"Qual objetivo prudencial está mais alinhado ao caso?",options:["Reduzir a probabilidade de fragilidade da instituição e de propagação de perdas ao sistema.","Garantir retorno mínimo aos acionistas do banco.","Eliminar toda possibilidade de perda de crédito da economia.","Substituir a política monetária por regras de capital."],correctAnswer:0,explanation:"Regras prudenciais e padrões de Basileia buscam fortalecer capital, liquidez e gestão de riscos para aumentar resiliência das instituições e do sistema.",whyOthersAreWrong:["","Regulação prudencial não garante retorno a acionistas.","Risco não pode ser eliminado por completo.","Capital prudencial e política monetária têm objetivos e instrumentos distintos."],sourceIds:["ANBIMA_PD","BCB_SFN"]}),oe({id:"CPA-Q018",pdCode:"1.4.10.1.2",macroTopic:Ca,topic:"Classificação de investidores",difficulty:"hard",cognitiveLevel:"analysis",questionType:"case",context:"Uma instituição pretende oferecer um produto cuja distribuição depende da classificação regulatória do investidor. O cliente afirma que basta declarar informalmente que possui experiência para ser tratado como profissional.",prompt:"Qual conduta é adequada?",options:["Verificar os critérios de enquadramento previstos na regulamentação aplicável antes de atribuir a classificação.","Aceitar qualquer autodeclaração verbal, independentemente dos critérios regulatórios.","Classificar todo cliente experiente automaticamente como profissional e dispensar registros.","Ignorar a classificação porque ela nunca afeta a distribuição de produtos."],correctAnswer:0,explanation:"Classificações como investidor profissional ou qualificado seguem critérios regulatórios. A instituição deve verificar o enquadramento e manter os procedimentos e registros cabíveis.",whyOthersAreWrong:["","Declaração isolada não substitui critérios regulatórios aplicáveis.","Experiência não autoriza ignorar requisitos e documentação.","A classificação pode ser relevante para acesso e distribuição de determinados produtos."],sourceIds:["ANBIMA_PD","CVM_30"]}),oe({id:"CPA-Q019",pdCode:"1.4.12.1.3.2",macroTopic:Ca,topic:"Suitability",difficulty:"hard",cognitiveLevel:"analysis",questionType:"dialog_tree",context:"Chat de atendimento. Cliente: “Tenho reserva para a entrada de um imóvel em oito meses. Vi um produto de alta volatilidade que rendeu muito no último ano e quero colocar todo o valor nele. Meu questionário de perfil está desatualizado.”",prompt:"Qual resposta do profissional melhor inicia o atendimento?",options:["“Antes de recomendar, vamos atualizar suas informações e avaliar objetivo, horizonte, necessidade de liquidez e tolerância a risco; o retorno passado não basta para concluir adequação.”","“Como o produto rendeu bem, ele é adequado para qualquer objetivo de curto prazo.”","“Seu perfil antigo basta; não é necessário considerar o prazo do imóvel.”","“Se você assinar um termo, a análise de adequação deixa de ser relevante.”"],correctAnswer:0,explanation:"Suitability exige avaliar a adequação do produto ao perfil, objetivos, situação e horizonte do cliente, com informações atualizadas e comunicação clara sobre riscos.",whyOthersAreWrong:["","Rentabilidade passada não substitui análise de risco e objetivo.","Informações desatualizadas podem comprometer a avaliação, e o horizonte é central.","Formalização não elimina as obrigações de análise previstas nas regras aplicáveis."],sourceIds:["ANBIMA_PD","ANBIMA_DISTRIBUICAO","CVM_30"]}),oe({id:"CPA-Q020",pdCode:"1.4.12.1.3.4",macroTopic:Ca,topic:"Transparência na remuneração",difficulty:"hard",cognitiveLevel:"analysis",questionType:"dialog_tree",context:"Chat de atendimento. Cliente: “Você está me oferecendo dois fundos parecidos. Sua instituição recebe remuneração diferente dependendo do fundo escolhido?”",prompt:"Qual resposta está mais alinhada à transparência na distribuição?",options:["“A remuneração e potenciais conflitos relevantes devem ser apresentados de forma clara conforme as regras aplicáveis, para que você entenda os incentivos do canal.”","“Esse assunto nunca precisa ser comunicado ao cliente, porque é informação exclusivamente interna.”","“Se os fundos forem da mesma classe, qualquer diferença de remuneração torna-se irrelevante.”","“Basta informar a rentabilidade passada; remuneração do distribuidor não afeta a transparência do atendimento.”"],correctAnswer:0,explanation:"Transparência sobre remuneração e conflitos de interesse ajuda o cliente a compreender incentivos presentes na distribuição e integra as boas práticas de conduta.",whyOthersAreWrong:["","Regras de transparência podem exigir comunicação ao cliente; não é sempre informação exclusivamente interna.","Produtos semelhantes não tornam incentivos automaticamente irrelevantes.","Rentabilidade passada não substitui transparência sobre remuneração e conflitos."],sourceIds:["ANBIMA_PD","ANBIMA_DISTRIBUICAO"]})],ba="Produtos do mercado financeiro",gC=[oe({id:"CPA-Q021",pdCode:"2.1.1.1.2",macroTopic:ba,topic:"Títulos públicos federais",difficulty:"easy",cognitiveLevel:"comprehension",questionType:"multiple_choice",context:"Uma cliente quer manter parte da reserva de emergência em título público e valoriza baixa volatilidade relativa para resgates antes do vencimento.",prompt:"Entre os títulos do Tesouro Direto, qual costuma estar mais associado a esse objetivo?",options:["Tesouro Selic.","Tesouro Prefixado longo, independentemente do momento de venda.","Tesouro IPCA+ longo, porque não oscila antes do vencimento.","Tesouro RendA+, porque toda reserva de emergência deve virar renda mensal futura."],correctAnswer:0,explanation:"O Tesouro Selic é usualmente associado a objetivos de liquidez e menor sensibilidade a oscilações de juros do que títulos prefixados ou indexados à inflação de prazo longo.",whyOthersAreWrong:["","Prefixados longos podem ter oscilação relevante de preço se vendidos antes do vencimento.","Tesouro IPCA+ também sofre marcação a mercado antes do vencimento.","Tesouro RendA+ é desenhado para planejamento de renda futura, não como escolha automática para reserva de emergência."],sourceIds:["ANBIMA_PD","TESOURO_DIRETO"]}),oe({id:"CPA-Q022",pdCode:"2.1.1.1.1.3",macroTopic:ba,topic:"Tesouro Prefixado",difficulty:"easy",cognitiveLevel:"comprehension",questionType:"multiple_choice",context:"Um investidor compra um título prefixado e pensa em vendê-lo antes do vencimento. Depois da compra, as taxas de mercado sobem de forma relevante.",prompt:"Qual efeito tende a ocorrer no preço do título, mantidas as demais condições?",options:["O preço tende a cair.","O preço tende a subir na mesma proporção das taxas.","O preço fica necessariamente fixo até o vencimento.","O título deixa de ter risco de mercado por ser público."],correctAnswer:0,explanation:"Preço e taxa de títulos prefixados têm relação inversa. Se as taxas exigidas pelo mercado sobem, o valor presente dos fluxos tende a cair.",whyOthersAreWrong:["","A relação usual é inversa, não direta.","O valor de mercado pode oscilar antes do vencimento.","Títulos públicos têm risco de mercado quando negociados antes do vencimento."],sourceIds:["ANBIMA_PD","TESOURO_DIRETO"]}),oe({id:"CPA-Q023",pdCode:"2.1.1.1.2",macroTopic:ba,topic:"Tesouro IPCA+",difficulty:"easy",cognitiveLevel:"comprehension",questionType:"multiple_choice",context:"Um cliente quer acumular recursos para um objetivo de longo prazo e busca preservar poder de compra por meio de remuneração ligada à inflação, aceitando oscilações de preço no caminho.",prompt:"Qual característica do Tesouro IPCA+ é mais relevante para esse objetivo?",options:["Combina uma parcela indexada à inflação com uma taxa real contratada, sujeito à marcação a mercado antes do vencimento.","Garante taxa nominal fixa sem relação com inflação.","Não apresenta qualquer oscilação de preço em vendas antecipadas.","É um depósito bancário coberto pelo FGC."],correctAnswer:0,explanation:"O Tesouro IPCA+ remunera por inflação mais taxa real conforme as condições contratadas. Se vendido antes do vencimento, seu preço pode oscilar com as taxas de mercado.",whyOthersAreWrong:["","Essa descrição corresponde mais a um título prefixado.","Há risco de mercado em venda antes do vencimento.","É título público federal, não depósito bancário."],sourceIds:["ANBIMA_PD","TESOURO_DIRETO"]}),oe({id:"CPA-Q024",pdCode:"2.1.1.1.3.1",macroTopic:ba,topic:"CDB",difficulty:"easy",cognitiveLevel:"comprehension",questionType:"multiple_choice",context:"Um cliente analisa um Certificado de Depósito Bancário (CDB) emitido por instituição participante do FGC e pergunta qual risco permanece relevante mesmo quando o valor está dentro dos limites da garantia.",prompt:"Qual resposta é adequada?",options:["O risco de crédito do emissor continua existindo; o FGC é um mecanismo de proteção sujeito a regras, produtos e limites.","A cobertura transforma o CDB em título público federal.","O FGC elimina qualquer risco de liquidez e de mercado do produto.","O CDB passa a ter garantia ilimitada para qualquer valor investido."],correctAnswer:0,explanation:"CDB é dívida da instituição emissora. A proteção do FGC pode mitigar perdas em hipóteses e limites previstos, mas não muda a natureza do emissor nem elimina todos os riscos.",whyOthersAreWrong:["","CDB continua sendo título bancário, não público.","FGC não garante liquidez nem preço de mercado.","A cobertura está sujeita a limites e condições."],sourceIds:["ANBIMA_PD","FGC"]}),oe({id:"CPA-Q025",pdCode:"2.1.1.1.3.3",macroTopic:ba,topic:"LCI e LCA",difficulty:"easy",cognitiveLevel:"comprehension",questionType:"multiple_choice",context:"Um investidor compara uma Letra de Crédito Imobiliário (LCI) elegível e uma debênture. O foco da dúvida é a existência de proteção do FGC, e não tributação.",prompt:"Qual comparação é correta?",options:["A LCI pode estar coberta pelo FGC dentro das regras; a debênture não é produto coberto.","Ambas são cobertas automaticamente pelo FGC sem limite.","Somente a debênture é coberta por ter prazo maior.","Nenhuma LCI pode ter cobertura do FGC."],correctAnswer:0,explanation:"LCI está entre os produtos que podem contar com garantia do FGC conforme regras e limites. Debêntures não integram essa cobertura.",whyOthersAreWrong:["","A garantia não é ilimitada e debênture não é produto coberto.","Prazo não transforma debênture em produto garantido pelo FGC.","LCI elegível pode contar com a garantia."],sourceIds:["ANBIMA_PD","FGC"]}),oe({id:"CPA-Q026",pdCode:"2.1.1.1.4",macroTopic:ba,topic:"Debêntures",difficulty:"easy",cognitiveLevel:"comprehension",questionType:"multiple_choice",context:"Uma companhia busca captar recursos diretamente com investidores por meio de título de dívida corporativa.",prompt:"Qual instrumento se encaixa melhor na descrição?",options:["Debênture.","Cota de fundo de investimento.","Ação ordinária emitida como dívida.","Depósito à vista."],correctAnswer:0,explanation:"Debênture é valor mobiliário de dívida emitido por companhia, com condições de remuneração e pagamento definidas na emissão.",whyOthersAreWrong:["","Cota representa participação em fundo, não dívida direta da companhia.","Ação é instrumento de capital próprio, não dívida.","Depósito à vista é passivo bancário de natureza distinta."],sourceIds:["ANBIMA_PD","CVM"]}),oe({id:"CPA-Q027",pdCode:"2.1.1.1.5",macroTopic:ba,topic:"CRI e CRA",difficulty:"easy",cognitiveLevel:"comprehension",questionType:"multiple_choice",context:"Uma cliente avalia um Certificado de Recebíveis Imobiliários (CRI) e acredita que qualquer produto com lastro em recebíveis tem garantia do FGC.",prompt:"Qual orientação é correta?",options:["CRI não é coberto pelo FGC; devem ser avaliados estrutura, crédito, liquidez e demais riscos da emissão.","CRI é depósito bancário e, por isso, sempre recebe cobertura do FGC.","O lastro elimina qualquer risco de crédito.","Todo CRI possui liquidez diária garantida pelo emissor."],correctAnswer:0,explanation:"CRI é instrumento de securitização e não está entre os produtos cobertos pelo FGC. Lastro e estrutura não eliminam risco de crédito ou liquidez.",whyOthersAreWrong:["","CRI não é depósito bancário.","O desempenho e a qualidade dos recebíveis importam; risco não desaparece.","Liquidez depende do mercado e da estrutura, não é automaticamente diária."],sourceIds:["ANBIMA_PD","FGC"]}),oe({id:"CPA-Q028",pdCode:"2.1.1.1.7",macroTopic:ba,topic:"Rating",difficulty:"easy",cognitiveLevel:"comprehension",questionType:"multiple_choice",context:"Um assessor apresenta a classificação de risco de uma emissão e o cliente interpreta a nota como promessa de pagamento sem possibilidade de perda.",prompt:"Como o assessor deve explicar o rating?",options:["É uma avaliação de risco de crédito segundo metodologia da agência, não uma garantia de adimplemento ou retorno.","É uma garantia legal de que o emissor nunca ficará inadimplente.","É uma medida exclusiva de risco de mercado e ignora crédito.","Substitui a análise do produto e do emissor."],correctAnswer:0,explanation:"Rating expressa uma opinião/classificação sobre risco de crédito segundo metodologia específica. Não elimina incerteza nem substitui análise de adequação e dos demais riscos.",whyOthersAreWrong:["","Nenhuma classificação torna inadimplência impossível.","Rating de emissão está ligado principalmente a crédito, não exclusivamente a oscilação de mercado.","É apenas uma informação do processo de análise."],sourceIds:["ANBIMA_PD","CVM"]}),oe({id:"CPA-Q029",pdCode:"2.1.1.1.8.4",macroTopic:ba,topic:"Poupança",difficulty:"easy",cognitiveLevel:"comprehension",questionType:"multiple_choice",context:"Uma cliente pretende sacar recursos da poupança poucos dias antes da data em que a remuneração daquele depósito seria creditada.",prompt:"Qual ponto merece atenção?",options:["A data de aniversário afeta a apropriação da remuneração do período para aquele depósito.","A poupança é marcada a mercado diariamente como uma ação.","O saque sempre preserva remuneração proporcional diária, independentemente da data.","A data de aniversário serve apenas para definir cobertura do FGC."],correctAnswer:0,explanation:"A remuneração da poupança segue regras associadas à data de aniversário dos depósitos. Um saque antes dessa data pode afetar a remuneração esperada daquele período.",whyOthersAreWrong:["","Poupança não funciona como ação marcada a mercado.","A remuneração não deve ser presumida como proporcional diária em qualquer situação.","A data de aniversário não define a cobertura do FGC."],sourceIds:["ANBIMA_PD","BCB_SFN"]}),oe({id:"CPA-Q030",pdCode:"2.1.1.1.12",macroTopic:ba,topic:"IOF em renda fixa",difficulty:"easy",cognitiveLevel:"comprehension",questionType:"multiple_choice",context:"Um investidor resgata uma aplicação de renda fixa poucos dias após aplicar e pergunta por que o retorno líquido pode ser menor do que imaginava.",prompt:"Qual aspecto tributário deve ser verificado para aplicações sujeitas à regra?",options:["A incidência de IOF em resgates de curto prazo, conforme a tabela aplicável.","Uma taxa de bolsa obrigatória em qualquer renda fixa.","Imposto sobre dividendos de ações aplicado ao principal.","FGC cobrado como imposto no resgate."],correctAnswer:0,explanation:"Em determinadas aplicações de renda fixa, resgates dentro do período sujeito à tabela regressiva de IOF podem reduzir o rendimento líquido. A tributação deve ser analisada conforme o produto.",whyOthersAreWrong:["","Taxa de bolsa não é a regra tributária descrita.","Dividendos de ações não correspondem ao caso.","FGC não é imposto cobrado do investidor no resgate."],sourceIds:["ANBIMA_PD"]}),oe({id:"CPA-Q031",pdCode:"2.1.1.2.2.1.6",macroTopic:ba,topic:"IPO e OPA",difficulty:"easy",cognitiveLevel:"comprehension",questionType:"multiple_choice",context:"Uma empresa que nunca teve ações negociadas publicamente decide realizar sua primeira oferta pública de ações para acessar o mercado de capitais.",prompt:"Como essa operação é usualmente denominada?",options:["IPO.","Follow-on.","Resgate de fundo.","Debênture conversível."],correctAnswer:0,explanation:"IPO é a oferta pública inicial de ações. Follow-on é uma oferta subsequente realizada por companhia que já acessou o mercado.",whyOthersAreWrong:["","Follow-on ocorre após o acesso inicial ao mercado.","Resgate é operação com cotas/fundos ou outros produtos, não oferta inicial de ações.","Debênture é instrumento de dívida."],sourceIds:["ANBIMA_PD","CVM"]}),oe({id:"CPA-Q032",pdCode:"2.1.1.2.2.1.8",macroTopic:ba,topic:"Mercado primário e secundário",difficulty:"easy",cognitiveLevel:"comprehension",questionType:"multiple_choice",context:"Um investidor compra ações diretamente em uma oferta em que recursos são captados pelo emissor. Depois, outro investidor compra essas ações de um terceiro no ambiente de negociação.",prompt:"As operações ocorrem, respectivamente, em quais mercados?",options:["Primário e secundário.","Secundário e primário.","Ambas no mercado monetário.","Ambas no mercado de crédito bancário."],correctAnswer:0,explanation:"No mercado primário ocorre a emissão/captação. No secundário, investidores negociam títulos já emitidos entre si.",whyOthersAreWrong:["","A ordem está invertida.","Mercado monetário não descreve emissão e negociação de ações.","Mercado de crédito bancário não é o ambiente descrito."],sourceIds:["ANBIMA_PD","CVM"]}),oe({id:"CPA-Q033",pdCode:"2.1.1.2.2.1.4",macroTopic:ba,topic:"Classes de ações e valores mobiliários",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Uma cliente recebe a informação de que determinado ativo é uma unit negociada em bolsa e conclui que unit é necessariamente uma ação ordinária isolada.",prompt:"Qual explicação é mais adequada?",options:["Unit é um certificado que pode representar um conjunto de valores mobiliários, conforme a estrutura definida pelo emissor.","Unit é sempre sinônimo de ação ordinária única.","Unit é um título público federal indexado à inflação.","Unit é um depósito bancário coberto automaticamente pelo FGC."],correctAnswer:0,explanation:"Units são certificados de depósito de valores mobiliários que podem reunir diferentes espécies/classes conforme a estrutura da companhia.",whyOthersAreWrong:["","A composição de uma unit pode envolver mais de um valor mobiliário.","Não é título público.","Não é depósito bancário nem produto de garantia do FGC."],sourceIds:["ANBIMA_PD","B3"]}),oe({id:"CPA-Q034",pdCode:"2.1.1.2.2.2.6",macroTopic:ba,topic:"Grupamento e desdobramento",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Uma companhia realiza desdobramento de ações na proporção definida em assembleia. O investidor observa aumento da quantidade de ações e ajuste proporcional do preço, sem mudança econômica imediata do valor total da posição por causa do evento isolado.",prompt:"Qual interpretação está correta?",options:["O desdobramento altera a quantidade unitária e o preço de referência de forma proporcional, sem criar riqueza por si só.","O desdobramento é pagamento de dividendo em dinheiro.","O evento transforma dívida da empresa em título público.","O desdobramento reduz obrigatoriamente o patrimônio líquido da companhia no mesmo valor da posição do investidor."],correctAnswer:0,explanation:"Desdobramento divide cada ação em mais unidades, ajustando o preço proporcionalmente. O evento, isoladamente, não cria valor econômico para o acionista.",whyOthersAreWrong:["","Dividendos são distribuição de resultados em dinheiro/forma prevista, não simples aumento de quantidade de ações por split.","Não há transformação em título público.","Não há redução obrigatória do patrimônio líquido pelo mero desdobramento."],sourceIds:["ANBIMA_PD","B3"]}),oe({id:"CPA-Q035",pdCode:"2.1.1.4.2",macroTopic:ba,topic:"COE",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Um investidor compara dois Certificados de Operações Estruturadas (COE): um de valor nominal protegido e outro de valor nominal em risco.",prompt:"Qual diferença deve ser destacada?",options:["No primeiro, a estrutura busca preservar o valor nominal nas condições previstas; no segundo, o investidor pode perder parte do principal conforme o cenário.","Ambos garantem lucro acima da inflação.","COE com valor nominal em risco é coberto pelo FGC contra qualquer perda.","COE de valor nominal protegido não possui risco de crédito do emissor."],correctAnswer:0,explanation:"As modalidades diferem quanto à proteção do valor nominal na estrutura. Mesmo no COE protegido, permanecem riscos como o de crédito do emissor e as condições do produto.",whyOthersAreWrong:["","Proteção do nominal não é garantia de lucro real.","FGC não cobre COE.","Proteção de principal na estrutura não elimina risco de crédito do emissor."],sourceIds:["ANBIMA_PD","CVM"]}),oe({id:"CPA-Q036",pdCode:"2.1.2.2.4",macroTopic:ba,topic:"Estrutura de fundos",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Um fundo é estruturado com diferentes classes e subclasses para organizar patrimônios e condições destinadas a grupos distintos de investidores.",prompt:"Qual conceito da Resolução CVM 175 é relevante para entender essa estrutura?",options:["Classes podem possuir patrimônios segregados, e subclasses podem diferenciar condições dentro da classe conforme regras aplicáveis.","Todo fundo deve ter um único patrimônio indivisível e não pode possuir classes.","Subclasse é sinônimo de emissor de título público.","Classes existem apenas para fundos imobiliários e são proibidas em fundos financeiros."],correctAnswer:0,explanation:"A Resolução CVM 175 modernizou a estrutura dos fundos, admitindo classes e subclasses e a segregação patrimonial entre classes.",whyOthersAreWrong:["","A regulamentação admite estrutura com classes.","Subclasse é conceito de estrutura de fundo, não de emissor público.","A estrutura não é exclusiva de FII."],sourceIds:["ANBIMA_PD","CVM_175"]}),oe({id:"CPA-Q037",pdCode:"2.1.2.2.5",macroTopic:ba,topic:"Segregação patrimonial",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Um fundo possui duas classes com patrimônios segregados. Uma delas enfrenta passivo elevado decorrente de sua própria carteira.",prompt:"Qual ideia é central para a análise?",options:["A segregação busca separar direitos e obrigações de cada classe, conforme a estrutura regulatória.","Qualquer dívida de uma classe necessariamente recai integralmente sobre todas as outras.","Segregação patrimonial significa garantia do FGC às cotas.","Segregação patrimonial impede qualquer perda de mercado dentro da classe."],correctAnswer:0,explanation:"A segregação patrimonial é uma característica importante da estrutura por classes, separando patrimônios e responsabilidades conforme as regras aplicáveis.",whyOthersAreWrong:["","A finalidade da segregação é justamente evitar mistura automática de patrimônios.","FGC não decorre da estrutura de classes de fundos.","Segregação não elimina risco dos ativos da classe."],sourceIds:["ANBIMA_PD","CVM_175"]}),oe({id:"CPA-Q038",pdCode:"2.1.2.2.7",macroTopic:ba,topic:"Classes abertas e fechadas",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Uma cliente deseja poder solicitar resgate diretamente ao fundo conforme os prazos definidos no regulamento. Outra estrutura não admite resgate ordinário de cotas antes do encerramento, embora possa haver negociação em mercado quando aplicável.",prompt:"Quais estruturas correspondem, respectivamente, às descrições?",options:["Classe aberta e classe fechada.","Classe fechada e classe aberta.","Fundo cambial e fundo de ações.","CDB e debênture."],correctAnswer:0,explanation:"Classes abertas admitem resgate conforme suas regras; classes fechadas não permitem resgate ordinário antes do prazo/encerramento, salvo hipóteses previstas.",whyOthersAreWrong:["","A ordem está invertida.","As classificações por estratégia não definem, por si, abertura ou fechamento.","São produtos de renda fixa, não estruturas de classe de fundo."],sourceIds:["ANBIMA_PD","CVM_175"]}),oe({id:"CPA-Q039",pdCode:"2.1.2.2.19.3",macroTopic:ba,topic:"Prestadores de serviços de fundos",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Em um fundo, um prestador toma decisões de investimento e desinvestimento da carteira dentro da política estabelecida, enquanto outro exerce funções de administração fiduciária previstas na regulamentação.",prompt:"Qual prestador está diretamente ligado às decisões de alocação da carteira?",options:["Gestor.","Administrador, exclusivamente por custodiar todos os ativos.","Cotista.","FGC."],correctAnswer:0,explanation:"A gestão profissional da carteira envolve decisões de investimento e desinvestimento dentro da política do fundo. Administração e outros serviços possuem atribuições próprias.",whyOthersAreWrong:["","Administração fiduciária possui funções diferentes; custódia também é serviço específico.","Cotista não executa a gestão profissional cotidiana da carteira.","FGC não é prestador de serviço de fundo."],sourceIds:["ANBIMA_PD","CVM_175"]}),oe({id:"CPA-Q040",pdCode:"2.1.2.2.20.1",macroTopic:ba,topic:"Taxas de fundos",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Dois fundos têm estratégias semelhantes, mas cobram taxas de administração diferentes. Um cliente avalia apenas a rentabilidade bruta estimada e ignora os custos.",prompt:"Qual orientação é mais adequada?",options:["Custos devem ser considerados porque reduzem o retorno líquido do cotista e precisam ser analisados junto com estratégia, riscos e serviços prestados.","Taxa de administração nunca afeta o retorno do cotista.","O fundo com maior taxa sempre terá maior retorno futuro.","Taxas substituem a necessidade de avaliar riscos da carteira."],correctAnswer:0,explanation:"Taxas integram a análise econômica do investimento. Elas não determinam sozinhas a qualidade do fundo, mas afetam o resultado líquido e devem ser comparadas com estratégia e riscos.",whyOthersAreWrong:["","Custos impactam o patrimônio/resultado conforme as regras do fundo.","Taxa maior não garante performance superior.","Custos e riscos são dimensões diferentes e ambas precisam ser avaliadas."],sourceIds:["ANBIMA_PD","CVM_175"]})],ya="Produtos do mercado financeiro",xC=[oe({id:"CPA-Q041",pdCode:"2.1.2.3.6.7",macroTopic:ya,topic:"Crédito privado em fundos",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Uma classe de fundo aumenta significativamente a parcela da carteira exposta a emissores privados. O investidor associa a expressão “crédito privado” apenas à possibilidade de retorno maior.",prompt:"Qual risco precisa ser destacado nessa análise?",options:["A possibilidade de perda por deterioração da capacidade de pagamento dos emissores, além de liquidez e mercado conforme os ativos.","A garantia automática do FGC sobre todas as cotas do fundo.","A inexistência de risco porque o gestor diversifica a carteira.","A impossibilidade de os preços dos ativos variarem antes do vencimento."],correctAnswer:0,explanation:"Exposição relevante a crédito privado exige atenção ao risco de crédito dos emissores, além dos demais riscos da carteira. Fundo não recebe garantia automática do FGC.",whyOthersAreWrong:["","Cotas de fundos não são garantidas pelo FGC.","Diversificação pode reduzir concentração, mas não elimina risco.","Ativos de crédito também podem sofrer variação de preço e liquidez."],sourceIds:["ANBIMA_PD","CVM_175"]}),oe({id:"CPA-Q042",pdCode:"2.1.2.3.6.2",macroTopic:ya,topic:"Tipos de fundos",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Uma carteira busca exposição predominante ao mercado acionário e aceita volatilidade compatível com esse objetivo.",prompt:"Qual tipificação de fundo está mais alinhada à estratégia descrita?",options:["Fundo de ações.","Fundo cambial, necessariamente.","Classe de renda fixa soberana sem exposição acionária.","Conta de pagamento."],correctAnswer:0,explanation:"Fundos de ações são estruturados para manter exposição relevante a ativos relacionados ao mercado acionário conforme os requisitos regulatórios aplicáveis.",whyOthersAreWrong:["","Fundo cambial tem foco em fatores ligados a moeda/câmbio.","Renda fixa sem exposição acionária não corresponde ao objetivo descrito.","Conta de pagamento não é fundo de investimento."],sourceIds:["ANBIMA_PD","CVM_175"]}),oe({id:"CPA-Q043",pdCode:"2.1.4.2",macroTopic:ya,topic:"Riscos de FII",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Um fundo imobiliário possui imóveis comerciais concentrados em uma única região e sofre aumento de vacância. Ao mesmo tempo, suas cotas têm baixa negociação no mercado.",prompt:"Quais riscos ficam mais evidentes?",options:["Vacância e liquidez, além dos riscos próprios dos ativos imobiliários.","Somente risco cambial, porque imóveis são cotados em moeda local.","Ausência total de risco por existir patrimônio imobiliário.","Cobertura automática do FGC contra queda das cotas."],correctAnswer:0,explanation:"FII pode enfrentar vacância, crédito dos locatários/devedores, liquidez de cotas e riscos do mercado imobiliário. Patrimônio real não elimina volatilidade ou perdas.",whyOthersAreWrong:["","Câmbio não é o risco central descrito.","Imóveis não tornam o investimento livre de risco.","Cotas de FII não têm cobertura do FGC."],sourceIds:["ANBIMA_PD","CVM"]}),oe({id:"CPA-Q044",pdCode:"2.1.4.5",macroTopic:ya,topic:"Fundos imobiliários de tijolo e papel",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Dois FIIs têm fontes de resultado diferentes: um concentra imóveis físicos locados; o outro investe principalmente em títulos e recebíveis ligados ao setor imobiliário.",prompt:"Como são chamados, em linguagem de mercado, respectivamente?",options:["Fundo de tijolo e fundo de papel.","Fundo cambial e fundo de ações.","PGBL e VGBL.","CDB e LCI."],correctAnswer:0,explanation:"FIIs de tijolo concentram ativos imobiliários físicos; FIIs de papel concentram títulos e recebíveis imobiliários. Há também estruturas híbridas.",whyOthersAreWrong:["","São tipificações de outros fundos, não essa distinção de FII.","PGBL e VGBL são produtos de previdência/seguro de pessoas.","CDB e LCI são títulos bancários."],sourceIds:["ANBIMA_PD","CVM"]}),oe({id:"CPA-Q045",pdCode:"2.2.1.1",macroTopic:ya,topic:"PGBL e VGBL",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Uma pessoa investidora quer entender a diferença tributária na fase de resgate entre Plano Gerador de Benefício Livre (PGBL) e Vida Gerador de Benefício Livre (VGBL).",prompt:"Qual comparação está correta, em linhas gerais?",options:["No PGBL, a tributação no resgate incide sobre o valor resgatado; no VGBL, sobre a parcela correspondente aos rendimentos, conforme o regime tributário aplicável.","No VGBL, o imposto sempre incide sobre todo o valor resgatado, e no PGBL apenas sobre os rendimentos.","PGBL e VGBL têm exatamente a mesma base de cálculo em qualquer situação.","Nenhum dos dois está sujeito a tributação no resgate."],correctAnswer:0,explanation:"A SUSEP diferencia a base tributável: PGBL tributa o montante resgatado/benefício; VGBL tributa a parcela de rendimentos, observadas as regras e o regime escolhido.",whyOthersAreWrong:["","A lógica está invertida.","As bases de incidência são diferentes.","Há tributa
