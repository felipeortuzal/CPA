`,10),bt=[...bd,...dr,...an,...tn],f2=new Map(bt.map(e=>[e.pdCode,e]));bt.filter(e=>e.parentCode===null);const h2={"1.1.1.1.1":"O Conselho Monetário Nacional (CMN) é o órgão normativo superior do Sistema Financeiro Nacional para as políticas monetária, de crédito e cambial, enquanto o Banco Central executa e supervisiona grande parte dessas diretrizes.","1.1.1.1.2":"O Conselho Nacional de Seguros Privados (CNSP) fixa diretrizes e normas para seguros, resseguros, capitalização e previdência complementar aberta, cuja supervisão cabe à Superintendência de Seguros Privados (SUSEP).","1.1.1.1.3":"O Conselho Nacional de Previdência Complementar (CNPC) exerce a função regulatória sobre o regime de previdência complementar operado pelas entidades fechadas, enquanto a Superintendência Nacional de Previdência Complementar (PREVIC) supervisiona esse segmento.","1.1.2.1.1":"O Banco Central do Brasil (BCB) executa políticas definidas no âmbito do Sistema Financeiro Nacional e autoriza, regula e supervisiona instituições sob sua competência, com foco também na estabilidade e no funcionamento do sistema.","1.1.2.1.2":"A Comissão de Valores Mobiliários (CVM) regula, desenvolve e fiscaliza o mercado de valores mobiliários, buscando proteger investidores e promover um mercado íntegro e eficiente.","1.1.2.1.3":"A Superintendência de Seguros Privados (SUSEP) supervisiona e fiscaliza os mercados de seguros, resseguros, capitalização e previdência complementar aberta.","1.1.2.1.4":"A Superintendência Nacional de Previdência Complementar (PREVIC) supervisiona e fiscaliza as entidades fechadas de previdência complementar e seus planos.","1.1.3.1.1":"Bancos e caixas econômicas intermedeiam recursos, oferecem contas, crédito, pagamentos e outros serviços, conectando poupadores, tomadores e o sistema de pagamentos.","1.1.3.1.2":"Cooperativas de crédito prestam serviços financeiros aos associados sob modelo cooperativo; bancos cooperativos ampliam a integração dessas cooperativas com o restante do sistema financeiro.","1.1.3.1.3":"Instituições de pagamento viabilizam serviços de pagamento e movimentação de recursos em arranjos de pagamento, sem que isso as transforme automaticamente em bancos.","1.1.3.1.4":"Administradoras de consórcios organizam grupos de autofinanciamento para aquisição de bens ou serviços, administrando contribuições, assembleias e contemplações.","1.1.3.1.5":"Corretoras e distribuidoras intermedeiam operações e distribuem produtos financeiros e valores mobiliários, conectando investidores ao mercado conforme as autorizações aplicáveis.","1.1.3.1.6":"Fintechs usam tecnologia para oferecer ou viabilizar serviços financeiros; o termo descreve um modelo de negócio e não, sozinho, uma categoria regulatória única.","1.1.3.1.7":"Sociedades de crédito, financiamento e investimento, conhecidas como financeiras, têm atuação típica no financiamento ao consumo e em outras modalidades de crédito autorizadas.","1.1.3.1.8":"Companhias hipotecárias atuam em operações vinculadas ao financiamento imobiliário e ao mercado de créditos imobiliários dentro do marco regulatório aplicável.","1.1.3.1.9":"Agências de fomento apoiam projetos e atividades econômicas em sua área de atuação, oferecendo financiamento orientado ao desenvolvimento.","1.1.3.1.10":"Sociedades de crédito ao microempreendedor e à empresa de pequeno porte direcionam crédito e serviços a atividades produtivas de menor porte, dentro dos limites regulatórios.","1.1.3.1.11":"Sociedades de Crédito Imobiliário (SCI) são instituições voltadas a operações relacionadas ao financiamento imobiliário e à captação permitida para esse segmento.","1.1.3.1.12":"A B3 S.A. — Brasil, Bolsa, Balcão (B3) provê infraestrutura para negociação, registro, compensação, liquidação e depósito centralizado de ativos e valores mobiliários.","1.1.3.1.13":"Seguradoras assumem riscos mediante contratos de seguro; resseguradoras recebem, por resseguro, parte dos riscos assumidos por seguradoras.","1.1.3.1.14":"Entidades Abertas de Previdência Complementar (EAPC) oferecem planos de previdência complementar acessíveis ao público, sob supervisão da SUSEP.","1.1.3.1.15":"Sociedades de capitalização comercializam títulos de capitalização, produtos com regras próprias de acumulação, sorteios e resgate que não devem ser confundidos com investimentos tradicionais.","1.1.3.1.16":"Entidades Fechadas de Previdência Complementar (EFPC), também chamadas fundos de pensão, administram planos destinados a grupos vinculados a patrocinadores ou instituidores, sob supervisão da PREVIC.","1.1.3.1.17":"Corretoras de seguros fazem a intermediação entre clientes e seguradoras, auxiliando na contratação de seguros dentro das regras do setor.","1.1.4.1":"A Associação Brasileira das Entidades dos Mercados Financeiro e de Capitais (ANBIMA) representa instituições e exerce autorregulação em atividades e mercados cobertos por seus códigos.","1.1.4.2":"A Associação dos Analistas e Profissionais de Investimento do Mercado de Capitais (APIMEC), a Planejar — Associação Brasileira de Planejamento Financeiro — e a Associação Nacional das Corretoras de Valores, Câmbio e Mercadorias (ANCORD) são entidades ligadas a categorias e atividades profissionais distintas, com funções próprias de certificação, representação ou autorregulação.","1.1.4.3":"O Fundo Garantidor de Créditos (FGC) e o Fundo Garantidor do Cooperativismo de Crédito (FGCoop) mantêm mecanismos de proteção para determinadas obrigações de instituições participantes, sujeitos a produtos, limites e regras de elegibilidade.","1.1.5":"O Sistema de Pagamentos Brasileiro (SPB) reúne regras, procedimentos e infraestruturas que permitem transferir recursos, liquidar obrigações e reduzir riscos nas transações financeiras.","1.2.1.1":"O fluxo circular da renda mostra como famílias, empresas, governo e mercados trocam bens, serviços, fatores de produção, renda e gastos, fazendo as decisões de um agente afetarem os demais.","1.2.2.1":"O mercado monetário concentra operações de curto prazo ligadas à liquidez da economia e à transmissão da política monetária.","1.2.2.2":"O mercado cambial reúne operações de compra e venda de moedas e transferências internacionais, formando taxas de câmbio conforme regras e condições de mercado.","1.2.2.3":"O mercado de crédito conecta agentes superavitários e deficitários por meio de empréstimos e financiamentos, com preço refletido principalmente em juros, prazos e risco de crédito.","1.2.2.4":"O mercado de capitais aproxima emissores e investidores por meio de valores mobiliários, permitindo captação de recursos e negociação de instrumentos como ações e debêntures.","1.2.3.1":"Política fiscal é o uso de receitas, despesas e financiamento público para cumprir objetivos do Estado e influenciar atividade econômica, demanda e trajetória da dívida.","1.2.3.2":"Uma política fiscal pode ser expansionista ou contracionista conforme a combinação de gastos, tributos e resultados fiscais, sempre observada em conjunto com o ciclo econômico e as restrições orçamentárias.","1.2.3.3":"Déficits, dívida, inflação, juros e investimento se relacionam porque a forma de financiar o setor público altera demanda, risco, expectativas e condições financeiras.","1.2.3.4":"O financiamento do governo precisa respeitar regras fiscais e de responsabilidade na gestão das contas públicas, com impacto direto na sustentabilidade da dívida e na confiança dos agentes.","1.2.4.1":"Política monetária expansionista busca afrouxar condições monetárias, enquanto a contracionista busca apertá-las; ambas afetam juros, crédito, demanda e inflação.","1.2.4.2":"Operações de mercado aberto, redesconto e recolhimentos compulsórios são instrumentos pelos quais o Banco Central influencia liquidez e condições monetárias.","1.2.4.3":"Os canais de transmissão explicam como decisões monetárias chegam à economia por juros, crédito, preços de ativos, câmbio e expectativas.","1.2.4.4":"Mudanças nas condições monetárias alteram taxas de curto e longo prazo, valor dos ativos, custo do crédito, atividade e inflação por diferentes canais e com defasagens.","1.2.4.5":"O Comitê de Política Monetária (Copom) do Banco Central do Brasil define a meta para a Taxa Selic dentro do regime monetário, e essa decisão influencia preços de ativos, crédito, atividade e inflação.","1.2.4.6":"O regime de metas para a inflação orienta a política monetária em torno de uma meta oficial, enquanto expectativas de inflação influenciam decisões de preços, salários, juros e investimentos.","1.2.4.7":"A meta da Taxa Selic é definida pelo Comitê de Política Monetária (Copom); a Selic efetiva resulta das operações do mercado de reservas, e a Taxa DI, ligada aos depósitos interfinanceiros e aos Certificados de Depósito Interbancário (CDI), é referência privada próxima, mas não idêntica.","1.2.5.1":"Política cambial reúne ações e regras relacionadas ao mercado de câmbio e à gestão de condições externas, sem significar que o Banco Central fixe necessariamente uma cotação para a moeda.","1.2.5.2":"Regimes cambiais descrevem como a taxa de câmbio é determinada; reservas internacionais são ativos externos do país e o cupom cambial representa uma taxa de juros em dólares implícita em operações no mercado doméstico.","1.2.5.3":"O cupom cambial influencia o custo relativo de posições em moeda estrangeira e pode afetar decisões de hedge, arbitragem e investimento.","1.2.5.4":"O swap cambial é um derivativo usado para trocar exposições financeiras, permitindo administrar risco relacionado à variação cambial sem envolver necessariamente entrega física de moeda.","1.2.5.5":"Taxa nominal é a cotação observada; taxa real ajusta diferenças de preços, PTAX é uma taxa de referência calculada pelo Banco Central, e as expressões comercial/turismo refletem contextos distintos de operação.","1.2.6.1":"O Produto Interno Bruto (PIB) mede o valor dos bens e serviços finais produzidos em uma economia em determinado período e pode ser analisado por consumo, investimento, governo e setor externo.","1.2.6.2":"O Índice Nacional de Preços ao Consumidor Amplo (IPCA), o Índice Geral de Preços – Mercado (IGP-M), o Índice de Preços ao Produtor Amplo (IPA) e o Índice de Preços ao Consumidor da Fipe (IPC-Fipe) medem universos e etapas de preços diferentes e não devem ser tratados como indicadores intercambiáveis.","1.2.6.3":"A taxa de desemprego mede a parcela da força de trabalho que procura e não encontra ocupação, sendo relevante para avaliar folga do mercado de trabalho, renda e pressão sobre a atividade.","1.2.6.4":"A Taxa Selic, a Taxa de Depósitos Interfinanceiros (DI) e a Taxa Referencial (TR) são referências distintas: a Selic está ligada à política monetária e ao mercado de títulos públicos, a DI ao mercado interfinanceiro e a TR segue metodologia própria para usos previstos em lei e contratos.","1.2.7":"Risco de liquidez é a dificuldade de vender ou honrar obrigações sem perdas relevantes; risco de crédito é a possibilidade de inadimplência; risco de mercado decorre de oscilações de preços, taxas e fatores de mercado.","1.3.1":"A taxa nominal é a taxa expressa sem descontar a inflação, enquanto a taxa real representa o ganho de poder de compra; um indexador é a referência usada para atualizar valores ao longo do tempo.","1.3.2":"Juros simples incidem sempre sobre o principal inicial, enquanto juros compostos incorporam os juros acumulados à base de cálculo, gerando crescimento exponencial.","1.3.3.1":"Em ativos de crédito privado, o fluxo ao investidor pode combinar pagamentos de juros e amortizações do principal conforme as regras de cada emissão.","1.3.3.2.1":"Um fluxo de pagamentos organiza valores e datas de entradas e saídas, permitindo comparar contratos somente quando taxa e tempo são tratados de forma consistente.","1.3.3.2.2":"Fluxo de caixa representa cronologicamente entradas e saídas; em títulos, cupons remuneram o capital e amortizações devolvem principal conforme a estrutura contratual.","1.3.3.2.3":"Valor Presente traz fluxos futuros para hoje, Valor Futuro leva valores atuais adiante e o Valor Presente Líquido (VPL) soma fluxos descontados menos o investimento inicial.","1.3.3.3":"Taxa de desconto é a taxa usada para converter valores futuros em equivalentes presentes, refletindo o custo de oportunidade e, conforme o caso, risco do fluxo.","1.3.3.4":"Taxa bruta mede retorno antes de impostos e outros descontos considerados, enquanto taxa líquida mostra o que efetivamente permanece para o investidor após esses efeitos.","1.3.3.5.1":"Vencimento é a data final contratual; prazo médio considera a distribuição temporal dos fluxos de principal e não deve ser confundido automaticamente com o vencimento.","1.3.3.5.2":"A Taxa Interna de Retorno (TIR) é a taxa que zera o Valor Presente Líquido dos fluxos de um investimento.","1.3.3.5.3":"Custo de oportunidade é o retorno ou benefício da melhor alternativa sacrificada quando se escolhe uma decisão financeira.","1.3.3.5.4":"Taxa livre de risco é uma referência teórica/prática de retorno com risco de crédito mínimo, usada como base para avaliar prêmios de risco.","1.3.3.5.5":"O Custo Médio Ponderado de Capital (CMPC), também conhecido pela sigla inglesa WACC (Weighted Average Cost of Capital), combina o custo das fontes de dívida e de capital próprio segundo seus pesos na estrutura de financiamento.","1.3.3.5.6.1":"Alavancagem financeira usa capital de terceiros para ampliar a capacidade de investimento, mas também aumenta sensibilidade do resultado ao custo da dívida e ao desempenho dos ativos.","1.3.3.6.1":"Retorno histórico de um ativo mede o que ocorreu no passado; retorno esperado é uma estimativa prospectiva e não uma promessa de rentabilidade.","1.3.3.6.2":"O retorno de uma carteira depende dos pesos de cada ativo e de seus retornos; para risco, também importa como os ativos se movimentam em conjunto.","1.3.4.1":"Taxas nominal, efetiva e real medem coisas diferentes: a nominal pode ser cotada em uma base, a efetiva incorpora a capitalização do período e a real desconta o efeito da inflação.","1.3.4.2":"Taxa prefixada é conhecida no momento da contratação; pós-fixada depende da evolução de um indexador ou referência definida no contrato.","1.3.4.3":"Juros simples crescem linearmente sobre o principal inicial; juros compostos acumulam juros sobre juros e dominam grande parte das operações financeiras de longo prazo.","1.3.5":"No desconto comercial simples, o desconto é calculado sobre o valor nominal futuro do título, e não sobre seu valor presente.","1.3.6":"Payback é o tempo necessário para recuperar o desembolso inicial pelos fluxos gerados pelo investimento, sendo uma métrica simples que não substitui análise de valor presente.","1.3.7":"No Sistema de Amortização Constante (SAC), a amortização do principal é constante e as parcelas tendem a cair; no sistema Price, as prestações são constantes quando taxa e condições permanecem fixas.","1.3.8.1":"Desconto bancário simples antecipa um recebível subtraindo um desconto calculado sobre o valor nominal e o prazo restante até o vencimento.","1.4.1.1.1":"O Sistema de Pagamentos Brasileiro (SPB) reúne infraestruturas, regras e participantes que processam e liquidam pagamentos e transferências, contribuindo para segurança e eficiência do sistema financeiro.","1.4.1.1.2":"O Sistema de Pagamentos Instantâneos (SPI) é a infraestrutura central operada pelo Banco Central para liquidação das transações Pix entre participantes.","1.4.1.2.1":"O Sistema Especial de Liquidação e de Custódia (Selic) é a infraestrutura em que se registram e liquidam, entre outras operações, títulos públicos federais.","1.4.1.3":"Uma contraparte central se interpõe entre compradores e vendedores em mercados elegíveis, tornando-se contraparte das operações e administrando riscos de liquidação e contraparte.","1.4.1.4":"Um depositário central mantém registro centralizado da titularidade de ativos desmaterializados e dá suporte à movimentação e à liquidação desses ativos.","1.4.1.5":"Uma entidade registradora registra informações sobre operações e ativos, aumentando rastreabilidade e transparência conforme a regulação aplicável.","1.4.2.1":"O Comitê de Estabilidade Financeira (Comef), os recolhimentos compulsórios e as Linhas Financeiras de Liquidez — Linha de Liquidez Imediata (LLI) e Linha de Liquidez a Termo (LLT) — integram mecanismos usados pelo Banco Central para monitorar riscos e administrar condições de liquidez e estabilidade.","1.4.3.1":"Risco sistêmico é o risco de problemas em instituições, mercados ou infraestruturas se propagarem e comprometerem o funcionamento do sistema financeiro e da economia.","1.4.3.2":"Basileia I, II e III são marcos internacionais que evoluíram requisitos de capital, gestão de riscos, liquidez e alavancagem para aumentar a resiliência dos bancos.","1.4.4":"Clearing houses apoiam registro, compensação e liquidação de operações e podem administrar garantias e risco de contraparte conforme o mercado e a infraestrutura.","1.4.5":"Risco de contraparte é a possibilidade de a outra parte de uma operação não cumprir suas obrigações, podendo gerar perda e efeito em cadeia em mercados interligados.","1.4.6":"B3 e Selic exercem papéis distintos na infraestrutura: a B3 opera ambientes e serviços de mercado, enquanto o Selic é central para custódia e liquidação de títulos públicos federais.","1.4.7":"Portabilidade de custódia permite transferir a posição de determinados ativos entre instituições, observando procedimentos, titularidade e regras operacionais aplicáveis.","1.4.8":"Desintermediação financeira ocorre quando poupadores e tomadores se conectam com menos intermediação bancária tradicional, por exemplo via emissão direta de valores mobiliários.","1.4.9":"A BSM Supervisão de Mercados (BSM) atua na autorregulação e supervisão dos mercados administrados pela B3, monitorando participantes e práticas conforme suas competências.","1.4.10.1.1":"A regulação da CVM distingue investidores profissionais, qualificados e outras categorias porque determinados produtos, ofertas e dispensas pressupõem diferentes níveis de conhecimento, patrimônio ou enquadramento.","1.4.10.1.2":"O enquadramento de investidores profissionais, qualificados e não residentes deve seguir os critérios objetivos da Resolução CVM 30 e não pode ser presumido apenas pela experiência percebida do cliente.","1.4.11":"A Lei nº 13.874/2019, conhecida como Lei de Liberdade Econômica, estabelece garantias de livre iniciativa e princípios para a atuação do Estado sobre atividades econômicas.","1.4.12.1.1":"O Código ANBIMA de Distribuição define seu objetivo e abrangência para atividades de distribuição realizadas pelas instituições participantes dentro do escopo de autorregulação.","1.4.12.1.2":"Os princípios gerais de conduta do Código ANBIMA de Distribuição orientam atuação ética, diligente, transparente e compatível com os interesses dos clientes.","1.4.12.1.3.1":"Conheça sua clientela (KYC) reúne procedimentos para identificar, qualificar e manter informações do cliente adequadas às obrigações regulatórias e aos riscos do relacionamento.","1.4.12.1.3.2":"Suitability é o processo de verificar se produtos, serviços e operações são adequados ao perfil, objetivos, situação financeira e conhecimento do cliente conforme as regras aplicáveis.","1.4.12.1.3.3":"Publicidade de produtos de investimento deve ser clara, equilibrada e compatível com as regras de divulgação, sem induzir o investidor a conclusões enganosas sobre retorno e risco.","1.4.12.1.3.4":"Transparência na remuneração exige informar, conforme as regras aplicáveis, como o canal de distribuição é remunerado e quais conflitos de interesse podem decorrer desse modelo.","1.4.12.1.3.5":"Serviços de intermediação no exterior exigem atenção ao papel da instituição brasileira, às informações prestadas e às regras aplicáveis à oferta ou encaminhamento do cliente.","1.4.12.1.3.6":"Transferência de produtos de investimento deve seguir procedimentos que preservem titularidade, informações e continuidade operacional entre instituições.","1.4.12.1.3.7":"Apuração de valores de referência busca oferecer parâmetros consistentes para determinados produtos, com metodologia e transparência compatíveis com as regras da autorregulação.","1.4.12.1.3.8":"Na distribuição para o segmento private, além das regras gerais, aplicam-se requisitos específicos de atendimento e estrutura definidos pela autorregulação ANBIMA."},Fe="2026-09-20",yd={ANBIMA_PD:{id:"ANBIMA_PD",institution:"ANBIMA",title:"Programa Detalhado CPA — versão 1.2",url:"https://www.anbima.com.br/data/files/6A/52/6F/A1/BED73910B07B2739B82BA2A8/Programa-Detalhado-CPA-ANBIMA.pdf",verifiedAt:Fe},ANBIMA_DISTRIBUICAO:{id:"ANBIMA_DISTRIBUICAO",institution:"ANBIMA",title:"Código de Distribuição de Produtos de Investimento",url:"https://www.anbima.com.br/pt_br/autorregular/codigos/distribuicao-de-produtos-de-investimento.htm",verifiedAt:Fe},BCB_SFN:{id:"BCB_SFN",institution:"Banco Central do Brasil",title:"Sistema Financeiro Nacional",url:"https://www.bcb.gov.br/estabilidadefinanceira/sfn",verifiedAt:Fe},BCB_SPB:{id:"BCB_SPB",institution:"Banco Central do Brasil",title:"Sistema de Pagamentos Brasileiro",url:"https://www.bcb.gov.br/estabilidadefinanceira/spb",verifiedAt:Fe},BCB_POLITICA:{id:"BCB_POLITICA",institution:"Banco Central do Brasil",title:"Política monetária e inflação",url:"https://www.bcb.gov.br/controleinflacao",verifiedAt:Fe},BCB_SELIC:{id:"BCB_SELIC",institution:"Banco Central do Brasil",title:"Taxa Selic",url:"https://www.bcb.gov.br/controleinflacao/taxaselic",verifiedAt:Fe},BCB_CAMBIO:{id:"BCB_CAMBIO",institution:"Banco Central do Brasil",title:"Câmbio e capitais internacionais",url:"https://www.bcb.gov.br/estabilidadefinanceira/cambio",verifiedAt:Fe},BCB_ESTABILIDADE:{id:"BCB_ESTABILIDADE",institution:"Banco Central do Brasil",title:"Estabilidade financeira",url:"https://www.bcb.gov.br/estabilidadefinanceira",verifiedAt:Fe},BCB_BASILEIA:{id:"BCB_BASILEIA",institution:"Banco ression:"M = C × (1 + i)^n",explanation:"Cada período incorpora os juros acumulados ao capital."}],"1.3.3.2.3":[{name:"Valor futuro",expression:"VF = VP × (1 + i)^n",explanation:"Capitaliza o valor presente até a data futura."},{name:"Valor presente",expression:"VP = VF / (1 + i)^n",explanation:"Desconta um valor futuro para hoje."},{name:"Valor Presente Líquido",expression:"VPL = Σ FC_t/(1+k)^t − Investimento inicial",explanation:"Um VPL positivo indica valor acima da taxa mínima k, dadas as premissas."}],"1.3.3.5.2":[{name:"Taxa Interna de Retorno",expression:"0 = Σ FC_t/(1+TIR)^t − Investimento inicial",explanation:"A TIR é a taxa que zera o VPL; sua interpretação exige cuidado com fluxos não convencionais."}],"1.3.3.5.5":[{name:"CMPC / WACC",expression:"CMPC = w_d × k_d × (1−T) + w_e × k_e",explanation:"Combina custo da dívida após efeito tributário quando aplicável e custo do capital próprio pelos respectivos pesos."}],"1.3.3.6.1":[{name:"Retorno de um ativo",expression:"R = (Preço final − Preço inicial + Rendimentos) / Preço inicial",explanation:"Inclui valorização e rendimentos recebidos no período."}],"1.3.3.6.2":[{name:"Retorno esperado da carteira",expression:"E(R_p) = Σ w_i × E(R_i)",explanation:"O retorno esperado é a média ponderada dos retornos esperados pelos pesos."}],"1.3.4.1":[{name:"Fisher",expression:"1 + i_nominal = (1 + i_real) × (1 + inflação)",explanation:"A aproximação i_real ≈ i_nominal − inflação funciona melhor para taxas pequenas; a relação exata é multiplicativa."}],"1.3.4.3":[{name:"Juros simples",expression:"J = C × i × n",explanation:"Crescimento linear dos juros."},{name:"Juros compostos",expression:"M = C × (1+i)^n",explanation:"Crescimento exponencial do montante."}],"1.3.5":[{name:"Desconto comercial simples",expression:"D = N × d × n",explanation:"O desconto D incide sobre o valor nominal N."},{name:"Valor atual",expression:"A = N − D",explanation:"Valor recebido após deduzir o desconto."}],"1.3.6":[{name:"Payback simples",expression:"Payback = momento em que o fluxo acumulado ≥ investimento inicial",explanation:"Com fluxos irregulares, some entradas período a período até recuperar o desembolso."}],"1.3.7":[{name:"SAC — amortização",expression:"A = Principal / número de parcelas",explanation:"A amortização é constante; os juros caem com o saldo devedor."},{name:"Price — prestação",expression:"PMT = PV × [i(1+i)^n] / [(1+i)^n − 1]",explanation:"Com taxa fixa e pagamentos periódicos, a prestação é constante."}],"1.3.8.1":[{name:"Desconto bancário simples",expression:"D = N × d × n",explanation:"O desconto é calculado sobre o valor nominal; o valor liberado é N − D, antes de outros encargos."}]},x2={"1.1.1.1.1":[{left:"CMN",right:"Banco Central do Brasil (BCB)",explanation:"O CMN formula diretrizes e normas; o BCB executa, regula e supervisiona dentro de suas competências."}],"1.1.1.1.2":[{left:"CNSP",right:"SUSEP",explanation:"O CNSP é normativo no sistema de seguros privados; a SUSEP é a supervisora do segmento."}],"1.1.1.1.3":[{left:"CNPC",right:"PREVIC",explanation:"O CNPC regula a previdência complementar fechada; a PREVIC supervisiona as entidades fechadas."}],"1.1.2.1.1":[{left:"Banco Central do Brasil (BCB)",right:"CMN",explanation:"O BCB executa e supervisiona; o CMN estabelece diretrizes superiores para o sistema monetário, creditício e cambial."}],"1.1.2.1.2":[{left:"CVM",right:"Banco Central do Brasil (BCB)",explanation:"A CVM tem foco no mercado de valores mobiliários; o BCB supervisiona instituições e mercados sob sua competência."}],"1.1.2.1.3":[{left:"SUSEP",right:"PREVIC",explanation:"A SUSEP supervisiona seguros e previdência aberta; a PREVIC supervisiona previdência complementar fechada."}],"1.1.3.1.1":[{left:"Banco",right:"Instituição de pagamento",explanation:"Bancos podem fazer intermediação financeira conforme suas autorizações; instituição de pagamento tem foco em serviços de pagamento e não vira banco apenas por movimentar recursos."}],"1.1.3.1.13":[{left:"Seguradora",right:"Resseguradora",explanation:"A seguradora assume o risco do segurado; a resseguradora assume parte do risco cedido pela seguradora."}],"1.1.3.1.14":[{left:"EAPC",right:"EFPC",explanation:"A entidade aberta oferece planos ao público; a entidade fechada atende grupos vinculados a patrocinadores ou instituidores."}],"1.1.4.3":[{left:"FGC",right:"FGCoop",explanation:"Ambos são mecanismos de garantia, mas atendem universos de instituições participantes diferentes e seguem regras próprias."}],"1.2.3.1":[{left:"Política fiscal",right:"Política monetária",explanation:"Fiscal usa receitas e despesas públicas; monetária atua principalmente sobre juros, liquidez e condições monetárias."}],"1.2.4.1":[{left:"Expansionista",right:"Contracionista",explanation:"A expansionista afrouxa condições monetárias; a contracionista as aperta para moderar demanda e pressões inflacionárias."}],"1.2.4.7":[{left:"Meta Selic",right:"Selic efetiva",explanation:"A meta é a referência decidida pelo Copom; a efetiva resulta das operações realizadas no mercado correspondente."}],"1.2.5.5":[{left:"Câmbio nominal",right:"Câmbio real",explanation:"O nominal é a cotação observada; o real ajusta o nominal por níveis relativos de preços."}],"1.2.7":[{left:"Risco de crédito",right:"Risco de mercado",explanation:"Crédito é o risco de não pagamento; mercado é a perda por variação de preços, taxas ou fatores de mercado."}],"1.3.2":[{left:"Juros simples",right:"Juros compostos",explanation:"Nos simples a base permanece o principal inicial; nos compostos os juros acumulados entram na base seguinte."}],"1.3.3.5.1":[{left:"Prazo médio",right:"Vencimento",explanation:"Vencimento é a data final; prazo médio pondera quando o principal efetivamente retorna."}],"1.3.3.6.1":[{left:"Retorno histórico",right:"Retorno esperado",explanation:"Histórico descreve o passado; esperado é uma estimativa prospectiva e incerta."}],"1.3.4.2":[{left:"Prefixada",right:"Pós-fixada",explanation:"Prefixada fixa a taxa conhecida na contratação; pós-fixada depende do indexador definido."}],"1.3.7":[{left:"SAC",right:"Price",explanation:"SAC tem amortização constante e parcelas decrescentes; Price tem prestação constante sob condições fixas."}],"1.4.1.3":[{left:"Contraparte central",right:"Depositário central",explanation:"A contraparte central administra risco de contraparte ao se interpor nas operações; o depositário mantém registro central da titularidade dos ativos."}],"1.4.3.1":[{left:"Risco sistêmico",right:"Risco individual",explanation:"O sistêmico envolve propagação e ameaça ao funcionamento do sistema; o individual pode permanecer restrito a uma entidade ou operação."}],"1.4.6":[{left:"B3",right:"Selic",explanation:"A B3 oferece diversas infraestruturas de mercado; o Selic é a infraestrutura central de títulos públicos federais."}],"1.4.12.1.3.1":[{left:"Conheça sua clientela",right:"Suitability",explanation:"KYC identifica e qualifica o cliente e riscos do relacionamento; suitability avalia adequação de produtos e operações ao perfil."}]};function C2(e){return e==="1.1.1.1.1"?["ANBIMA_PD","CMN","BCB_SFN"]:e==="1.1.1.1.2"||e==="1.1.2.1.3"?["ANBIMA_PD","SUSEP"]:e==="1.1.1.1.3"?["ANBIMA_PD","CNPC","PREVIC"]:e==="1.1.2.1.2"?["ANBIMA_PD","CVM"]:e==="1.1.2.1.4"||e==="1.1.3.1.16"?["ANBIMA_PD","PREVIC"]:e.startsWith("1.1.3.1.12")?["ANBIMA_PD","B3","BCB_SFN"]:["1.1.3.1.13","1.1.3.1.14","1.1.3.1.15","1.1.3.1.17"].includes(e)?["ANBIMA_PD","SUSEP"]:e.startsWith("1.1.4.1")?["ANBIMA_PD","ANBIMA_DISTRIBUICAO"]:e.startsWith("1.1")?["ANBIMA_PD","BCB_SFN"]:e==="1.2.3.4"?["ANBIMA_PD","PLANALTO_LRF"]:e.startsWith("1.2.5")?["ANBIMA_PD","BCB_CAMBIO"]:e.startsWith("1.2.6")?["ANBIMA_PD","BCB_POLITICA","IBGE"]:e.startsWith("1.2")?["ANBIMA_PD","BCB_POLITICA","BCB_SELIC"]:e.startsWith("1.3")?["ANBIMA_PD","BCB_SELIC"]:e.startsWith("1.4.1")||["1.4.4","1.4.5","1.4.6","1.4.7"].includes(e)?["ANBIMA_PD","BCB_SPB","B3"]:e.startsWith("1.4.2")||e.startsWith("1.4.3")?["ANBIMA_PD","BCB_ESTABILIDADE","BCB_BASILEIA"]:e.startsWith("1.4.10")?["ANBIMA_PD","CVM_RES30"]:e==="1.4.11"?["ANBIMA_PD","PLANALTO_LIBERDADE"]:e.startsWith("1.4.12")?["ANBIMA_PD","ANBIMA_DISTRIBUICAO"]:["ANBIMA_PD","BCB_SFN"]}function b2(e){return e.startsWith("1.1")?"arquitetura do Sistema Financeiro Nacional":e.startsWith("1.2")?"política econômica e indicadores":e.startsWith("1.3")?"operações e matemática financeira":"regulação e infraestrutura de mercado"}function y2(e,r,s){return e.startsWith("1.1")?`Pense no Sistema Financeiro Nacional como uma rede com três papéis: quem cria regras, quem supervisiona e quem opera. ${r} aparece nessa rede com uma função específica. ${s} Para a CPA, entenda o papel antes de decorar a sigla.`:e.startsWith("1.2")?`Economia funciona como decisões conectadas. ${s} Em vez de memorizar isoladamente, pergunte: se isso mudar, quem sente o efeito e por qual caminho?`:e.startsWith("1.3")?`Aqui a ideia é colocar tempo, taxa e fluxo de dinheiro na mesma base. ${s} Antes da conta, identifique prazo, periodicidade e o que a questão realmente pede.`:`Mercados precisam de regras, infraestrutura e controles de risco. ${s} Na CPA, identifique quem registra, liquida, supervisiona ou protege a operação e qual risco é tratado.`}function w2(e,r){return e.startsWith("1.1")?[`Identificar qual entidade ou participante exerce a função descrita em um caso sobre ${r}.`,"Distinguir órgão normativo, supervisor e operador quando a questão trocar atribuições.","Aplicar a função institucional a uma situação de cliente ou mercado."]:e.startsWith("1.2")?[`Interpretar o efeito provável de uma mudança econômica envolvendo ${r}.`,"Diferenciar causa, instrumento, indicador e consequência.","Relacionar política econômica a juros, inflação, câmbio, crédito, atividade ou expectativas sem assumir relações mecânicas."]:e.startsWith("1.3")?[`Escolher o conceito ou cálculo adequado para uma situação envolvendo ${r}.`,"Converter corretamente taxa e período antes de calcular.","Interpretar o resultado financeiro, não apenas chegar a um número."]:[`Reconhecer a função correta de ${r} em uma operação ou obrigação regulatória.`,"Separar infraestrutura, supervisão, autorregulação e mitigação de risco.","Identificar o risco ou conflito que a regra procura reduzir."]}function A2(e,r){return e.startsWith("1.1")?[`Não atribua a ${r} a função de outra entidade do mesmo subsistema.`,"Normativo, supervisor, autorregulador e operador não são sinônimos.","Sigla semelhante não substitui a competência descrita no enunciado."]:e.startsWith("1.2")?[`Não trate o efeito de ${r} como automático e isolado; expectativas e defasagens importam.`,"Taxa, índice e meta podem ter nomes próximos e funções diferentes.","Cuidado com alternativas que invertem causa e consequência."]:e.startsWith("1.3")?[`Não aplique fórmula de ${r} sem alinhar taxa e período.`,"Nominal, efetivo, real, bruto e líquido respondem a perguntas diferentes.","Conta correta com interpretação econômica errada continua sendo resposta errada."]:[`Não confunda ${r} com outra etapa da infraestrutura ou com o supervisor.`,"Garantia, registro, compensação, liquidação, custódia e supervisão são funções diferentes.","Enquadramentos dependem do critério normativo vigente, não de percepção subjetiva."]}function j2(e){return e.startsWith("1.1")?[{left:"Normatização",right:"Supervisão/Operação",explanation:"Normatizar estabelece diretrizes; supervisionar fiscaliza; operar presta o serviço."}]:e.startsWith("1.2")?[{left:"Indicador",right:"Instrumento de política",explanation:"Indicador mede uma condição; instrumento é usado pela autoridade para influenciá-la."}]:e.startsWith("1.3")?[{left:"Fórmula",right:"Interpretação",explanation:"A fórmula organiza a conta; a decisão exige entender risco, retorno, prazo e fluxo."}]:[{left:"Infraestrutura/regra",right:"Participante",explanation:"A infraestrutura ou regra organiza e reduz riscos; o participante executa sua atividade dentro dela."}]}function P2(e,r){return e.startsWith("1.1")?`Um cliente pergunta quem define uma regra, quem fiscaliza e quem presta o serviço ligado a ${r}. A resposta correta vem da função de cada participante, não da sigla mais conhecida.`:e.startsWith("1.2")?`Juros, inflação ou câmbio mudam e um investidor pergunta o impacto. Use ${r} para explicar o canal de transmissão, a direção provável e quais outras variáveis também importam.`:e.startsWith("1.3")?`Dois investimentos parecem pagar taxas parecidas, mas têm prazos e fluxos diferentes. ${r} ajuda a colocá-los na mesma base antes da comparação.`:`Uma operação atravessa participantes e infraestruturas antes da liquidação. Em ${r}, identifique a função concreta e o risco, obrigação ou conflito tratado.`}function N2(e,r,s,n,d){return[{question:`Qual alternativa resume melhor ${r}?`,options:[s,"É apenas uma expressão comercial, sem função econômica ou regulatória específica.","Garante rentabilidade positiva a qualquer investidor.","Aplica-se somente fora do Sistema Financeiro Nacional."],correctIndex:0,explanation:s},{question:`Em questão contextualizada sobre ${r}, qual abordagem é adequada?`,options:[n[0],"Escolher a sigla mais conhecida mesmo com função diferente.","Ignorar prazo, risco e contexto.","Assumir que toda relação econômica é automática."],correctIndex:0,explanation:n[0]},{question:`Qual cuidado é importante ao estudar ${r}?`,options:[d[0],"Tratar conceitos próximos como sinônimos.","Ignorar a fonte oficial quando houver regra vigente.","Memorizar só a sigla e ignorar a função."],correctIndex:0,explanation:d[0]}]}const S2=new Set(bd.flatMap(e=>e.parentCode?[e.parentCode]:[])),Di=bd.filter(e=>!S2.has(e.pdCode)).map(e=>{const r=h2[e.pdCode];if(!r)throw new Error(`Conteúdo ausente para ${e.pdCode}`);const s=e.title.replace(/\.$/,""),n=w2(e.pdCode,s),d=A2(e.pdCode,s),c=[s,r.split(/[.;]/)[0],`Enquadramento no PD ${e.pdCode}`,e.pdCode.startsWith("1.1")?"Normatizar ≠ supervisionar ≠ operar":e.pdCode.startsWith("1.2")?"Direção do impacto e canal de transmissão":e.pdCode.startsWith("1.3")?"Taxa, prazo e fluxo na mesma base temporal":"Função da infraestrutura/regra e risco mitigado"];return{certification:"CPA",programVersion:"1.2",pdCode:e.pdCode,parentCode:e.parentCode,title:s,oneSentence:r,beginnerExplanation:y2(e.pdCode,s,r),completeExplanation:[`${r} Esse item pertence ao bloco de ${b2(e.pdCode)} do Programa Detalhado CPA 1.2.`,e.pdCode.startsWith("1.1")?"Separe função normativa, função supervisora e atividade operacional. Observe competência, público e mercado atendido.":e.pdCode.startsWith("1.2")?"Juros, inflação, câmbio, crédito, atividade e expectativas interagem; avalie direção, canal e defasagem.":e.pdCode.startsWith("1.3")?"Taxa e prazo precisam estar na mesma periodicidade e os fluxos no tempo correto; interpretação vem antes da fórmula.":"Infraestruturas e regras reduzem assimetria e riscos; compare papéis para não atribuir a uma entidade a função de outra.",`Conecte ${s} à decisão de um cliente, instituição ou regulador; isso vale mais do que decorar uma definição solta.`],essentialConcepts:c,examFocus:n,practicalExample:P2(e.pdCode,s),comparisons:x2[e.pdCode]??j2(e.pdCode),formulas:g2[e.pdCode]??[],traps:d,reviewSummary:[`${e.pdCode} · ${s}.`,r,e.pdCode.startsWith("1.1")?"Pergunte: quem normatiza, quem supervisiona e quem opera?":e.pdCode.startsWith("1.2")?"Pergunte: qual variável muda, por qual canal e com qual efeito provável?":e.pdCode.startsWith("1.3")?"Pergunte: taxa, prazo e fluxo estão na mesma base?":"Pergunte: qual função, qual risco e qual entidade são descritos?"],flashcards:[{front:`O que é ${s}?`,back:r},{front:`Qual ideia central memorizar no PD ${e.pdCode}?`,back:c[1]},{front:`Como ${s} pode aparecer na prova?`,back:n[0]},{front:`Qual pegadinha evitar em ${e.pdCode}?`,back:d[0]}],miniQuiz:N2(e.pdCode,s,r,n,d),officialSources:C2(e.pdCode).map(m=>yd[m]),searchTerms:Array.from(new Set(([e.title,r,...c,...n,...d].join(" ").match(/[A-Za-zÀ-ÿ0-9.-]{2,}/g)??[]).map(m=>m.toLowerCase()))),lastVerified:v2}});if(Di.length!==105)throw new Error(`Macrotema 1 deveria possuir 105 aulas; foram geradas ${Di.length}.`);new Map(Di.map(e=>[e.pdCode,e]));const k2={"2.1.1.1.1.1":"A NTN-B paga IPCA mais uma taxa real e, na versão com juros semestrais, distribui cupons ao longo do caminho; a NTN-B Principal acumula a remuneração e concentra o pagamento no vencimento.","2.1.1.1.1.2":"A LFT é o título público pós-fixado ligado à Selic, por isso seu valor tende a oscilar menos com mudanças de juros do que títulos prefixados ou indexados longos, embora venda antecipada continue sujeita a preço de mercado.","2.1.1.1.1.3":"A LTN é o título público prefixado sem cupons: o investidor compra por preço inferior ao valor de resgate e conhece a taxa contratada se carregar o papel até o vencimento.","2.1.1.1.1.4":"O Tesouro Direto é a plataforma oficial de negociação de títulos públicos federais para pessoas físicas, com preços e taxas atualizados e possibilidade de compra e resgate conforme suas regras operacionais.","2.1.1.1.2":"Tesouro Prefixado, Selic, IPCA+, Educa+ e RendA+ são formas comerciais de títulos públicos com indexadores, fluxos e objetivos diferentes; a escolha depende de prazo, objetivo, tolerância à oscilação e necessidade de liquidez.","2.1.1.1.3.1":"O CDB é um depósito a prazo emitido por banco para captar recursos, com remuneração prefixada, pós-fixada ou híbrida e cobertura do FGC quando elegível e dentro dos limites vigentes.","2.1.1.1.3.2":"RDB e RDC são depósitos a prazo usados por instituições autorizadas e cooperativas para captação; diferem do CDB principalmente em regras de emissão e negociação, embora compartilhem lógica de crédito do emissor.","2.1.1.1.3.3":"A LCI é um título bancário lastreado em créditos imobiliários; para pessoa física, seus rendimentos são tratados como isentos de IR nas regras atualmente aplicáveis e o produto pode ter cobertura do FGC quando elegível.","2.1.1.1.3.4":"A LCA é um título bancário ligado ao financiamento do agronegócio; para pessoa física, seus rendimentos são tratados como isentos de IR nas regras atualmente aplicáveis e o produto pode ter cobertura do FGC quando elegível.","2.1.1.1.3.5":"A LCD é uma letra de crédito voltada ao financiamento do desenvolvimento, incluída entre os produtos cobertos pelo FGC quando atendidos os critérios do fundo e sujeita às regras próprias de emissão e tributação.","2.1.1.1.4.1":"Debênture de infraestrutura é título de dívida corporativa destinado ao financiamento de projetos enquadrados em infraestrutura, com benefícios tributários previstos em lei para determinadas emissões e investidores.","2.1.1.1.4.2":"Debênture conversível pode ser convertida em ações conforme as condições da emissão; debênture permutável permite trocar o título por ações ou outros ativos previstos, transferindo parte do potencial de valorização ao investidor.","2.1.1.1.5":"CRI é valor mobiliário de securitização lastreado em recebíveis imobiliários; o risco principal depende da estrutura e dos créditos que sustentam a emissão, e não há garantia ordinária do FGC.","2.1.1.1.6":"CRA é valor mobiliário de securitização lastreado em recebíveis do agronegócio; seu risco vem da estrutura, dos devedores e das garantias da emissão, sem cobertura ordinária do FGC.","2.1.1.1.7":"Rating é uma opinião de agência classificadora sobre risco de crédito relativo de emissor ou emissão; ele ajuda na comparação, mas não elimina risco nem garante pagamento.","2.1.1.1.8.1":"A poupança direciona parcela relevante de seus recursos ao financiamento habitacional e integra o Sistema Financeiro da Habitação; depósitos elegíveis contam com proteção do FGC dentro das regras vigentes.","2.1.1.1.8.2":"A poupança não cobra taxa de administração e, para pessoa física, tem rendimento isento de IR; custos indiretos aparecem principalmente como custo de oportunidade frente a alternativas.","2.1.1.1.8.3":"A rentabilidade da poupança segue regra legal ligada à Selic e à TR, enquanto seus principais riscos práticos são crédito da instituição acima da cobertura, inflação e perda de oportunidade.","2.1.1.1.8.4":"A data de aniversário da poupança é a data mensal em que o depósito completa novo período de remuneração; sacar antes dela pode fazer o valor retirado perder a remuneração daquele ciclo.","2.1.1.1.9":"A TR é uma taxa de referência calculada segundo metodologia oficial e usada em contratos e aplicações específicas, como a poupança; ela não deve ser confundida com Selic ou CDI.","2.1.1.1.10":"A TLP é a Taxa de Longo Prazo usada como referência em financiamentos de longo prazo, especialmente em operações do BNDES, combinando componente real e atualização conforme sua metodologia.","2.1.1.1.11":"Aplicações de renda fixa tributáveis de pessoa física seguem, em geral, tabela regressiva de IR que reduz a alíquota conforme aumenta o prazo, enquanto alguns títulos possuem isenção específica prevista em lei.","2.1.1.1.12":"O IOF sobre aplicações financeiras funciona de forma regressiva nos resgates de curtíssimo prazo e chega a zero após o período previsto na tabela vigente; ele é distinto do Imposto de Renda.","2.1.1.2.1":"Renda variável reúne ativos cujo retorno futuro não é conhecido de forma contratualmente predeterminada, pois depende de preços, resultados, eventos corporativos e condições de mercado.","2.1.1.2.2.1.1":"Sociedade limitada divide seu capital em quotas e segue regime societário próprio; sociedade anônima divide o capital em ações e possui estrutura de governança e regras específicas para companhias abertas ou fechadas.","2.1.1.2.2.1.2":"Companhia aberta possui valores mobiliários admitidos ao mercado e se submete à regulação da CVM; companhia fechada não acessa o mercado público de valores mobiliários da mesma forma.","2.1.1.2.2.1.3":"Empresa listada possui valores mobiliários negociados em ambiente organizado de mercado conforme requisitos aplicáveis; empresa não listada não tem seus valores mobiliários negociados dessa forma.","2.1.1.2.2.1.4":"Ações ordinárias e preferenciais representam direitos societários diferentes; units agrupam valores mobiliários, BDRs representam valores mobiliários emitidos no exterior e bônus de subscrição conferem direito de subscrever ações nas condições estabelecidas.","2.1.1.2.2.1.5":"Capital próprio vem dos sócios e acionistas e participa do risco residual do negócio; capital de terceiros vem de credores e gera obrigação contratual de pagamento.","2.1.1.2.2.1.6":"IPO é a oferta pública inicial que leva uma companhia ao mercado de capitais; OPA é oferta pública para aquisição de ações, usada em situações como aquisição relevante ou fechamento de capital conforme a regulação.","2.1.1.2.2.1.7":"Follow-on é uma oferta pública posterior ao IPO para distribuir novas ações ou ações já existentes, podendo captar recursos para a companhia quando a oferta é primária.","2.1.1.2.2.1.8":"No mercado primário, recursos da emissão chegam ao emissor quando há emissão nova; no secundário, investidores negociam entre si ativos já emitidos.","2.1.1.2.2.2.1":"A AGE delibera matérias extraordinárias previstas em lei ou estatuto, como mudanças relevantes de capital, estatuto ou reorganizações, fora do conjunto típico da assembleia anual.","2.1.1.2.2.2.2":"A AGO ocorre nos prazos legais para matérias recorrentes como contas da administração, demonstrações financeiras, destinação do resultado e eleição de administradores quando aplicável.","2.1.1.2.2.2.3":"Dividendos são parcela do lucro ou de reservas distribuída aos acionistas conforme legislação, estatuto e deliberações societárias; não constituem retorno garantido.","2.1.1.2.2.2.4":"Juros sobre Capital Próprio são forma de remuneração aos acionistas sujeita ao tratamento societário e tributário vigente; para o investidor, deve-se observar o valor líquido após tributação aplicável.","2.1.1.2.2.2.5":"Restituição de capital devolve aos acionistas parte do capital social nas hipóteses societárias permitidas e não deve ser confundida com distribuição ordinária de lucro.","2.1.1.2.2.2.6":"Grupamento reduz a quantidade de ações e eleva proporcionalmente o valor unitário teórico; desdobramento aumenta a quantidade e reduz proporcionalmente o valor unitário, sem criar riqueza por si só.","2.1.1.2.2.2.7":"Bonificação entrega novas ações ou direitos ao acionista em decorrência de capitalização de reservas ou lucros, alterando quantidade de ativos sem representar ganho econômico automático.","2.1.1.2.2.2.8":"Subscrição dá ao acionista direito de participar de uma nova emissão, normalmente preservando proporcionalmente sua participação se exercer o direito nas condições e prazos definidos.","2.1.1.2.2.3":"Ibovespa, IBrX 100 e IBrX 50 são índices de mercado com metodologias e universos diferentes usados para representar carteiras teóricas e acompanhar segmentos amplos do mercado acionário brasileiro.","2.1.1.2.3.1.1":"Segmentos de listagem da B3 estabelecem conjuntos adicionais de práticas de governança e requisitos de negociação; não são a mesma coisa que classe de ação.","2.1.1.2.3.1.2":"O conselho de administração orienta a estratégia e supervisiona a gestão da companhia nos limites legais e estatutários, representando papel distinto da diretoria executiva.","2.1.1.2.3.1.3":"Tag along protege acionistas em determinadas mudanças de controle, drag along pode obrigar minoritários a vender junto com o controlador quando previsto, e free float é a parcela de ações efetivamente disponível para negociação.","2.1.1.3.1":"Ganhos líquidos em renda variável seguem alíquotas específicas conforme o tipo de operação; operações comuns e day trade possuem tratamentos distintos, e o IRRF pode funcionar como antecipação.","2.1.1.3.2":"A legislação prevê hipóteses de isenção em renda variável, como o limite mensal de vendas de ações no mercado à vista para pessoa física, mas a isenção não vale para todas as operações ou produtos.","2.1.1.3.3":"Prejuízos em operações de renda variável podem ser compensados com ganhos futuros dentro das regras e categorias permitidas, exigindo controle separado quando a legislação diferencia modalidades como day trade.","2.1.1.3.4":"O IOF não é o tributo típico sobre ganho em operações comuns de ações em bolsa; quando a questão tratar tributação de renda variável, é essencial separar IR sobre ganhos, IRRF e hipóteses específicas de IOF.","2.1.1.4.1":"O COE combina componentes financeiros e derivativos para produzir um payoff ligado a cenários de mercado; entender o ativo de referência, barreiras e fórmula de remuneração é mais importante do que decorar um nome comercial.","2.1.1.4.2":"COEs podem ser emitidos com valor nominal protegido ou valor nominal em risco; proteção nominal reduz a perda do principal conforme as condições do certificado, mas não elimina risco de crédito do emissor.","2.1.1.4.3":"A tributação do COE segue o tratamento vigente aplicável aos seus rendimentos, devendo o investidor comparar retorno líquido, prazo e risco de crédito, e não apenas o payoff bruto.","2.1.2.1":"Fundos reúnem recursos de vários investidores em uma estrutura coletiva com política de investimento, prestadores de serviço, riscos, taxas e público-alvo definidos em documentos oficiais.","2.1.2.2.1":"A Resolução CVM 175 organiza constituição, funcionamento e comunicação dos fundos; regulamento e anexos da classe devem deixar claras regras, riscos, serviços e informações relevantes.","2.1.2.2.2":"Fundo de investimento é uma comunhão de recursos organizada sob forma condominial para aplicação coletiva em ativos, com direitos e obrigações definidos pela regulamentação e pelos documentos da estrutura.","2.1.2.2.3":"O fundo é constituído sob forma de condomínio e sua estrutura e classes seguem registro e supervisão da CVM conforme a Resolução 175 e anexos aplicáveis.","2.1.2.2.4":"A Resolução CVM 175 permite estruturar fundos em classes e subclasses, segregando direitos, obrigações, patrimônio e características de investidores dentro do mesmo fundo quando previsto.","2.1.2.2.5":"Segregação patrimonial significa que cada classe possui patrimônio separado das demais e dos prestadores de serviço, limitando a propagação de obrigações conforme o regime aplicável.","2.1.2.2.6":"Cota representa fração ideal do patrimônio da classe de fundo e seu valor varia conforme patrimônio líquido, quantidade de cotas e critérios de cálculo previstos.","2.1.2.2.7":"Classe aberta admite resgate de cotas conforme regras do regulamento; classe fechada normalmente não permite resgate antes do término, embora as cotas possam ser negociadas quando admitidas a mercado.","2.1.2.2.8":"Emissão é o processo de criação de novas cotas da classe, observando regras do regulamento, oferta e limites aplicáveis.","2.1.2.2.9":"Subscrição é o compromisso de adquirir cotas; integralização é a efetiva entrega de recursos ou ativos admitidos para formar o patrimônio da classe.","2.1.2.2.10":"Resgate é a saída do cotista mediante conversão e pagamento das cotas em classe aberta; amortização devolve parcela do valor da cota sem necessariamente extinguir a posição.","2.1.2.2.11":"Distribuição é a atividade de oferta e colocação de cotas junto a investidores, sujeita às regras de oferta, suitability, transparência e remuneração aplicáveis.","2.1.2.2.12":"No investimento por conta e ordem, um distribuidor atua perante o fundo em nome próprio por conta de clientes, mantendo controles individualizados e responsabilidades de identificação e informação.","2.1.2.2.13":"A participação política do investidor por conta e ordem deve preservar seus direitos de manifestação e voto conforme as regras do fundo e os procedimentos do distribuidor.","2.1.2.2.14":"Fundos devem divulgar informações periódicas e eventuais que permitam ao cotista acompanhar patrimônio, riscos, política e eventos relevantes conforme a regulação.","2.1.2.2.15":"Comunicações aos cotistas devem observar canais, prazos e conteúdos previstos na regulamentação e nos documentos da classe, garantindo acesso tempestivo às informações relevantes.","2.1.2.2.16":"A divulgação de informações e resultados deve ser consistente, verificável e compatível com a política da classe, evitando criar percepção enganosa sobre desempenho futuro.","2.1.2.2.17":"Divulgação de cota e rentabilidade apresenta valor da participação e desempenho histórico; rentabilidade passada não representa garantia de resultado futuro.","2.1.2.2.18.1":"Assembleia geral de cotistas delibera matérias comuns ao fundo quando a regulamentação ou regulamento exigem decisão coletiva dos investidores.","2.1.2.2.18.2":"Assembleia especial de cotistas trata matérias específicas de determinada classe ou subclasse, respeitando a segregação e os direitos daquele grupo de investidores.","2.1.2.2.19.1":"Administração e gestão são serviços essenciais da estrutura do fundo segundo a Resolução CVM 175, com responsabilidades próprias e não intercambiáveis.","2.1.2.2.19.2":"A administração fiduciária cuida da estrutura, funcionamento, controles e obrigações do fundo e das classes dentro de suas competências regulatórias.","2.1.2.2.19.3":"A gestão decide a alocação e negociação dos ativos da carteira dentro da política de investimento e dos limites aplicáveis, assumindo responsabilidade pelas decisões de investimento.","2.1.2.2.19.4":"Negociação em mercados organizados deve respeitar regras de mercado, melhores práticas de execução, controles e limites da política de investimento da classe.","2.1.2.2.20.1":"Taxa de administração remunera serviços previstos na estrutura do fundo e deve ser divulgada conforme a regulamentação e documentos da classe.","2.1.2.2.20.2":"Taxa de ingresso é cobrada no momento da aplicação quando prevista; ela reduz o valor efetivamente convertido em investimento e deve estar claramente informada.","2.1.2.2.20.3":"Taxa de saída pode ser cobrada no resgate ou saída conforme regras da classe, afetando o valor líquido recebido pelo investidor.","2.1.2.2.20.4":"Taxa máxima de distribuição estabelece limite de remuneração vinculada à distribuição quando aplicável e deve ser apresentada com transparência nos documentos do fundo.","2.1.2.2.20.5":"Acordos de remuneração entre prestadores precisam observar transparência, conflitos de interesse e limites regulatórios para não distorcer a recomendação ao cliente.","2.1.2.2.21":"Vedações da Resolução CVM 175 limitam condutas e operações que poderiam criar conflitos, uso indevido de patrimônio ou descumprimento da política da classe.","2.1.2.2.22":"Obrigações dos prestadores incluem cumprir regulamentação, regulamento, controles, divulgação e deveres perante investidores dentro das respectivas competências.","2.1.2.2.23":"Normas de conduta exigem diligência, lealdade, tratamento adequado de conflitos e atuação no interesse da classe e dos cotistas dentro das responsabilidades de cada prestador.","2.1.2.2.24":"Encargos são despesas que podem ser debitadas diretamente do patrimônio da classe quando expressamente autorizadas pela regulamentação; demais despesas devem seguir o regime aplicável ao prestador responsável.","2.1.2.2.25.1":"Com responsabilidade limitada, o cotista responde pelas obrigações da classe até o limite do valor das cotas subscritas, conforme previsão e regras da estrutura.","2.1.2.2.25.2":"Com responsabilidade ilimitada, a estrutura admite responsabilidade do cotista além do valor das cotas nas hipóteses e condições definidas nos documentos e na regulamentação.","2.1.2.2.25.3":"Patrimônio líquido negativo ocorre quando as obrigações superam os ativos da classe e aciona procedimentos específicos de administração, comunicação e deliberação previstos na regulamentação.","2.1.2.2.25.4":"A insolvência da classe trata a incapacidade patrimonial de cumprir obrigações segundo o regime jurídico próprio introduzido para classes de fundos, sem confundir a classe com seus prestadores.","2.1.2.3.1":"No FIF, a prestação de serviços segue a Resolução CVM 175 e o Anexo Normativo I, distribuindo responsabilidades entre administrador, gestor e demais prestadores contratados.","2.1.2.3.2":"Administrador, gestor e custodiante exercem funções distintas no FIF: estrutura e controles, decisões de investimento e guarda/controle de ativos, respectivamente, conforme seus contratos e deveres regulatórios.","2.1.2.3.3.1":"As vedações do FIF limitam operações ou condutas incompatíveis com o regime da classe, sua política de investimento e os deveres dos prestadores.","2.1.2.3.4":"Distribuição e subscrição de cotas de FIF devem respeitar público-alvo, documentos, suitability, regras de oferta e procedimentos de integralização.","2.1.2.3.5.1":"Ativos financeiros no Brasil elegíveis à carteira de FIF são definidos pela regulamentação e devem respeitar política, risco e limites da classe.","2.1.2.3.5.2":"Investimentos no exterior por FIF são permitidos dentro das condições, limites e controles da regulamentação e da política da classe.","2.1.2.3.5.3":"Limites por emissor controlam concentração de crédito e exposição a uma mesma contraparte ou grupo, reduzindo dependência excessiva de um único emissor.","2.1.2.3.5.4":"Limites por modalidade controlam quanto da carteira pode ser alocado em determinadas categorias de ativos, preservando o enquadramento e o perfil de risco da classe.","2.1.2.3.5.5":"Gestor e demais responsáveis devem monitorar limites de concentração e reenquadrar a carteira conforme regras e prazos quando houver desenquadramento.","2.1.2.3.6.1":"Fundo de renda fixa tem como principal fator de risco a variação de taxas de juros, índices de preços ou ambos, devendo respeitar os critérios de enquadramento da regulamentação.","2.1.2.3.6.2":"Fundo de ações mantém exposição predominante ao mercado acionário conforme os percentuais e ativos elegíveis definidos na regulamentação.","2.1.2.3.6.3":"Fundo cambial mantém exposição predominante ao fator de risco de moeda estrangeira ou variação cambial segundo o enquadramento regulatório.","2.1.2.3.6.4":"Fundo multimercado combina diferentes fatores de risco e estratégias sem ficar restrito a um único enquadramento de renda fixa, ações ou câmbio.","2.1.2.3.6.5":"FI-Infra direciona sua política a ativos ligados a projetos de infraestrutura e segue requisitos específicos de carteira e tributação previstos em lei e regulamentação.","2.1.2.3.6.6":"Fundos destinados à garantia de locação imobiliária seguem finalidade específica de garantir obrigações de contratos de locação, com política e ativos compatíveis com esse objetivo.","2.1.2.3.6.7":"Concentração em crédito privado indica exposição relevante a títulos emitidos por agentes privados e exige atenção reforçada a risco de crédito, liquidez e divulgação.","2.1.2.3.7":"Um FIF pode investir em cotas de outros fundos dentro de limites e regras de enquadramento, transferindo parte da exposição econômica para as carteiras dos fundos investidos.","2.1.2.3.8":"Exposição ao risco de capital mede a possibilidade de perdas decorrentes de posições que podem produzir perda superior ao patrimônio disponível, exigindo controles e limites regulatórios.","2.1.2.3.9":"Classes restritas são destinadas a públicos específicos e podem ter flexibilizações ou regras próprias compatíveis com o nível de sofisticação e enquadramento dos investidores.","2.1.2.3.10":"Encargos de FIF são despesas debitáveis da classe quando autorizadas pela Resolução CVM 175 e seu Anexo I; despesas fora desse rol seguem responsabilidade definida pela norma.","2.1.3.1":"A tributação de fundos depende da classificação tributária, carteira, prazo e eventos como resgate, amortização ou tributação periódica, devendo ser lida separadamente da classificação regulatória do fundo.","2.1.3.2.1":"IOF em fundos e aplicações de renda fixa pode incidir em resgates de curtíssimo prazo conforme tabela regressiva, chegando a zero depois do prazo definido na legislação.","2.1.3.2.2":"O IR sobre fundos varia por categoria e prazo; fundos de longo prazo usam tabela regressiva, fundos de curto prazo têm tabela própria e fundos de ações possuem tratamento específico.","2.1.4.1":"FII é condomínio de investimento imobiliário cujas cotas, quando negociadas em mercado organizado, permitem exposição a ativos imobiliários sem compra direta do imóvel e seguem regime próprio de classe fechada.","2.1.4.2":"FIIs podem carregar risco de liquidez das cotas, crédito dos devedores, vacância dos imóveis, concentração e oscilação de valor dos ativos; a combinação depende da carteira concreta.","2.1.4.3":"Distribuições de FIIs decorrem dos resultados e regras legais do fundo, não são dividendos garantidos e podem variar com aluguéis, juros, inadimplência, vacância e eventos da carteira.","2.1.4.4":"FIIs podem cobrar taxas previstas em seus documentos e realizar novas emissões por subscrição; o investidor deve avaliar diluição, preço de emissão, custos e uso dos recursos.","2.1.4.5":"FII de tijolo concentra imóveis físicos e renda imobiliária, fundo de papel concentra títulos e recebíveis imobiliários, e fundo híbrido combina essas exposições.","2.1.4.6":"A tributação de FIIs diferencia rendimentos distribuídos e ganho na negociação ou resgate de cotas, com condições específicas para benefícios fiscais e regras sujeitas à legislação vigente."},E2="2026-09-20",q2={"2.1.1.1.11":[{name:"IR sobre o rendimento tributável",expression:"IR = rendimento tributável × alíquota aplicável",explanation:"Para pessoa física, a alíquota normalmente depende do prazo na tabela regressiva vigente. A base é o rendimento, não o principal investido."}],"2.1.1.3.1":[{name:"Imposto sobre ganho líquido",expression:"IR = ganho líquido tributável × alíquota da modalidade",explanation:"A modalidade da operação importa: operação comum e day trade seguem tratamentos diferentes."}],"2.1.1.3.3":[{name:"Ganho líquido após compensação",expression:"Base tributável = ganhos tributáveis − perdas compensáveis",explanation:"A compensação depende das regras da modalidade; perdas de categorias distintas não devem ser misturadas automaticamente."}],"2.1.2.2.6":[{name:"Valor econômico simplificado da cota",expression:"Valor da cota = patrimônio líquido da classe / número de cotas",explanation:"Na prática, o regulamento e a metodologia da classe determinam horários, critérios e eventos de conversão."}],"2.1.4.3":[{name:"Dividend yield simplificado",expression:"Yield no período = distribuição por cota / preço da cota",explanation:"É uma relação histórica do período, não uma promessa de distribuição futura."}],"2.1.4.6":[{name:"Ganho na alienação de cotas",expression:"Ganho líquido = valor de venda − custo de aquisição ajustado",explanation:"A tributação efetiva depende das regras vigentes, despesas admitidas e forma de negociação."}]},M2={"2.1.1.1.1.1":[{left:"NTN-B com juros semestrais",right:"NTN-B Principal",explanation:"As duas combinam IPCA e taxa real; a primeira distribui cupons e a Principal concentra os fluxos no vencimento."}],"2.1.1.1.1.2":[{left:"LFT / Tesouro Selic",right:"LTN / Tesouro Prefixado",explanation:"A LFT acompanha uma taxa pós-fixada e tende a oscilar menos; a LTN trava taxa no momento da compra, mas seu preço é mais sensível às mudanças de juros."}],"2.1.1.1.3.1":[{left:"CDB",right:"Debênture",explanation:"CDB é dívida bancária e pode ter FGC quando elegível; debênture é dívida corporativa e não possui garantia ordinária do FGC."}],"2.1.1.1.3.3":[{left:"LCI/LCA",right:"CDB",explanation:"Todos podem ser emitidos por instituições financeiras, mas LCI/LCA têm destinação específica e tratamento tributário próprio; CDB é captação bancária geral."}],"2.1.1.1.5":[{left:"CRI/CRA",right:"LCI/LCA",explanation:"CRI/CRA são valores mobiliários de securitização sem FGC; LCI/LCA são letras emitidas por instituições financeiras e podem ter FGC quando elegíveis."}],"2.1.1.2.2.1.6":[{left:"IPO",right:"OPA",explanation:"IPO é oferta inicial de valores mobiliários ao mercado; OPA é oferta para aquisição de ações em situações previstas pela regulação."}],"2.1.1.2.2.1.8":[{left:"Mercado primário",right:"Mercado secundário",explanation:"No primário ocorre a colocação de emissão; no secundário, investidores negociam ativos que já foram emitidos."}],"2.1.1.2.2.2.6":[{left:"Grupamento",right:"Desdobramento",explanation:"Grupamento reduz quantidade e aumenta preço unitário teórico; desdobramento aumenta quantidade e reduz preço unitário teórico, sem criar valor por si só."}],"2.1.1.4.2":[{left:"Valor nominal protegido",right:"Valor nominal em risco",explanation:"No protegido, o desenho preserva o nominal nas condições do certificado; no nominal em risco, o investidor pode perder parte ou todo o valor aplicado. Em ambos existe risco de crédito do emissor."}],"2.1.2.2.7":[{left:"Classe aberta",right:"Classe fechada",explanation:"Classe aberta admite resgates segundo o regulamento; classe fechada normalmente não permite resgate antes do prazo, podendo ter negociação secundária."}],"2.1.2.2.9":[{left:"Subscrição",right:"Integralização",explanation:"Subscrição é o compromisso de adquirir cotas; integralização é a entrega efetiva dos recursos ou ativos aceitos."}],"2.1.2.2.10":[{left:"Resgate",right:"Amortização",explanation:"Resgate extingue cotas conforme as regras da classe; amortização devolve parte do valor sem necessariamente encerrar a posição."}],"2.1.2.2.19.2":[{left:"Administrador",right:"Gestor",explanation:"O administrador cuida da estrutura e obrigações fiduciárias; o gestor toma decisões de investimento dentro da política e dos limites."}],"2.1.2.3.6.1":[{left:"Renda fixa",right:"Multimercado",explanation:"Renda fixa concentra seu principal fator de risco em juros/índices; multimercado pode combinar vários fatores e estratégias."}],"2.1.2.3.6.2":[{left:"Fundo de ações",right:"Fundo de renda fixa",explanation:"O primeiro mantém exposição predominante ao mercado acionário; o segundo tem como fator principal juros e índices de preços conforme o enquadramento."}],"2.1.4.5":[{left:"FII de tijolo",right:"FII de papel",explanation:"Tijolo concentra exposição a imóveis físicos e renda imobiliária; papel concentra títulos e recebíveis ligados ao setor imobi
