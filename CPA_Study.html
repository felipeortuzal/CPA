ção conforme as regras aplicáveis."],sourceIds:["ANBIMA_PD","SUSEP_PREVIDENCIA"]}),oe({id:"CPA-Q046",pdCode:"2.2.1.1",macroTopic:ya,topic:"PGBL",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Um cliente faz declaração completa de Imposto de Renda, possui renda tributável e contribui para a previdência oficial. Busca usar previdência também no planejamento tributário, dentro dos limites legais.",prompt:"Qual produto tende a ser analisado primeiro para a possibilidade de dedução das contribuições?",options:["PGBL, respeitadas as condições e o limite legal aplicável.","VGBL, porque suas contribuições são sempre dedutíveis sem limite.","Conta corrente, porque depósitos reduzem a renda tributável.","Seguro residencial, porque prêmio é dedutível como previdência."],correctAnswer:0,explanation:"O PGBL pode permitir dedução das contribuições na base do IR até o limite legal para quem atende às condições, incluindo uso do modelo completo. A adequação depende da situação do cliente.",whyOthersAreWrong:["","Contribuições ao VGBL não seguem a mesma dedutibilidade do PGBL.","Depósitos em conta não são contribuição previdenciária dedutível.","Seguro residencial não substitui plano de previdência para essa finalidade."],sourceIds:["ANBIMA_PD","SUSEP_PREVIDENCIA"]}),oe({id:"CPA-Q047",pdCode:"2.2.2",macroTopic:ya,topic:"Regimes de tributação da previdência",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Dois participantes de previdência têm horizontes e situações fiscais diferentes. Um pretende comparar o regime progressivo com o regressivo antes de escolher.",prompt:"Qual orientação é mais adequada?",options:["A escolha deve considerar horizonte, forma de recebimento e situação tributária; os regimes têm lógicas de alíquotas e ajuste diferentes.","O regressivo é sempre melhor para qualquer pessoa e prazo.","O progressivo é sempre isento no resgate.","A escolha do regime não produz qualquer efeito tributário futuro."],correctAnswer:0,explanation:"Regimes progressivo e regressivo têm estruturas distintas. A decisão deve considerar prazo, renda, forma de benefício/resgate e contexto tributário, sem regra universal de melhor opção.",whyOthersAreWrong:["","Não existe regime universalmente superior.","O progressivo não é sinônimo de isenção.","A escolha influencia a tributação futura."],sourceIds:["ANBIMA_PD","SUSEP_PREVIDENCIA"]}),oe({id:"CPA-Q048",pdCode:"2.2.3.3",macroTopic:ya,topic:"Portabilidade em previdência",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Uma cliente está insatisfeita com o plano atual e deseja transferir a reserva para outro plano compatível sem receber o dinheiro em sua conta para consumo.",prompt:"Qual mecanismo deve ser avaliado?",options:["Portabilidade, observadas as regras e carências aplicáveis.","Resgate seguido de gasto imediato, que é equivalente à portabilidade em qualquer aspecto.","Follow-on de ações.","Desdobramento de cotas."],correctAnswer:0,explanation:"Portabilidade permite transferir recursos entre planos compatíveis conforme regras aplicáveis, sem caracterizar simplesmente um resgate para disponibilidade ao participante.",whyOthersAreWrong:["","Resgate e portabilidade têm naturezas e efeitos distintos.","Follow-on é oferta subsequente de ações.","Desdobramento não é mecanismo de previdência."],sourceIds:["ANBIMA_PD","SUSEP_PREVIDENCIA"]}),oe({id:"CPA-Q049",pdCode:"2.2.3.4",macroTopic:ya,topic:"Transformação da reserva em renda",difficulty:"medium",cognitiveLevel:"application",questionType:"case",context:"Ao se aposentar, uma participante deseja converter sua reserva em pagamentos periódicos. Ela quer comparar renda vitalícia, renda por prazo certo e pagamento único, avaliando longevidade e necessidade de previsibilidade.",prompt:"Qual abordagem do profissional é adequada?",options:["Explicar as modalidades, seus eventos de término/reversão e como cada uma atende de forma diferente o risco de longevidade e a necessidade de fluxo.","Escolher automaticamente pagamento único para todos os clientes.","Afirmar que todas as modalidades geram exatamente o mesmo fluxo e risco.","Recomendar renda vitalícia sem verificar regras do plano ou objetivos da participante."],correctAnswer:0,explanation:"A transformação da reserva envolve modalidades com características diferentes. A recomendação deve conectar regras do plano, necessidade de renda, proteção de beneficiários e risco de longevidade.",whyOthersAreWrong:["","Não existe modalidade universalmente adequada.","Fluxos e condições de continuidade são diferentes.","Objetivos e condições contratuais precisam ser considerados."],sourceIds:["ANBIMA_PD","SUSEP_PREVIDENCIA"]}),oe({id:"CPA-Q050",pdCode:"2.3.1.3",macroTopic:ya,topic:"SCR",difficulty:"medium",cognitiveLevel:"application",questionType:"case",context:"Antes de conceder novo crédito, uma instituição consulta informações consolidadas sobre operações de crédito do cliente, dentro das regras do sistema administrado pelo Banco Central.",prompt:"Qual sistema é relevante para essa análise?",options:["Sistema de Informações de Créditos (SCR).","Sistema Especial de Liquidação e Custódia (Selic).","Sistema de Pagamentos Instantâneos (SPI).","Cadastro da CVM de companhias abertas."],correctAnswer:0,explanation:"O SCR reúne informações sobre operações de crédito reportadas ao Banco Central e apoia análise e supervisão do sistema de crédito, observadas as regras de acesso.",whyOthersAreWrong:["","Selic é infraestrutura de títulos públicos.","SPI liquida transações Pix.","Cadastro de companhias abertas não é base de operações de crédito do cliente."],sourceIds:["ANBIMA_PD","BCB_SCR"]}),oe({id:"CPA-Q051",pdCode:"2.3.1.2",macroTopic:ya,topic:"Empréstimo, financiamento e leasing",difficulty:"hard",cognitiveLevel:"analysis",questionType:"case",context:"Um cliente precisa adquirir um veículo específico e compara uma linha com destinação vinculada ao bem com outra em que receberia recursos de uso livre. Ele pergunta se as duas operações são economicamente idênticas.",prompt:"Qual análise é correta?",options:["Financiamento costuma ter destinação vinculada ao bem/serviço, enquanto empréstimo pode ter uso mais livre; condições e garantias devem ser comparadas.","Empréstimo e financiamento são sempre juridicamente e economicamente idênticos.","Financiamento não pode ter garantia associada ao bem.","Empréstimo só existe para empresas e financiamento apenas para pessoas físicas."],correctAnswer:0,explanation:"A destinação dos recursos é uma diferença típica: financiamento costuma estar ligado à aquisição específica, enquanto empréstimo tende a ter uso livre. Custos, garantias e prazo também importam.",whyOthersAreWrong:["","As modalidades têm características distintas.","O bem financiado pode ser usado como garantia, conforme a operação.","Ambas podem atender pessoas e empresas conforme produtos e regras."],sourceIds:["ANBIMA_PD","BCB_SCR"]}),oe({id:"CPA-Q052",pdCode:"2.3.2.1",macroTopic:ya,topic:"Cartão de crédito",difficulty:"hard",cognitiveLevel:"analysis",questionType:"case",context:"Uma cliente não consegue pagar integralmente a fatura do cartão. Ela considera pagar apenas parte e acredita que o saldo restante ficará sem encargos até o mês seguinte.",prompt:"Qual orientação é adequada?",options:["O saldo não pago pode gerar financiamento com encargos; ela deve comparar custo total, condições de pagamento e alternativas de crédito.","Pagar parcialmente extingue automaticamente o saldo remanescente.","O saldo restante vira investimento remunerado a favor da cliente.","Qualquer refinanciamento de cartão é sempre mais barato que crédito consignado."],correctAnswer:0,explanation:"Pagamento parcial pode levar ao financiamento do saldo conforme regras do cartão, com juros e demais encargos. O cliente deve compreender o custo e avaliar alternativas.",whyOthersAreWrong:["","O saldo permanece devido.","O saldo não pago é obrigação, não investimento.","Custos variam; não há superioridade universal do cartão."],sourceIds:["ANBIMA_PD"]}),oe({id:"CPA-Q053",pdCode:"2.3.4",macroTopic:ya,topic:"Crédito consignado",difficulty:"hard",cognitiveLevel:"analysis",questionType:"case",context:"Um aposentado compara crédito consignado com crédito pessoal sem garantia. A parcela do consignado será descontada diretamente do benefício e respeitará a margem permitida.",prompt:"Por que o consignado pode apresentar taxa menor em muitos casos?",options:["O mecanismo de desconto reduz parte do risco de inadimplência para o credor, embora a operação continue exigindo análise e respeito à margem.","Porque o governo garante integralmente qualquer dívida consignada.","Porque consignado não possui juros.","Porque a margem consignável permite comprometer toda a renda do cliente."],correctAnswer:0,explanation:"O desconto direto e a previsibilidade de recebimento podem reduzir risco de crédito e contribuir para taxas menores, mas não eliminam juros, análise nem limites de comprometimento.",whyOthersAreWrong:["","Não há garantia estatal integral da dívida.","Consignado possui juros e custos.","Existem limites de margem; não se pode comprometer toda a renda por definição."],sourceIds:["ANBIMA_PD"]}),oe({id:"CPA-Q054",pdCode:"2.3.5.1",macroTopic:ya,topic:"CDC",difficulty:"hard",cognitiveLevel:"analysis",questionType:"case",context:"Uma consumidora financia um bem por Crédito Direto ao Consumidor (CDC), e o contrato prevê o próprio bem como garantia da operação.",prompt:"Qual efeito econômico dessa garantia deve ser considerado?",options:["Ela pode reduzir a perda esperada do credor em caso de inadimplência e influenciar condições do crédito, sem eliminar o risco.","Ela torna a operação gratuita e sem juros.","Ela transfere automaticamente a propriedade definitiva do bem ao credor desde o primeiro dia, em qualquer contrato.","Ela elimina a necessidade de avaliar capacidade de pagamento."],correctAnswer:0,explanation:"Garantias podem reduzir a severidade de perda e afetar preço/condições do crédito, mas não eliminam risco nem substituem análise de capacidade de pagamento.",whyOthersAreWrong:["","Garantia não elimina custo financeiro.","A consequência jurídica depende da estrutura contratual e não é a generalização apresentada.","Concessão responsável ainda exige avaliação do cliente."],sourceIds:["ANBIMA_PD","BCB_SCR"]}),oe({id:"CPA-Q055",pdCode:"2.4.1.5.2",macroTopic:ya,topic:"Pix",difficulty:"hard",cognitiveLevel:"analysis",questionType:"case",context:"Um pequeno comércio quer receber pagamentos de clientes em poucos segundos, inclusive fora do horário bancário tradicional. O dono pergunta se o Pix depende de compensação somente no dia útil seguinte.",prompt:"Qual explicação é correta?",options:["O Pix foi desenhado para pagamentos e transferências instantâneas, com disponibilidade ampla e liquidação em infraestrutura própria do sistema.","O Pix só funciona em horário de pregão da bolsa.","Toda transação Pix precisa aguardar compensação de cheque.","Pix é uma modalidade de cartão de crédito e sempre envolve financiamento do pagador."],correctAnswer:0,explanation:"O Pix permite transferências e pagamentos em poucos segundos, com funcionamento contínuo, apoiado por infraestrutura específica do Banco Central.",whyOthersAreWrong:["","Não depende do pregão da bolsa.","Não utiliza compensação de cheque como regra.","Pix é meio de pagamento/transferência, não crédito por definição."],sourceIds:["ANBIMA_PD","BCB_PIX"]}),oe({id:"CPA-Q056",pdCode:"2.5.2.3",macroTopic:ya,topic:"Seguro prestamista",difficulty:"hard",cognitiveLevel:"analysis",questionType:"case",context:"Ao contratar um financiamento, um cliente recebe oferta de seguro destinado a ajudar na quitação ou amortização da dívida em eventos cobertos previstos na apólice.",prompt:"Qual produto está sendo descrito?",options:["Seguro prestamista.","Fundo imobiliário.","Título de capitalização necessariamente vinculado ao financiamento.","Tesouro Selic."],correctAnswer:0,explanation:"Seguro prestamista é ligado a obrigações financeiras e pode cobrir saldo devedor ou parcelas em eventos previstos, conforme condições contratuais.",whyOthersAreWrong:["","FII é investimento coletivo imobiliário.","Título de capitalização tem natureza diferente e não é o seguro descrito.","Tesouro Selic é título público."],sourceIds:["ANBIMA_PD","SUSEP"]}),oe({id:"CPA-Q057",pdCode:"2.2.1.2",macroTopic:ya,topic:"Escolha entre PGBL e VGBL",difficulty:"hard",cognitiveLevel:"analysis",questionType:"dialog_tree",context:"Chat. Cliente: “Uso o desconto simplificado na declaração e já contribuo bastante para outros objetivos. Quero previdência de longo prazo, mas ouvi que PGBL sempre reduz meu imposto hoje.”",prompt:"Qual resposta do profissional é mais adequada?",options:["“A vantagem de dedução do PGBL depende das condições tributárias e do modelo de declaração; precisamos comparar isso com o VGBL e sua base de tributação no resgate.”","“PGBL sempre reduz imposto para qualquer pessoa, independentemente da declaração.”","“VGBL e PGBL têm a mesma base tributável e a escolha não importa.”","“Previdência não deve considerar horizonte nem situação fiscal.”"],correctAnswer:0,explanation:"A recomendação entre PGBL e VGBL exige analisar modelo de declaração, renda tributável, contribuições, horizonte e forma de tributação futura.",whyOthersAreWrong:["","A dedução não é universal e depende das condições legais.","As bases de tributação no resgate são distintas.","Horizonte e situação fiscal são elementos centrais da análise."],sourceIds:["ANBIMA_PD","SUSEP_PREVIDENCIA"]}),oe({id:"CPA-Q058",pdCode:"2.1.4.2",macroTopic:ya,topic:"Adequação de FII",difficulty:"hard",cognitiveLevel:"analysis",questionType:"dialog_tree",context:"Chat. Cliente: “Preciso usar todo esse dinheiro em três meses, mas quero comprar um FII pouco negociado porque paga rendimentos mensais.”",prompt:"Qual resposta melhor equilibra produto e necessidade do cliente?",options:["“Antes de investir, precisamos considerar seu prazo de três meses e o risco de liquidez e preço das cotas; renda periódica não garante resgate sem perda.”","“Rendimento mensal elimina risco de liquidez.”","“Todo FII recompra cotas pelo valor investido quando o cliente quiser.”","“Como há imóveis na carteira, a cota não pode cair.”"],correctAnswer:0,explanation:"FIIs podem ter baixa liquidez e preço de mercado variável. Um objetivo muito curto e com necessidade certa de caixa exige atenção especial à compatibilidade do produto.",whyOthersAreWrong:["","Distribuição de rendimentos não garante liquidez.","FII fechado não funciona como resgate ordinário garantido.","Patrimônio imobiliário não impede queda de preço da cota."],sourceIds:["ANBIMA_PD","CVM"]}),oe({id:"CPA-Q059",pdCode:"2.3.1.1",macroTopic:ya,topic:"Concessão responsável de crédito",difficulty:"hard",cognitiveLevel:"analysis",questionType:"dialog_tree",context:"Chat. Cliente: “Minha renda caiu, mas quero o maior limite possível. Posso omitir algumas dívidas para aumentar a chance de aprovação?”",prompt:"Qual resposta do profissional é mais adequada?",options:["“Não. A análise deve usar informações verdadeiras e considerar renda, compromissos e capacidade de pagamento para evitar crédito incompatível.”","“Sim. O importante é maximizar o limite, mesmo com dados incompletos.”","“Dívidas existentes nunca influenciam análise de crédito.”","“Basta escolher a maior parcela possível; capacidade de pagamento é irrelevante.”"],correctAnswer:0,explanation:"Concessão de crédito deve considerar capacidade financeira e informações consistentes. Omissão de dívidas prejudica a análise e pode elevar risco de superendividamento.",whyOthersAreWrong:["","Dados falsos ou incompletos comprometem a decisão responsável.","Endividamento existente é relevante para capacidade de pagamento.","Parcela deve ser compatível com orçamento e demais obrigações."],sourceIds:["ANBIMA_PD","BCB_SCR"]}),oe({id:"CPA-Q060",pdCode:"2.5.2.3",macroTopic:ya,topic:"Seguro prestamista no atendimento",difficulty:"hard",cognitiveLevel:"analysis",questionType:"dialog_tree",context:"Chat. Cliente: “O banco incluiu um seguro prestamista na proposta de crédito. Isso significa que qualquer atraso meu será automaticamente pago pelo seguro?”",prompt:"Qual resposta profissional é correta?",options:["“Não. A cobertura depende dos eventos, riscos excluídos, limites e demais condições previstos na apólice; devemos ler essas condições antes de contratar.”","“Sim. Seguro prestamista cobre qualquer atraso, independentemente da causa.”","“Sim. Todo seguro prestamista garante o valor da dívida sem limite.”","“Seguro prestamista é apenas outro nome para FGC.”"],correctAnswer:0,explanation:"Seguro prestamista possui coberturas e condições contratuais específicas. Não deve ser apresentado como garantia irrestrita de qualquer atraso ou saldo devedor.",whyOthersAreWrong:["","Cobertura depende dos eventos contratados e exclusões.","Limites e condições podem existir.","FGC é mecanismo de garantia de determinados créditos, não seguro prestamista."],sourceIds:["ANBIMA_PD","SUSEP"]})],Xe="Relacionamento com o cliente",CC=[oe({id:"CPA-Q061",pdCode:"3.1.1",macroTopic:Xe,topic:"Idade, risco e produtos",difficulty:"easy",cognitiveLevel:"comprehension",questionType:"multiple_choice",context:"Dois clientes têm 35 anos. Um possui reserva robusta, horizonte de 20 anos e tolera oscilações; o outro usará os recursos em um ano e não aceita perdas relevantes.",prompt:"Qual conclusão é mais adequada?",options:["A idade isolada não define o perfil; objetivo, horizonte, capacidade e tolerância a risco também precisam ser avaliados.","Como têm a mesma idade, devem receber exatamente os mesmos produtos.","O cliente mais jovem sempre deve concentrar a carteira em ativos de maior risco.","Horizonte e necessidade de liquidez não influenciam a orientação."],correctAnswer:0,explanation:"Ciclo de vida e idade são relevantes, mas não substituem a avaliação do conjunto de objetivos, horizonte, situação financeira e tolerância a risco.",whyOthersAreWrong:["","Mesmo idade não implica mesmas necessidades.","Idade não autoriza concentração automática em risco.","Horizonte e liquidez são centrais para adequação."],sourceIds:["ANBIMA_PD","CVM_30"]}),oe({id:"CPA-Q062",pdCode:"3.1.2.1",macroTopic:Xe,topic:"Ciclo de vida financeiro",difficulty:"easy",cognitiveLevel:"comprehension",questionType:"multiple_choice",context:"Uma profissional iniciou a carreira, tem renda crescente e está formando patrimônio para objetivos futuros de longo prazo.",prompt:"Qual fase do ciclo financeiro descreve melhor esse momento?",options:["Acumulação de capital.","Distribuição de renda na aposentadoria.","Preservação exclusiva de capital após encerrar a vida laboral.","Liquidação compulsória de todo patrimônio."],correctAnswer:0,explanation:"Na fase de acumulação, o foco costuma estar na formação de patrimônio por meio de poupança e investimentos para objetivos futuros.",whyOthersAreWrong:["","Distribuição de renda é típica de fase em que patrimônio passa a financiar gastos.","Preservação ganha maior peso em fases posteriores, conforme objetivos e capacidade.","Não há regra de liquidação compulsória do patrimônio."],sourceIds:["ANBIMA_PD"]}),oe({id:"CPA-Q063",pdCode:"3.1.3.2",macroTopic:Xe,topic:"Capacidade de poupança",difficulty:"easy",cognitiveLevel:"comprehension",questionType:"multiple_choice",context:"Uma família recebe R$ 12 mil líquidos por mês e tem despesas recorrentes de R$ 10 mil, sem considerar eventos extraordinários.",prompt:"Qual informação o orçamento oferece inicialmente?",options:["Há capacidade potencial de poupança de R$ 2 mil antes de outros ajustes e metas.","A família obrigatoriamente deve investir R$ 12 mil por mês.","As despesas não importam para o planejamento financeiro.","Capacidade de poupança é calculada apenas pelo patrimônio já acumulado."],correctAnswer:0,explanation:"A diferença entre receitas e despesas é ponto de partida para estimar capacidade de poupança e construir um plano, que ainda deve considerar irregularidades e objetivos.",whyOthersAreWrong:["","Não se pode investir a renda inteira ignorando gastos.","Despesas são parte essencial do orçamento.","Patrimônio e fluxo são conceitos diferentes."],sourceIds:["ANBIMA_PD"]}),oe({id:"CPA-Q064",pdCode:"3.1.3.4.2",macroTopic:Xe,topic:"Reserva de emergência",difficulty:"easy",cognitiveLevel:"comprehension",questionType:"multiple_choice",context:"Um cliente está montando reserva para despesas imprevisíveis que podem surgir a qualquer momento.",prompt:"Qual característica do ativo é especialmente importante para essa finalidade?",options:["Alta liquidez e risco compatível com a necessidade de preservar disponibilidade.","Prazo muito longo e baixa possibilidade de venda antes do vencimento.","Alavancagem elevada para maximizar retorno.","Carência extensa obrigatória, independentemente do orçamento."],correctAnswer:0,explanation:"Reserva de emergência existe para atender necessidades inesperadas; por isso, liquidez e preservação de capital costumam ser prioridades relevantes.",whyOthersAreWrong:["","Baixa liquidez conflita com a função da reserva.","Alavancagem aumenta risco e não combina com a finalidade.","Carência longa pode impedir acesso quando necessário."],sourceIds:["ANBIMA_PD"]}),oe({id:"CPA-Q065",pdCode:"3.1.4.3",macroTopic:Xe,topic:"Patrimônio líquido pessoal",difficulty:"easy",cognitiveLevel:"comprehension",questionType:"multiple_choice",context:"Uma pessoa tem ativos de R$ 500 mil e obrigações financeiras de R$ 180 mil.",prompt:"Qual é seu patrimônio líquido pessoal, em uma visão simplificada?",options:["R$ 320 mil.","R$ 680 mil.","R$ 500 mil, porque dívidas não entram no cálculo.","R$ 180 mil."],correctAnswer:0,explanation:"Patrimônio líquido pessoal corresponde, de forma simplificada, aos ativos menos as obrigações: 500 - 180 = 320 mil.",whyOthersAreWrong:["","Somar ativos e dívidas não mede patrimônio líquido.","Obrigações devem ser consideradas.","R$ 180 mil corresponde às obrigações informadas, não ao patrimônio líquido."],sourceIds:["ANBIMA_PD"]}),oe({id:"CPA-Q066",pdCode:"3.1.5.1",macroTopic:Xe,topic:"Processo de planejamento financeiro",difficulty:"easy",cognitiveLevel:"comprehension",questionType:"multiple_choice",context:"Um plano financeiro foi implementado há um ano. Desde então, renda, despesas e objetivos familiares mudaram.",prompt:"Qual etapa é necessária para manter o plano útil?",options:["Monitorar e revisar periodicamente premissas, resultados e objetivos.","Manter o plano original sem alterações para preservar consistência.","Ignorar mudanças de renda, pois planejamento é feito apenas uma vez.","Substituir metas por produtos mais rentáveis sem nova análise."],correctAnswer:0,explanation:"Planejamento financeiro é processo contínuo: após implementação, deve haver monitoramento e revisão quando a situação ou os objetivos mudam.",whyOthersAreWrong:["","Rigidez pode tornar o plano inadequado.","Mudanças financeiras precisam ser incorporadas.","Produto não deve substituir a definição de objetivos e diagnóstico."],sourceIds:["ANBIMA_PD"]}),oe({id:"CPA-Q067",pdCode:"3.2.1",macroTopic:Xe,topic:"Investimento, risco e horizonte",difficulty:"easy",cognitiveLevel:"comprehension",questionType:"multiple_choice",context:"Uma cliente tem objetivo de curto prazo e baixa tolerância a perdas permanentes, mas considera produto volátil e com baixa liquidez.",prompt:"Qual princípio deve orientar a conversa?",options:["Compatibilizar produto com tolerância a risco, horizonte e necessidade de liquidez.","Escolher sempre o produto de maior retorno passado.","Ignorar o prazo se o emissor for conhecido.","Priorizar volatilidade alta para todo objetivo de curto prazo."],correctAnswer:0,explanation:"A orientação financeira deve conectar características do investimento às necessidades concretas do cliente, incluindo horizonte e tolerância a risco.",whyOthersAreWrong:["","Retorno passado não determina adequação.","Emissor conhecido não elimina incompatibilidade de prazo e liquidez.","Volatilidade alta não é requisito de objetivo curto."],sourceIds:["ANBIMA_PD","CVM_30"]}),oe({id:"CPA-Q068",pdCode:"3.3.4",macroTopic:Xe,topic:"Diversificação",difficulty:"easy",cognitiveLevel:"comprehension",questionType:"multiple_choice",context:"Um investidor concentra todo o patrimônio financeiro em uma única empresa porque conhece bem o negócio.",prompt:"Qual benefício da diversificação está ausente?",options:["Reduzir a dependência do resultado de um único emissor ou fator de risco.","Garantir lucro em qualquer cenário.","Eliminar completamente a volatilidade da carteira.","Transformar qualquer ativo em investimento sem risco."],correctAnswer:0,explanation:"Diversificação busca reduzir riscos específicos por distribuição entre exposições diferentes, sem garantir retorno ou eliminar todo risco.",whyOthersAreWrong:["","Diversificação não garante lucro.","Risco de mercado e outros fatores podem permanecer.","Nenhum processo torna todo ativo livre de risco."],sourceIds:["ANBIMA_PD","CVM_30"]}),oe({id:"CPA-Q069",pdCode:"3.4.3.1.1",macroTopic:Xe,topic:"Escuta ativa",difficulty:"easy",cognitiveLevel:"comprehension",questionType:"multiple_choice",context:"Durante atendimento, a profissional deixa o cliente concluir, confirma o que entendeu e faz perguntas para esclarecer prioridades antes de sugerir qualquer solução.",prompt:"Qual técnica de atendimento está sendo aplicada?",options:["Escuta ativa.","Venda por pressão.","Front running.","Churning."],correctAnswer:0,explanation:"Escuta ativa envolve atenção genuína, confirmação de entendimento e perguntas que ajudam a compreender necessidades antes de orientar.",whyOthersAreWrong:["","Pressão de venda é incompatível com o comportamento descrito.","Front running é prática ilícita de mercado.","Churning envolve giro excessivo de operações visando benefícios indevidos."],sourceIds:["ANBIMA_PD"]}),oe({id:"CPA-Q070",pdCode:"3.1.3.3.1",macroTopic:Xe,topic:"Gestão de dívidas",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Uma cliente tem saldo caro no rotativo do cartão e recebe uma oferta de crédito com custo efetivo menor e prazo compatível, suficiente para quitar a dívida mais onerosa.",prompt:"Qual análise faz sentido antes de decidir?",options:["Comparar custo total, prazo, garantias e impacto no orçamento, avaliando se a troca reduz o custo sem recriar endividamento.","Trocar a dívida apenas porque a parcela mensal é menor, sem olhar prazo ou custo total.","Manter sempre a dívida mais cara para preservar histórico bancário.","Contratar novo crédito adicional sem quitar a dívida anterior."],correctAnswer:0,explanation:"Gestão de dívidas exige comparar custo efetivo, prazo e capacidade de pagamento. Refinanciar pode ajudar quando reduz custo e vem acompanhado de controle orçamentário.",whyOthersAreWrong:["","Parcela menor pode esconder prazo maior e custo total superior.","Não há princípio de manter dívida cara por histórico.","Somar dívidas pode piorar o problema se não houver plano de quitação."],sourceIds:["ANBIMA_PD"]}),oe({id:"CPA-Q071",pdCode:"3.1.3.4.1",macroTopic:Xe,topic:"Dimensionamento da reserva de emergência",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Duas famílias têm a mesma renda, mas uma possui despesas essenciais maiores, renda variável e apenas um provedor; a outra tem renda estável de dois provedores e maior proteção securitária.",prompt:"O que isso sugere sobre a reserva de emergência?",options:["O valor adequado deve considerar despesas essenciais, estabilidade da renda, dependentes e outras proteções; não existe número universal.","A reserva deve ser idêntica porque a renda bruta é igual.","A reserva é definida apenas pela idade do titular.","Famílias com renda variável não precisam de reserva se investirem em ações."],correctAnswer:0,explanation:"Dimensionamento é contextual. Quanto maior a incerteza de renda e a dependência do caixa, maior pode ser a necessidade de colchão de liquidez.",whyOthersAreWrong:["","Mesma renda não implica mesma necessidade de proteção.","Idade é apenas um fator possível, não regra de cálculo.","Ativos voláteis não substituem necessariamente reserva líquida."],sourceIds:["ANBIMA_PD"]}),oe({id:"CPA-Q072",pdCode:"3.1.5.3",macroTopic:Xe,topic:"Metas financeiras",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Um cliente diz apenas “quero ficar rico”. A profissional precisa transformar a intenção em algo utilizável no planejamento.",prompt:"Qual reformulação é mais útil?",options:["Definir objetivo com valor, prazo, prioridade e critérios mensuráveis.","Escolher imediatamente o ativo que mais rendeu no último mês.","Manter a meta vaga para permitir qualquer recomendação.","Fixar retorno de 30% ao ano como garantia, sem avaliar risco."],correctAnswer:0,explanation:"Metas financeiras úteis são específicas e mensuráveis, com prazo e prioridade, permitindo estimar poupança necessária e acompanhar progresso.",whyOthersAreWrong:["","Produto deve vir depois do objetivo e diagnóstico.","Meta vaga dificulta planejamento.","Retorno futuro não deve ser prometido como garantia sem base."],sourceIds:["ANBIMA_PD"]}),oe({id:"CPA-Q073",pdCode:"3.1.5.6",macroTopic:Xe,topic:"Planejamento para aposentadoria",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Uma pessoa quer estimar quanto precisa acumular para reduzir dependência de renda do trabalho aos 60 anos.",prompt:"Quais variáveis são relevantes para o cálculo?",options:["Prazo até a aposentadoria, gastos desejados, patrimônio atual, capacidade de poupança, retorno esperado e horizonte de uso dos recursos.","Apenas a idade atual.","Somente o último salário recebido.","Somente a rentabilidade passada do investimento preferido."],correctAnswer:0,explanation:"Planejamento para aposentadoria é uma projeção de fluxos: depende de tempo, necessidade de renda, poupança, patrimônio, retorno e longevidade, entre outras premissas.",whyOthersAreWrong:["","Idade isolada não determina necessidade de capital.","Salário é apenas uma referência possível.","Rentabilidade passada não resolve o planejamento e não garante retorno futuro."],sourceIds:["ANBIMA_PD"]}),oe({id:"CPA-Q074",pdCode:"3.2.2.1",macroTopic:Xe,topic:"Financiamento de emergências",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Uma cliente sem reserva enfrenta despesa médica imprevista e precisa de crédito. Ela tem três opções com custos e prazos diferentes.",prompt:"Qual abordagem é mais adequada?",options:["Comparar custo efetivo, prazo, impacto no fluxo de caixa e risco de cada alternativa, buscando a solução menos onerosa compatível.","Escolher a opção com maior limite, independentemente do custo.","Usar sempre o cheque especial porque é de acesso imediato.","Ignorar o orçamento futuro porque a despesa é urgente."],correctAnswer:0,explanation:"Urgência não elimina a necessidade de comparar custo e capacidade de pagamento. A escolha deve resolver a necessidade sem criar desequilíbrio financeiro desnecessário.",whyOthersAreWrong:["","Limite maior não significa melhor crédito.","Cheque especial pode ter custo elevado e não é sempre a melhor opção.","O impacto futuro precisa ser considerado."],sourceIds:["ANBIMA_PD"]}),oe({id:"CPA-Q075",pdCode:"3.2.3",macroTopic:Xe,topic:"Gestão de investimentos",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Uma carteira que era adequada ficou muito concentrada em ações após forte valorização desse componente.",prompt:"Qual ação de gestão pode ser considerada?",options:["Reavaliar a alocação e, se coerente com o plano, rebalancear para restaurar a exposição desejada.","Manter a concentração indefinidamente porque valorizou no passado.","Comprar apenas o ativo que mais subiu para acelerar a concentração.","Ignorar mudanças de risco porque a carteira foi adequada no início."],correctAnswer:0,explanation:"Gestão de investimentos inclui monitorar mudanças de peso, risco e objetivos. Rebalanceamento pode restabelecer a alocação estratégica quando apropriado.",whyOthersAreWrong:["","Valorização passada não justifica concentração permanente.","Comprar vencedores sem análise pode aumentar risco.","Adequação deve ser monitorada ao longo do tempo."],sourceIds:["ANBIMA_PD","CVM_30"]}),oe({id:"CPA-Q076",pdCode:"3.3.2",macroTopic:Xe,topic:"Adequação de produtos",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Um investidor conservador precisa do dinheiro em seis meses. Um produto tem prazo longo, baixa liquidez e possibilidade relevante de perda se vendido antecipadamente.",prompt:"Qual conclusão é mais consistente?",options:["O produto pode ser inadequado por conflito com horizonte, liquidez e tolerância a risco, mesmo que tenha retorno esperado maior.","O maior retorno esperado torna o produto adequado automaticamente.","Perfil conservador é irrelevante se o emissor for conhecido.","Prazo de uso do dinheiro nunca entra na adequação."],correctAnswer:0,explanation:"Suitability não se resume a retorno. Horizonte, liquidez, objetivos e tolerância/capacidade de risco devem ser compatíveis com o produto.",whyOthersAreWrong:["","Retorno não supera automaticamente incompatibilidades de risco e prazo.","Reputação do emissor não substitui análise do cliente.","Horizonte é elemento central da adequação."],sourceIds:["ANBIMA_PD","CVM_30"]}),oe({id:"CPA-Q077",pdCode:"3.4.2.2",macroTopic:Xe,topic:"Informações da clientela",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"O questionário de um cliente foi preenchido há anos. Desde então ele se aposentou, passou a depender da carteira para renda e vendeu sua empresa.",prompt:"Qual providência é apropriada antes de nova recomendação relevante?",options:["Atualizar as informações usadas na avaliação, pois mudanças podem alterar objetivos, capacidade de risco e adequação.","Usar indefinidamente o cadastro antigo porque perfil nunca muda.","Classificar automaticamente o cliente como agressivo por ter vendido uma empresa.","Ignorar a nova necessidade de renda."],correctAnswer:0,explanation:"Informações desatualizadas podem comprometer suitability. Mudanças de renda, patrimônio, objetivo e horizonte justificam revisão do diagnóstico.",whyOthersAreWrong:["","Perfil e situação podem mudar.","Venda de empresa não determina perfil por si só.","Necessidade de renda é informação essencial."],sourceIds:["ANBIMA_PD","ANBIMA_DISTRIBUICAO","CVM_30"]}),oe({id:"CPA-Q078",pdCode:"3.4.2.5",macroTopic:Xe,topic:"Produto e objetivo da clientela",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Uma pessoa tem perfil capaz de tolerar risco, mas o recurso específico será usado para pagar matrícula escolar em quatro meses.",prompt:"Qual elemento pode impedir uma recomendação de ativo muito volátil para esse dinheiro?",options:["O objetivo específico e o horizonte curto, apesar da tolerância geral a risco.","Nenhum, pois o perfil agressivo autoriza qualquer produto para qualquer objetivo.","Somente a idade da pessoa.","A existência de outras aplicações líquidas torna o prazo irrelevante."],correctAnswer:0,explanation:"Adequação deve conectar produto ao objetivo concreto. Um cliente pode tolerar risco no patrimônio de longo prazo e ainda precisar de solução conservadora para um compromisso próximo.",whyOthersAreWrong:["","Perfil não elimina análise por objetivo.","Idade isolada não resolve a decisão.","Outros ativos podem ajudar, mas não tornam automaticamente o prazo irrelevante."],sourceIds:["ANBIMA_PD","CVM_30"]}),oe({id:"CPA-Q079",pdCode:"3.4.2.6",macroTopic:Xe,topic:"Monitoramento de suitability",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Após uma recomendação adequada, o mercado muda, o cliente perde parte da renda e antecipa seu objetivo em dois anos.",prompt:"Qual atitude reflete monitoramento contínuo?",options:["Reavaliar a adequação diante das novas informações e ajustar a orientação se necessário.","Manter toda recomendação original porque suitability só existe no primeiro contato.","Aumentar risco para compensar a perda de renda.","Desconsiderar mudança de objetivo enquanto o produto não vencer."],correctAnswer:0,explanation:"Suitability é processo que exige atualização conforme regras e mudanças relevantes no cliente ou nos produtos.",whyOthersAreWrong:["","Adequação não é análise única e imutável.","Perda de renda não justifica automaticamente assumir mais risco.","Objetivo alterado deve ser considerado."],sourceIds:["ANBIMA_PD","ANBIMA_DISTRIBUICAO","CVM_30"]}),oe({id:"CPA-Q080",pdCode:"3.4.2.7",macroTopic:Xe,topic:"Comunicação clara",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Um produto tem retorno potencial elevado, mas também possibilidade de perdas e baixa liquidez. O material comercial enfatiza somente o cenário positivo.",prompt:"Qual prática é mais adequada no atendimento?",options:["Apresentar benefícios, riscos, liquidez, custos e limitações de forma equilibrada e compreensível.","Omitir riscos porque podem reduzir a conversão comercial.","Usar apenas termos técnicos sem verificar entendimento do cliente.","Prometer retorno para compensar a baixa liquidez."],correctAnswer:0,explanation:"Comunicação deve ser clara, transparente e equilibrada, permitindo decisão informada e evitando destaque seletivo de benefícios.",whyOthersAreWrong:["","Omissão de riscos prejudica transparência.","Jargão sem compreensão não atende ao objetivo de comunicação clara.","Retorno futuro não deve ser prometido indevidamente."],sourceIds:["ANBIMA_PD","ANBIMA_DISTRIBUICAO"]}),oe({id:"CPA-Q081",pdCode:"3.4.3.3.2",macroTopic:Xe,topic:"Benefícios e incentivos",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Uma instituição recebe remuneração maior na distribuição do Produto A do que do Produto B. Ambos podem atender a clientes semelhantes, mas têm custos e riscos diferentes.",prompt:"Qual risco de conduta merece atenção?",options:["O incentivo econômico pode gerar conflito de interesses e deve ser gerido com políticas, transparência e foco no interesse do cliente.","Remuneração diferente elimina automaticamente qualquer conflito.","O profissional deve sempre escolher o produto que paga mais à instituição.","Conflitos só existem quando há parentesco entre profissional e cliente."],correctAnswer:0,explanation:"Incentivos financeiros podem influenciar recomendações. A instituição deve identificar, gerir e, quando aplicável, comunicar conflitos, preservando adequação e interesse do cliente.",whyOthersAreWrong:["","Diferença de remuneração pode criar, não eliminar, conflito.","Remuneração do canal não deve substituir critérios de adequação.","Conflitos têm várias origens além de relações pessoais."],sourceIds:["ANBIMA_PD","ANBIMA_DISTRIBUICAO"]}),oe({id:"CPA-Q082",pdCode:"3.4.5.3",macroTopic:Xe,topic:"PLDFT baseada em risco",difficulty:"medium",cognitiveLevel:"application",questionType:"case",context:"Uma instituição possui clientes com perfis, canais e produtos muito diferentes. Para prevenção à lavagem de dinheiro, a área de compliance pretende aplicar exatamente o mesmo nível de diligência a todas as situações, sem avaliar risco.",prompt:"Qual abordagem é mais consistente com o modelo baseado em risco?",options:["Avaliar riscos relevantes e calibrar políticas, controles e diligências de forma proporcional, mantendo requisitos mínimos aplicáveis.","Ignorar diferenças de risco e usar apenas um formulário idêntico como controle completo.","Dispensar controles para clientes antigos.","Concentrar controles apenas em operações de alto valor e ignorar outros sinais."],correctAnswer:0,explanation:"Abordagem baseada em risco parte da identificação e avaliação dos riscos para direcionar controles e recursos de forma proporcional, sem eliminar obrigações mínimas.",whyOthersAreWrong:["","Uniformidade sem análise pode ser insuficiente.","Tempo de relacionamento não elimina risco.","Valor é apenas um fator; contexto e sinais também importam."],sourceIds:["ANBIMA_PD","BCB_SFN"]}),oe({id:"CPA-Q083",pdCode:"3.4.5.4.1",macroTopic:Xe,topic:"Conheça seu cliente (KYC)",difficulty:"medium",cognitiveLevel:"application",questionType:"case",context:"Um cliente antigo passa a movimentar valores incompatíveis com sua renda cadastrada, e seus dados financeiros não são atualizados há vários anos.",prompt:"Qual providência é mais adequada?",options:["Atualizar cadastro, compreender capacidade financeira e avaliar as movimentações segundo procedimentos de KYC e PLDFT.","Ignorar porque clientes antigos não precisam de atualização.","Aumentar automaticamente o limite de movimentação sem análise.","Excluir qualquer registro anterior para evitar divergências."],correctAnswer:0,explanation:"Cadastro atualizado e compreensão da capacidade financeira ajudam a identificar incompatibilidades e proteger instituição e profissional no processo de prevenção.",whyOthersAreWrong:["","Relacionamento antigo não dispensa atualização.","Limite não deve ser ampliado para contornar sinal de risco.","Registros devem seguir regras de conservação, não ser apagados para ocultar divergência."],sourceIds:["ANBIMA_PD","ANBIMA_DISTRIBUICAO"]}),oe({id:"CPA-Q084",pdCode:"3.4.4.4",macroTopic:Xe,topic:"Risco de imagem",difficulty:"hard",cognitiveLevel:"analysis",questionType:"case",context:"Uma instituição cumpre formalmente determinada obrigação, mas seus profissionais passam a adotar comunicação agressiva e enganosa nas redes sociais. O comportamento gera ampla repercussão negativa, perda de clientes e desconfiança do mercado.",prompt:"Qual risco se materializa de forma mais direta?",options:["Risco de imagem, sem excluir possíveis riscos legais ou regulatórios associados.","Risco cambial exclusivamente.","Risco de taxa de juros apenas.","Risco de liquidez de um título público."],correctAnswer:0,explanation:"Deterioração de reputação e confiança caracteriza risco de imagem. Dependendo da conduta, também podem existir consequências legais e regulatórias.",whyOthersAreWrong:["","Não há exposição cambial descrita.","O caso não decorre de variação de juros.","Não envolve negociação ou liquidez de título público."],sourceIds:["ANBIMA_PD"]}),oe({id:"CPA-Q085",pdCode:"3.4.6.3",macroTopic:Xe,topic:"LGPD no atendimento",difficulty:"hard",cognitiveLevel:"analysis",questionType:"case",context:"Para oferecer um produto simples, uma equipe decide coletar grande quantidade de dados pessoais sem definir finalidade clara, apenas porque “podem ser úteis no futuro”.",prompt:"Qual princípio de proteção de dados é especialmente tensionado?",options:["Necessidade/minimização: tratar dados adequados e pertinentes ao propósito definido, evitando coleta excessiva.","Livre acesso ao mercado financeiro.","Garantia do FGC.","Marcação a mercado."],correctAnswer:0,explanation:"A LGPD adota princípios que incluem necessidade, finalidade e adequação. Coleta indiscriminada sem propósito claro conflita com esses fundamentos.",whyOthersAreWrong:["","Livre acesso ao mercado não é princípio de tratamento de dados.","FGC trata de garantia de créditos elegíveis.","Marcação a mercado é conceito de precificação."],sourceIds:["ANBIMA_PD","ANPD_LGPD","PLANALTO_LGPD"]}),oe({id:"CPA-Q086",pdCode:"3.4.7.2.2.2.2",macroTopic:Xe,topic:"Spoofing",difficulty:"hard",cognitiveLevel:"analysis",questionType:"case",context:"Um operador insere grande quantidade de ordens que não pretende executar para criar falsa percepção de oferta e induzir outros participantes; depois cancela as ordens e negocia no lado oposto.",prompt:"Qual prática o caso exemplifica?",options:["Spoofing.","Diversificação.","Portabilidade.","Suitability."],correctAnswer:0,explanation:"Spoofing envolve uso de ordens sem intenção genuína de execução para criar sinal enganoso de oferta ou demanda e influenciar o mercado.",whyOthersAreWrong:["","Diversificação é técnica de gestão de carteira.","Portabilidade é transferência entre instituições/produtos conforme regras.","Suitability é avaliação de adequação ao cliente."],sourceIds:["ANBIMA_PD","CVM_62"]}),oe({id:"CPA-Q087",pdCode:"3.4.7.2.2.4.3",macroTopic:Xe,topic:"Front running",difficulty:"hard",cognitiveLevel:"analysis",questionType:"case",context:"Um profissional toma conhecimento de uma grande ordem de cliente que provavelmente moverá o preço. Antes de executar a ordem do cliente, negocia para sua própria conta visando lucrar com o impacto esperado.",prompt:"Qual conduta está sendo descrita?",options:["Front running.","Rebalanceamento.","Hedge legítimo do cliente.","Consolidação de dívidas."],correctAnswer:0,explanation:"Front running é negociação em benefício próprio com base no conhecimento prévio de ordem relevante de cliente, prejudicando integridade e equidade.",whyOthersAreWrong:["","Rebalanceamento ajusta pesos de carteira e não depende de antecipar ordem alheia para ganho próprio.","Hedge do cliente tem objetivo de gestão de risco do cliente, não proveito pessoal antecipado.","Consolidação de dívidas é tema de finanças pessoais."],sourceIds:["ANBIMA_PD","CVM_62"]}),oe({id:"CPA-Q088",pdCode:"3.4.2.4",macroTopic:Xe,topic:"Adequação ao perfil",difficulty:"hard",cognitiveLevel:"analysis",questionType:"dialog_tree",context:"Chat. Cliente: “Meu amigo ganhou muito com um ativo alavancado. Nunca investi nisso, não entendo como funciona e não posso perder esse dinheiro porque pagarei uma cirurgia em cinco meses.”",prompt:"Qual resposta do profissional é mais adequada?",options:["“Antes de qualquer recomendação, precisamos considerar seu objetivo próximo, capacidade de perda, conhecimento e riscos do produto; a experiência do seu amigo não define adequação para você.”","“Se seu amigo ganhou, o produto é adequado para você também.”","“Assine um termo e todo risco deixa de ser relevante.”","“Alavancagem é apropriada sempre que o prazo é curto.”"],correctAnswer:0,explanation:"Adequação é individual e considera objetivos, conhecimento, situação e tolerância/capacidade de risco. Comparações com terceiros não substituem o processo.",whyOthersAreWrong:["","Experiência de terceiro não determina perfil.","Formalização não apaga riscos nem obrigações.","Prazo curto não torna alavancagem adequada por definição."],sourceIds:["ANBIMA_PD","CVM_30","ANBIMA_DISTRIBUICAO"]}),oe({id:"CPA-Q089",pdCode:"3.4.3.1.5",macroTopic:Xe,topic:"Gerenciamento de expectativas",difficulty:"hard",cognitiveLevel:"analysis",questionType:"dialog_tree",context:"Chat. Cliente: “Quero dobrar meu dinheiro em um ano sem correr risco. Você consegue garantir?”",prompt:"Qual resposta demonstra melhor gerenciamento de expectativas?",options:["“Não posso garantir retorno incompatível com o risco. Podemos definir meta, horizonte e capacidade de perda para avaliar alternativas realistas e explicar incertezas.”","“Sim, todo produto de maior retorno esperado pode ser garantido.”","“Basta escolher o investimento que mais subiu no último ano.”","“Risco só existe quando o cliente vende com prejuízo.”"],correctAnswer:0,explanation:"Atendimento ético exige alinhar expectativas a risco, horizonte e incerteza, sem promessas indevidas de retorno.",whyOthersAreWrong:["","Retorno maior geralmente envolve riscos e não deve ser prometido como garantia.","Performance passada não garante repetição.","Risco existe antes da venda e pode se materializar de diferentes formas."],sourceIds:["ANBIMA_PD","ANBIMA_DISTRIBUICAO"]}),oe({id:"CPA-Q090",pdCode:"3.4.5.4",macroTopic:Xe,topic:"KYC e movimentação incompatível",difficulty:"hard",cognitiveLevel:"analysis",questionType:"dialog_tree",context:"Chat interno. Gerente: “Cliente recém-cadastrado declara renda modesta, mas começa a receber transferências recorrentes muito superiores e pede que ninguém faça perguntas porque é ‘dinheiro de família’.”",prompt:"Qual resposta da equipe de compliance é mais adequada?",options:["“Precisamos compreender origem e compatibilidade das movimentações, atualizar informações e aplicar os procedimentos de KYC/PLDFT e eventual tratamento de operação suspeita.”","“A justificativa verbal basta e impede qualquer análise adicional.”","“Como é dinheiro de família, controles de PLDFT não se aplicam.”","“Devemos avisar ao cliente previamente qualquer conclusão interna para que ajuste as movimentações.”"],correctAnswer:0,explanation:"Incompatibilidade entre perfil e movimentação é sinal que exige diligência segundo políticas e abordagem baseada em risco, sem prejulgar o cliente.",whyOthersAreWrong:["","Justificativa verbal não encerra diligência automaticamente.","Origem familiar não elimina deveres de controle.","Procedimentos de comunicação e análise seguem regras próprias e não devem ser usados para ensinar como evitar controles."],sourceIds:["ANBIMA_PD","ANBIMA_DISTRIBUICAO"]})],Yt="Inovação e desenvolvimento de mercado",bC=[oe({id:"CPA-Q091",pdCode:"4.1.1",macroTopic:Yt,topic:"ESG",difficulty:"easy",cognitiveLevel:"comprehension",questionType:"multiple_choice",context:"Uma gestora avalia emissões de carbono, relações trabalhistas e composição do conselho de administração de uma companhia.",prompt:"Esses três grupos de fatores correspondem, respectivamente, a quais dimensões ESG?",options:["Ambiental, social e governança.","Governança, ambiental e social.","Social, governança e ambiental.","Crédito, mercado e liquidez."],correctAnswer:0,explanation:"ESG organiza fatores ambientais (E), sociais (S) e de governança (G). Emissões, relações de trabalho e estrutura de governança são exemplos típicos dessas dimensões.",whyOthersAreWrong:["","A ordem das dimensões está trocada.","A ordem não corresponde aos exemplos.","Crédito, mercado e liquidez são categorias de riscos financeiros, não dimensões ESG."],sourceIds:["ANBIMA_PD","CVM_ESG"]}),oe({id:"CPA-Q092",pdCode:"4.4.1",macroTopic:Yt,topic:"Finanças descentralizadas",difficulty:"easy",cognitiveLevel:"comprehension",questionType:"multiple_choice",context:"Um protocolo permite que usuários realizem determinadas operações financeiras por meio de aplicações em blockchain e contratos programáveis, sem reproduzir necessariamente a estrutura tradicional de intermediários.",prompt:"Qual conceito está mais relacionado ao caso?",options:["Finanças Descentralizadas (DeFi).","Fundo Garantidor de Créditos.","Mercado monetário tradicional.","Previdência complementar fechada."],correctAnswer:0,explanation:"DeFi descreve aplicações financeiras baseadas em redes distribuídas e protocolos programáveis, com arquitetura distinta de muitos arranjos tradicionais.",whyOthersAreWrong:["","FGC é mecanismo de garantia de créditos elegíveis.","Mercado monetário tradicional não define a arquitetura descentralizada descrita.","Previdência fechada é outro segmento financeiro."],sourceIds:["ANBIMA_PD"]}),oe({id:"CPA-Q093",pdCode:"4.4.3.1",macroTopic:Yt,topic:"Smart contracts",difficulty:"easy",cognitiveLevel:"comprehension",questionType:"multiple_choice",context:"Um código em blockchain executa automaticamente uma transferência quando condições previamente programadas são satisfeitas.",prompt:"Qual tecnologia o exemplo ilustra?",options:["Smart contract.","Cheque especial.","Rating de crédito.","Cota de fundo aberto."],correctAnswer:0,explanation:"Smart contracts são programas que executam regras previamente codificadas quando condições definidas são atendidas, dentro da infraestrutura em que foram implantados.",whyOthersAreWrong:["","Cheque especial é modalidade de crédito bancário.","Rating é avaliação de risco de crédito.","Cota de fundo representa participação em fundo, não código autoexecutável."],sourceIds:["ANBIMA_PD"]}),oe({id:"CPA-Q094",pdCode:"4.4.4.4",macroTopic:Yt,topic:"Tokenização",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Uma empresa tokeniza direitos econômicos ligados a um ativo real e divulga que o uso de blockchain elimina necessidade de analisar riscos jurídicos, tecnológicos e regulatórios.",prompt:"Qual avaliação é correta?",options:["Tokenização pode melhorar eficiência e fracionamento, mas não elimina riscos de tecnologia, segurança, estrutura jurídica ou regulação.","Blockchain elimina qualquer risco do ativo subjacente.","Todo token é automaticamente moeda de curso legal.","Tokenização garante liquidez diária e preço estável."],correctAnswer:0,explanation:"Tokenização altera a representação e possível negociação de direitos, mas riscos do ativo, da infraestrutura, da custódia e do enquadramento regulatório permanecem relevantes.",whyOthersAreWrong:["","Tecnologia não elimina riscos econômicos ou jurídicos.","Token não é, por definição, moeda de curso legal.","Liquidez e estabilidade dependem do mercado e da estrutura."],sourceIds:["ANBIMA_PD","CVM"]}),oe({id:"CPA-Q095",pdCode:"4.5.1.1",macroTopic:Yt,topic:"Open Finance",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Uma cliente autoriza, por canal próprio do ecossistema, o compartilhamento de seus dados financeiros entre instituições participantes para buscar oferta mais adequada. Depois, decide revogar a autorização.",prompt:"Qual princípio é central no Open Finance?",options:["O compartilhamento ocorre mediante consentimento e controles previstos no arranjo, com possibilidade de gestão pelo cliente.","Os dados são compartilhados livremente sem autorização do cliente.","O cliente perde definitivamente o controle após o primeiro consentimento.","Open Finance é uma base pública em que qualquer empresa acessa dados bancários."],correctAnswer:0,explanation:"Open Finance brasileiro é centrado em compartilhamento padronizado e seguro de dados/serviços mediante consentimento do cliente e regras de governança.",whyOthersAreWrong:["","Consentimento é elemento central do compartilhamento.","O cliente pode gerir consentimentos conforme regras aplicáveis.","Não se trata de base pública aberta a qualquer empresa."],sourceIds:["ANBIMA_PD","BCB_OPEN_FINANCE"]}),oe({id:"CPA-Q096",pdCode:"4.5.3.1",macroTopic:Yt,topic:"Open Investment",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Um investidor quer visualizar posições mantidas em instituições diferentes e facilitar jornadas digitais relacionadas a seus investimentos, respeitando consentimentos e padrões do ecossistema.",prompt:"Qual iniciativa se conecta diretamente a esse objetivo?",options:["Open Investment dentro do ecossistema de Open Finance.","FGC como plataforma de negociação.","Selic como questionário de suitability.","PREVIC como sistema de pagamentos instantâneos."],correctAnswer:0,explanation:"Open Investment amplia o compartilhamento padronizado de informações e serviços relativos a investimentos dentro do ecossistema de Open Finance.",whyOthersAreWrong:["","FGC não é plataforma de negociação ou compartilhamento de investimentos.","Selic é taxa/infraestrutura relacionada a títulos públicos, não questionário de suitability.","PREVIC supervisiona previdência complementar fechada."],sourceIds:["ANBIMA_PD","BCB_OPEN_FINANCE"]}),oe({id:"CPA-Q097",pdCode:"4.6.3",macroTopic:Yt,topic:"IA no atendimento",difficulty:"medium",cognitiveLevel:"application",questionType:"multiple_choice",context:"Um banco usa assistente virtual com inteligência artificial para responder dúvidas de clientes. A equipe percebe que o modelo às vezes produz respostas confiantes, porém incorretas, sobre produtos.",prompt:"Qual controle é mais adequado?",options:["Definir limites de uso, validação de conteúdo, escalonamento para atendimento humano e monitoramento contínuo das respostas.","Permitir que a IA prometa rentabilidade para reduzir tempo de atendimento.","Eliminar revisão humana porque modelos sempre produzem respostas factuais.","Usar dados pessoais sem governança, pois IA dispensa regras de privacidade."],correctAnswer:0,explanation:"IA pode apoiar atendimento, mas exige governança, monitoramento, tratamento de erros e respeito a regras de conduta e proteção de dados.",whyOthersAreWrong:["","Promessas indevidas não se tornam aceitáveis por serem geradas por IA.","Modelos podem errar e precisam de controles.","Uso de IA não afasta obrigações de privacidade e segurança."],sourceIds:["ANBIMA_PD","ANPD_LGPD"]}),oe({id:"CPA-Q098",pdCode:"4.4.3.5",macroTopic:Yt,topic:"Aplicações de smart contracts",difficulty:"medium",cognitiveLevel:"application",questionType:"case",context:"Uma empresa deseja automatizar etapas de um contrato de empréstimo. O pagamento de determinada parcela liberaria automaticamente uma garantia digital, desde que dados confiáveis confirmem o evento. A diretoria afirma que “ser automático” torna o contrato infalível.",prompt:"Qual análise é mais adequada?",options:["A automação pode reduzir etapas operacionais, mas a qualidade do código, dos dados de entrada, da segurança e do enquadramento jurídico continua crítica.","Smart contract elimina qualquer risco porque código não pode conter falhas.","Automação dispensa verificar identidade das partes e validade jurídica.","Qualquer evento externo é conhecido pela blockchain sem necessidade de fonte de dados."],correctAnswer:0,explanation:"Smart contracts executam regras programadas, mas podem depender de código, infraestrutura e dados externos. Automação não elimina riscos tecnológicos, jurídicos ou de segurança.",whyOthersAreWrong:["","Código pode ter bugs ou vulnerabilidades.","Requisitos jurídicos e de identificação continuam relevantes conforme o caso.","Eventos externos normalmente exigem mecanismos de entrada de dados, não são conhecidos automaticamente."],sourceIds:["ANBIMA_PD"]}),oe({id:"CPA-Q099",pdCode:"4.5.1.1.1",macroTopic:Yt,topic:"Open Finance e crédito",difficulty:"hard",cognitiveLevel:"analysis",questionType:"case",context:"Uma pequena emp
